name: Fehler melden
description: Etwas in der App funktioniert nicht wie erwartet.
title: "Fehler: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass du dir die Zeit nimmst. Sicherheitslücken bitte nicht hier melden, sondern wie in SECURITY.md beschrieben.
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Kurz beschreiben, was du gesehen hast und was du stattdessen erwartet hättest.
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. App öffnen
        2. Sender LineFM +RAP wählen
        3. …
    validations:
      required: true
  - type: dropdown
    id: plattform
    attributes:
      label: Plattform
      multiple: true
      options:
        - Web (Browser)
        - Android
        - Android Auto
        - iOS
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App-Version und Gerät
      description: Steht unter Einstellungen > Über LINEFM Radio. Dazu Gerät, Betriebssystem und bei Web den Browser.
      placeholder: "X.Y.Z (Build), Pixel 7, Android 15"
    validations:
      required: true
  - type: textarea
    id: anhang
    attributes:
      label: Screenshots oder Log
      description: Optional. Bitte keine persönlichen Daten, Passwörter oder Tokens.
  - type: checkboxes
    id: hilfstechnik
    attributes:
      label: Barrierefreiheit
      options:
        - label: Der Fehler tritt mit Screenreader, Tastatur oder starker Vergrößerung auf.
