name: Prepare Apple signing
description: >
  Imports distribution certificate(s) into a temporary keychain, installs the
  provisioning profiles and writes an ExportOptions.plist (manual signing, the
  matching profile for each bundle ID). For macOS runners only. Untested (no Apple
  account, no Mac in development). The caller removes the keychain with
  "security delete-keychain" (if: always()).

inputs:
  p12-base64:
    description: Apple Distribution certificate (.p12, base64)
    required: true
  p12-password:
    required: true
  installer-p12-base64:
    description: Mac Installer certificate (.p12, base64), only for the Mac App Store package
    required: false
    default: ""
  installer-p12-password:
    required: false
    default: ""
  profiles-base64:
    description: Provisioning profiles, one base64 profile per line (app and, if present, widget)
    required: true
  platform:
    description: ios or macos
    required: true
  team-id:
    required: true

outputs:
  export-options:
    description: Path of the generated ExportOptions.plist
    value: ${{ steps.profiles.outputs.export_options }}
  keychain:
    description: Path of the temporary keychain
    value: ${{ steps.keychain.outputs.keychain }}

runs:
  using: composite
  steps:
    - name: Import certificates
      id: keychain
      shell: bash
      env:
        P12_BASE64: ${{ inputs.p12-base64 }}
        P12_PASSWORD: ${{ inputs.p12-password }}
        INSTALLER_P12_BASE64: ${{ inputs.installer-p12-base64 }}
        INSTALLER_P12_PASSWORD: ${{ inputs.installer-p12-password }}
      run: |
        set -euo pipefail
        umask 077
        kc="$RUNNER_TEMP/store-signing.keychain-db"
        kcpw="$(openssl rand -hex 24)"
        security create-keychain -p "$kcpw" "$kc"
        security set-keychain-settings -lut 21600 "$kc"
        security unlock-keychain -p "$kcpw" "$kc"
        import_p12() {
          local b64="$1" pw="$2" f="$RUNNER_TEMP/import.p12"
          printf '%s' "$b64" | base64 --decode > "$f"
          security import "$f" -P "$pw" -A -t cert -f pkcs12 -k "$kc"
          rm -f "$f"
        }
        import_p12 "$P12_BASE64" "$P12_PASSWORD"
        if [ -n "$INSTALLER_P12_BASE64" ]; then
          import_p12 "$INSTALLER_P12_BASE64" "$INSTALLER_P12_PASSWORD"
        fi
        security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" >/dev/null
        security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
        echo "keychain=$kc" >> "$GITHUB_OUTPUT"

    - name: Install profiles and write ExportOptions
      id: profiles
      shell: bash
      env:
        PROFILES_BASE64: ${{ inputs.profiles-base64 }}
        PLATFORM: ${{ inputs.platform }}
        TEAM_ID: ${{ inputs.team-id }}
      run: |
        set -euo pipefail
        umask 077
        ext="mobileprovision"
        if [ "$PLATFORM" = "macos" ]; then ext="provisionprofile"; fi
        dirs=("$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles")
        for d in "${dirs[@]}"; do mkdir -p "$d"; done

        opts="$RUNNER_TEMP/ExportOptions.plist"
        PB=/usr/libexec/PlistBuddy
        rm -f "$opts"
        "$PB" -c "Add :method string app-store-connect" "$opts"
        "$PB" -c "Add :teamID string $TEAM_ID" "$opts"
        "$PB" -c "Add :signingStyle string manual" "$opts"
        "$PB" -c "Add :signingCertificate string Apple Distribution" "$opts"
        "$PB" -c "Add :uploadSymbols bool true" "$opts"
        "$PB" -c "Add :manageAppVersionAndBuildNumber bool false" "$opts"
        "$PB" -c "Add :destination string export" "$opts"
        "$PB" -c "Add :provisioningProfiles dict" "$opts"
        if [ "$PLATFORM" = "macos" ]; then
          "$PB" -c "Add :installerSigningCertificate string 3rd Party Mac Developer Installer" "$opts"
        fi

        n=0
        while IFS= read -r line; do
          line="${line//$'\r'/}"
          [ -z "${line// /}" ] && continue
          n=$((n + 1))
          raw="$RUNNER_TEMP/profile-$n.$ext"
          plist="$RUNNER_TEMP/profile-$n.plist"
          printf '%s' "$line" | base64 --decode > "$raw"
          security cms -D -i "$raw" > "$plist"
          uuid="$("$PB" -c 'Print :UUID' "$plist")"
          name="$("$PB" -c 'Print :Name' "$plist")"
          appid="$("$PB" -c 'Print :Entitlements:application-identifier' "$plist")"
          bundle="${appid#*.}"
          for d in "${dirs[@]}"; do cp "$raw" "$d/$uuid.$ext"; done
          "$PB" -c "Add :provisioningProfiles:$bundle string $name" "$opts"
          # Log names only, never contents.
          echo "Profile installed: $name ($bundle)"
          rm -f "$plist"
        done <<< "$PROFILES_BASE64"
        if [ "$n" -eq 0 ]; then echo "::error::No provisioning profiles provided"; exit 1; fi
        echo "export_options=$opts" >> "$GITHUB_OUTPUT"
