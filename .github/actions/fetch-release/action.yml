name: Fetch release files
description: >
  Validates the version tag (vX.Y.Z or vX.Y.Z-suffix) and downloads matching files
  from the GitHub release. The store and deploy workflows therefore always use
  exactly the artifacts that release.yml built, verified and attested.
  Every file must carry a build provenance attestation from release.yml (built on main).
  The caller needs contents: read (the repository is public, attestations are readable).

inputs:
  tag:
    description: Version tag, vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N
    required: true
  pattern:
    description: Glob for the asset names (gh release download --pattern)
    required: true
  dir:
    description: Target folder
    required: false
    default: dist
  token:
    description: Token with read access to the repository (github.token)
    required: true

outputs:
  label:
    description: Version without the leading v
    value: ${{ steps.dl.outputs.label }}
  prerelease:
    description: "'true' if the tag has a suffix (pre-release)"
    value: ${{ steps.dl.outputs.prerelease }}

runs:
  using: composite
  steps:
    - name: Download release files
      id: dl
      shell: bash
      env:
        FETCH_TAG: ${{ inputs.tag }}
        FETCH_PATTERN: ${{ inputs.pattern }}
        FETCH_DIR: ${{ inputs.dir }}
        FETCH_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if ! [[ "$FETCH_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Tag '$FETCH_TAG' is not a version (expected vX.Y.Z or vX.Y.Z-suffix)"
          exit 1
        fi
        mkdir -p "$FETCH_DIR"
        gh release download "$FETCH_TAG" --repo "$FETCH_REPO" --pattern "$FETCH_PATTERN" --dir "$FETCH_DIR"
        ls -la "$FETCH_DIR"
        # Use the files only if release.yml built and attested them for exactly this tag.
        shopt -s nullglob
        files=("$FETCH_DIR"/*)
        if [ "${#files[@]}" -eq 0 ]; then
          echo "::error::No release files match '$FETCH_PATTERN'"
          exit 1
        fi
        for f in "${files[@]}"; do
          gh attestation verify "$f" --repo "$FETCH_REPO"             --signer-workflow "$FETCH_REPO/.github/workflows/release.yml"             --source-ref refs/heads/main             --deny-self-hosted-runners > /dev/null
          echo "Attestation verified: $(basename "$f")"
        done
        {
          echo "label=${FETCH_TAG#v}"
          if [[ "$FETCH_TAG" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
        } >> "$GITHUB_OUTPUT"
