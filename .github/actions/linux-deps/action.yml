name: Linux system packages
description: >
  Installs the development packages for the Linux desktop build. Also needed for
  "flutter test", because native-asset hooks (e.g. cnativeapi via tray_manager)
  build against GTK 3, X11 and Xi on the host. sentry-native needs libcurl.

runs:
  using: composite
  steps:
    - name: Install apt packages
      shell: bash
      run: |
        bash "$GITHUB_WORKSPACE/tool/ci/apt_update.sh" -q
        sudo apt-get install -y -q --no-install-recommends \
          clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev \
          libmpv-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libcurl4-openssl-dev
