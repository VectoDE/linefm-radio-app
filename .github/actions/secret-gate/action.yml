name: Secret gate
description: >
  Evaluates precomputed availability flags (secrets cannot be checked directly in
  job-level if expressions). The calling job passes one NAME=true|false per line
  (the expression "secrets.NAME != empty" is evaluated in the calling workflow).
  Result: the output "ready" (all present) and one line per missing secret in the
  job summary. Values are never printed, only names.

inputs:
  label:
    description: Name of the guarded step (for the summary)
    required: true
  checks:
    description: Multi-line, one NAME=true or NAME=false per line
    required: true

outputs:
  ready:
    description: "'true' if all listed secrets/variables are set"
    value: ${{ steps.eval.outputs.ready }}
  missing:
    description: Comma-separated names of the missing secrets/variables
    value: ${{ steps.eval.outputs.missing }}

runs:
  using: composite
  steps:
    - name: Check secrets
      id: eval
      shell: bash
      env:
        GATE_LABEL: ${{ inputs.label }}
        GATE_CHECKS: ${{ inputs.checks }}
      run: |
        set -euo pipefail
        missing=()
        while IFS= read -r line; do
          line="${line//$'\r'/}"
          line="$(echo "$line" | xargs)"
          [ -z "$line" ] && continue
          name="${line%%=*}"
          value="${line#*=}"
          if [ "$value" != "true" ]; then
            missing+=("$name")
          fi
        done <<< "$GATE_CHECKS"
        if [ "${#missing[@]}" -eq 0 ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "missing=" >> "$GITHUB_OUTPUT"
          echo "- $GATE_LABEL: active" >> "$GITHUB_STEP_SUMMARY"
        else
          joined="$(IFS=, ; echo "${missing[*]}")"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "missing=$joined" >> "$GITHUB_OUTPUT"
          echo "- $GATE_LABEL: skipped, missing: ${joined//,/, }" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=$GATE_LABEL skipped::missing: ${joined//,/, }"
        fi
