name: Flutter einrichten
description: >
  Installiert die festgelegte Flutter-Version mit SDK- und Pub-Cache und holt die
  Abhaengigkeiten. Plattformspezifische Systempakete installieren die Jobs selbst.

inputs:
  flutter-version:
    description: Exakte Flutter-Version (stable). Muss zu pubspec.yaml (environment.flutter) passen.
    required: false
    default: "3.50.0"
  pub-get:
    description: "'true' fuehrt flutter pub get aus."
    required: false
    default: "true"

outputs:
  version:
    description: Installierte Flutter-Version
    value: ${{ steps.flutter.outputs.VERSION }}

runs:
  using: composite
  steps:
    # flutter-action references actions/cache by tag internally, which the
    # repository rule "require actions pinned to a full-length commit SHA"
    # rejects. Its own caching therefore stays off: a dry run resolves the
    # cache paths and keys, our SHA-pinned cache steps restore them, and the
    # second call installs the SDK into the restored path.
    - name: Flutter-Cache-Schluessel ermitteln
      id: flutter-keys
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: false
        pub-cache: false
        dry-run: true

    - name: Flutter-SDK-Cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.flutter-keys.outputs.CACHE-PATH }}
        key: ${{ steps.flutter-keys.outputs.CACHE-KEY }}

    - name: Pub-Cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.flutter-keys.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.flutter-keys.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}

    - name: Flutter-SDK installieren
      id: flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: false
        pub-cache: false

    - name: Flutter-Version ausgeben
      shell: bash
      run: |
        flutter --version
        flutter config --no-analytics >/dev/null
        dart --disable-analytics >/dev/null 2>&1 || true

    - name: Abhaengigkeiten holen
      if: inputs.pub-get == 'true'
      shell: bash
      run: flutter pub get --enforce-lockfile
