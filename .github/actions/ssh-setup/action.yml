name: Prepare SSH
description: >
  Creates the key and known_hosts for rsync/ssh. The host key comes from a secret
  (known_hosts) and is checked strictly: StrictHostKeyChecking=yes, no ssh-keyscan,
  no "no". Host and user are checked for harmless characters only.
  Output: the ssh command (for rsync -e) and the target user@host. Cleanup: a
  cleanup step in the caller (if: always()), or the files only live in RUNNER_TEMP.

inputs:
  host:
    required: true
  user:
    required: true
  key:
    description: Private key (OpenSSH, no passphrase)
    required: true
  known-hosts:
    description: Line(s) from known_hosts for the host (ssh-keyscan output, verified once)
    required: true
  port:
    required: false
    default: "22"

outputs:
  ssh-command:
    description: Ready-made ssh command for rsync -e
    value: ${{ steps.setup.outputs.ssh_command }}
  target:
    description: user@host
    value: ${{ steps.setup.outputs.target }}

runs:
  using: composite
  steps:
    - name: Write key and known_hosts
      id: setup
      shell: bash
      env:
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.user }}
        SSH_KEY: ${{ inputs.key }}
        SSH_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        SSH_PORT: ${{ inputs.port }}
      run: |
        set -euo pipefail
        if ! [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then echo "::error::Host contains disallowed characters"; exit 1; fi
        if ! [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then echo "::error::User contains disallowed characters"; exit 1; fi
        if ! [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]; then echo "::error::Invalid port"; exit 1; fi
        dir="$RUNNER_TEMP/ssh"
        umask 077
        mkdir -p "$dir"
        printf '%s\n' "$SSH_KEY" > "$dir/id"
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$dir/known_hosts"
        {
          echo "ssh_command=ssh -i $dir/id -p $SSH_PORT -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$dir/known_hosts"
          echo "target=$SSH_USER@$SSH_HOST"
        } >> "$GITHUB_OUTPUT"
