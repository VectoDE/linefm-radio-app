name: Release-Tag und pubspec-Platzhalter pruefen
description: >
  #104: Die Version kommt aus dem Release, nicht aus pubspec.yaml. Prueft, dass
  der Tag eine SemVer-Version vX.Y.Z oder vX.Y.Z-(alpha|beta|rc).N ist und dass
  pubspec.yaml nur den Entwicklungs-Platzhalter 0.0.0-dev traegt (er gelangt nie
  in ein Release; --build-name/--build-number setzt der Workflow). Genutzt von
  release.yml und, fuer manuelle Starts, von den store-*.yml.

inputs:
  tag:
    description: Versions-Tag, z. B. v0.1.0-alpha.3 oder v1.0.0
    required: true

runs:
  using: composite
  steps:
    - name: Pruefen
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
          echo "::error::Tag $TAG hat nicht das Format vX.Y.Z oder vX.Y.Z-(alpha|beta|rc).N"
          exit 1
        fi
        pub="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' pubspec.yaml | head -n1)"
        if [ "${pub%%+*}" != "0.0.0-dev" ]; then
          echo "::error::pubspec.yaml muss version: 0.0.0-dev+<n> tragen (gefunden: $pub). Die Version kommt aus dem Release (#104)."
          exit 1
        fi
        echo "Tag $TAG gueltig, pubspec.yaml traegt den Platzhalter ($pub)." >> "$GITHUB_STEP_SUMMARY"
