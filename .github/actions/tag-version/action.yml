name: Check release tag and pubspec placeholder
description: >
  The version comes from the release, not from pubspec.yaml. Checks that the tag
  is a SemVer version vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N and that pubspec.yaml
  only carries the development placeholder 0.0.0-dev (it never ends up in a
  release; the workflow sets --build-name/--build-number). Used by release.yml and,
  for manual runs, by the store-*.yml workflows.

inputs:
  tag:
    description: Version tag, vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N
    required: true

runs:
  using: composite
  steps:
    - name: Check
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
          echo "::error::Tag $TAG does not have the format vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"
          exit 1
        fi
        pub="$(sed -n 's/^version:[[:space:]]*\([^[:space:]#]*\).*/\1/p' pubspec.yaml | head -n1)"
        if [ "${pub%%+*}" != "0.0.0-dev" ]; then
          echo "::error::pubspec.yaml must carry version: 0.0.0-dev+<n> (found: $pub). The version comes from the release."
          exit 1
        fi
        echo "Tag $TAG is valid, pubspec.yaml carries the placeholder ($pub)." >> "$GITHUB_STEP_SUMMARY"
