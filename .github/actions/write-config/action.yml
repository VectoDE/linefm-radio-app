name: Write build configuration
description: >
  Generates config/app.json (build values for --dart-define-from-file) from
  config/app.example.yaml and config/features.example.yaml and overrides only the
  values that are set as inputs (from repository variables/secrets).
  Empty inputs keep the default from the example file. All values end up in the
  binary and are publicly readable: pass public IDs only.
  Afterwards, optionally: enable Firebase (tool/enable_firebase.dart, only with a
  Firebase configuration) and generate/fill the legal texts (tool/gen_legal_html.dart).
  Requires Flutter to be set up already.

inputs:
  features-json:
    description: >
      Content for config/features.yaml as JSON (repository variable FEATURES_JSON),
      e.g. {"showListenerCount": true}. Empty = values from
      config/features.example.yaml (everything off).
    required: false
    default: ""
  app-env:
    description: dev or prod
    required: false
    default: prod
  app-version:
    description: Display version (APP_VERSION) from the release (format X.Y.Z or X.Y.Z-stage.N); empty = development version
    required: false
    default: ""
  web-base-url:
    required: false
    default: ""
  umami-url:
    required: false
    default: ""
  umami-website-id:
    required: false
    default: ""
  sentry-dsn:
    required: false
    default: ""
  sentry-environment:
    required: false
    default: ""
  gsc-verification:
    required: false
    default: ""
  gtm-id:
    description: Google Tag Manager container (GTM-...), web only, loaded only after consent
    required: false
    default: ""
  ga4-measurement-id:
    description: GA4 measurement ID (G-...), web only, loaded only after consent
    required: false
    default: ""
  trust-gridinsoft-url:
    required: false
    default: ""
  trust-trustpilot-url:
    required: false
    default: ""
  firebase-config-json:
    description: >
      Optional JSON object with FIREBASE_* keys (from the secret
      FIREBASE_CONFIG_JSON). If set, FIREBASE_ENABLED=true is set and the
      Firebase package is wired in via tool/enable_firebase.dart.
    required: false
    default: ""
  legal-values-json:
    description: >
      JSON object placeholder -> value for the imprint/privacy policy (e.g. BETREIBER_NAME),
      from the repository variable LEGAL_VALUES_JSON. Empty = placeholders stay open.
    required: false
    default: ""
  legal-strict:
    description: "'true' fails the build while required placeholders are still open."
    required: false
    default: "false"

outputs:
  providers:
    description: Active telemetry providers (comma-separated)
    value: ${{ steps.cfg.outputs.providers }}

runs:
  using: composite
  steps:
    - name: Write config/app.json
      id: cfg
      shell: pwsh
      env:
        CFG_APP_ENV: ${{ inputs.app-env }}
        CFG_APP_VERSION: ${{ inputs.app-version }}
        CFG_WEB_BASE_URL: ${{ inputs.web-base-url }}
        CFG_UMAMI_URL: ${{ inputs.umami-url }}
        CFG_UMAMI_WEBSITE_ID: ${{ inputs.umami-website-id }}
        CFG_SENTRY_DSN: ${{ inputs.sentry-dsn }}
        CFG_SENTRY_ENVIRONMENT: ${{ inputs.sentry-environment }}
        CFG_GSC_VERIFICATION: ${{ inputs.gsc-verification }}
        CFG_GTM_ID: ${{ inputs.gtm-id }}
        CFG_GA4_MEASUREMENT_ID: ${{ inputs.ga4-measurement-id }}
        CFG_TRUST_GRIDINSOFT_URL: ${{ inputs.trust-gridinsoft-url }}
        CFG_TRUST_TRUSTPILOT_URL: ${{ inputs.trust-trustpilot-url }}
        CFG_FIREBASE_CONFIG_JSON: ${{ inputs.firebase-config-json }}
        CFG_FEATURES_JSON: ${{ inputs.features-json }}
      run: |
        $ErrorActionPreference = 'Stop'
        # Read flat YAML files from config/ (key: value, comments
        # with #). tool/check_config.dart validates format and values in CI.
        function Read-FlatYaml([string]$path) {
          $h = [ordered]@{}
          foreach ($line in Get-Content -Path $path -Encoding utf8) {
            if ($line -match '^([A-Za-z_][A-Za-z0-9_]*):\s*(.*?)\s*$') {
              $k = $Matches[1]; $v = $Matches[2]
              if ($v -match '^"(.*)"$' -or $v -match "^'(.*)'$") { $v = $Matches[1] }
              elseif ($v -eq 'true') { $v = $true }
              elseif ($v -eq 'false') { $v = $false }
              $h[$k] = $v
            }
          }
          return $h
        }
        $cfg = Read-FlatYaml 'config/app.example.yaml'
        $map = [ordered]@{
          'APP_ENV'              = $env:CFG_APP_ENV
          'APP_VERSION'          = $env:CFG_APP_VERSION
          'WEB_BASE_URL'         = $env:CFG_WEB_BASE_URL
          'UMAMI_URL'            = $env:CFG_UMAMI_URL
          'UMAMI_WEBSITE_ID'     = $env:CFG_UMAMI_WEBSITE_ID
          'SENTRY_DSN'           = $env:CFG_SENTRY_DSN
          'SENTRY_ENVIRONMENT'   = $env:CFG_SENTRY_ENVIRONMENT
          'GSC_VERIFICATION'     = $env:CFG_GSC_VERIFICATION
          'GTM_ID'               = $env:CFG_GTM_ID
          'GA4_MEASUREMENT_ID'   = $env:CFG_GA4_MEASUREMENT_ID
          'TRUST_GRIDINSOFT_URL' = $env:CFG_TRUST_GRIDINSOFT_URL
          'TRUST_TRUSTPILOT_URL' = $env:CFG_TRUST_TRUSTPILOT_URL
        }
        $set = @()
        foreach ($k in $map.Keys) {
          if (-not [string]::IsNullOrWhiteSpace($map[$k])) {
            $cfg[$k] = $map[$k].Trim()
            $set += $k
          }
        }
        if (-not [string]::IsNullOrWhiteSpace($env:CFG_FIREBASE_CONFIG_JSON)) {
          $fb = $env:CFG_FIREBASE_CONFIG_JSON | ConvertFrom-Json -AsHashtable
          foreach ($k in $fb.Keys) {
            if ($k -like 'FIREBASE_*') { $cfg[$k] = $fb[$k]; $set += $k }
          }
          $cfg['FIREBASE_ENABLED'] = $true
          $set += 'FIREBASE_ENABLED'
        }
        # Switches from config/features.example.yaml (default off), overridden
        # by FEATURES_JSON; known keys only, true/false only.
        $feat = Read-FlatYaml 'config/features.example.yaml'
        if (-not [string]::IsNullOrWhiteSpace($env:CFG_FEATURES_JSON)) {
          $over = $env:CFG_FEATURES_JSON | ConvertFrom-Json -AsHashtable
          foreach ($k in $over.Keys) {
            if (-not $feat.ContainsKey($k)) { throw "FEATURES_JSON: unknown key $k" }
            if ($over[$k] -isnot [bool]) { throw "FEATURES_JSON: $k must be true or false" }
            $feat[$k] = $over[$k]
            $set += $k
          }
        }
        foreach ($k in $feat.Keys) { $cfg[$k] = $feat[$k] }
        New-Item -ItemType Directory -Force -Path 'config' | Out-Null
        $cfg | ConvertTo-Json -Depth 5 | Set-Content -Path 'config/app.json' -Encoding utf8NoBOM

        # Derive the active telemetry providers for the legal texts.
        $providers = @()
        if ($cfg['UMAMI_URL'] -and $cfg['UMAMI_WEBSITE_ID']) { $providers += 'umami' }
        if ($cfg['SENTRY_DSN']) { $providers += 'sentry' }
        if ($cfg['FIREBASE_ENABLED'] -eq $true) { $providers += 'firebase' }
        # Legal texts: additionally "ga4" (Google Analytics section, web pages
        # and web app only; the store check only knows the telemetry providers).
        $legal = @($providers)
        if ($cfg['GTM_ID'] -or $cfg['GA4_MEASUREMENT_ID']) { $legal += 'ga4' }
        "legal_providers=$($legal -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "providers=$($providers -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "firebase=$(if ($cfg['FIREBASE_ENABLED'] -eq $true) { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

        # Log key names only, never values.
        $list = if ($set.Count -gt 0) { ($set | Sort-Object -Unique) -join ', ' } else { 'none (defaults only)' }
        $prov = if ($providers.Count -gt 0) { $providers -join ', ' } else { 'none' }
        "config/app.json written. Keys set: $list. Telemetry: $prov"
        "- Build configuration: keys set: $list; telemetry providers: $prov" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

    - name: Wire in Firebase
      if: steps.cfg.outputs.firebase == 'true' && hashFiles('tool/enable_firebase.dart') != ''
      shell: bash
      # Start the script outside the package (dart: imports only): otherwise "dart run"
      # first builds all native-asset hooks of the project (GTK etc. needed on the host).
      run: |
        cp tool/enable_firebase.dart "$RUNNER_TEMP/enable_firebase.dart"
        dart run "$RUNNER_TEMP/enable_firebase.dart"

    - name: Generate legal texts
      if: hashFiles('tool/gen_legal_html.dart') != ''
      shell: bash
      env:
        PROVIDERS: ${{ steps.cfg.outputs.legal_providers }}
        LEGAL_VALUES_JSON: ${{ inputs.legal-values-json }}
        LEGAL_STRICT: ${{ inputs.legal-strict }}
        BASE_URL: ${{ inputs.web-base-url }}
      run: |
        set -euo pipefail
        args=("--providers=$PROVIDERS" "--fill-assets")
        if [ -n "${LEGAL_VALUES_JSON// /}" ]; then
          values="$RUNNER_TEMP/legal_values.json"
          printf '%s' "$LEGAL_VALUES_JSON" > "$values"
          args+=("--values=$values")
        fi
        if [ -n "$BASE_URL" ]; then args+=("--base-url=$BASE_URL"); fi
        if [ "$LEGAL_STRICT" = "true" ]; then args+=("--strict"); fi
        set +e
        # Start outside the package (see the Firebase step), the working directory stays the repo.
        cp tool/gen_legal_html.dart "$RUNNER_TEMP/gen_legal_html.dart"
        dart run "$RUNNER_TEMP/gen_legal_html.dart" "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/legal.log"
        status=${PIPESTATUS[0]}
        set -e
        # The grep pattern matches German output of tool/gen_legal_html.dart.
        if grep -q "Open placeholders" "$RUNNER_TEMP/legal.log"; then
          echo "- Legal texts: $(grep 'Open placeholders' "$RUNNER_TEMP/legal.log") (variable LEGAL_VALUES_JSON)" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "- Legal texts: all placeholders filled" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"
