version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns: ["*"]

  # Hauptpaket und optionales Firebase-Paket (packages/linefm_firebase hat keine eigene
  # pubspec.lock, Dependabot liest dort die pubspec.yaml).
  - package-ecosystem: pub
    directories:
      - /
      - /packages/linefm_firebase
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
    open-pull-requests-limit: 10
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
      - plattform:android
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  # Basisimage des Web-Containers (deploy/traefik/Dockerfile, per Digest gepinnt).
  - package-ecosystem: docker
    directory: /deploy/traefik
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
      - typ:infra

  # Images in den Compose-Dateien (Traefik-Stack, Telemetrie: Umami, GlitchTip, Datenbanken).
  - package-ecosystem: docker-compose
    directories:
      - /deploy/traefik
      - /deploy/telemetry
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
      - typ:infra

  # Pruefwerkzeug der Barrierefreiheit (Playwright, axe-core), nur CI.
  - package-ecosystem: npm
    directory: /tool/a11y
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      a11y-tools:
        patterns: ["*"]
