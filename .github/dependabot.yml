version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
    open-pull-requests-limit: 10
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
      - android
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  # Basisimage des Web-Containers (deploy/traefik/Dockerfile, per Digest gepinnt).
  - package-ecosystem: docker
    directory: /deploy/traefik
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
      - typ:infra

  # Images in den Compose-Dateien (Traefik-Stack, Telemetrie: Umami, GlitchTip, Datenbanken).
  - package-ecosystem: docker-compose
    directories:
      - /deploy/traefik
      - /deploy/telemetry
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
      - typ:infra
