version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns: ["*"]

  # Main package and optional Firebase package (packages/linefm_firebase has no
  # pubspec.lock of its own, Dependabot reads its pubspec.yaml).
  - package-ecosystem: pub
    directories:
      - /
      - /packages/linefm_firebase
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
    open-pull-requests-limit: 10
    groups:
      pub-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
      - plattform:android
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  # Base images of the web container (deploy/traefik/Dockerfile) and the dev container
  # (.devcontainer/Dockerfile), each pinned by digest.
  - package-ecosystem: docker
    directories:
      - /deploy/traefik
      - /.devcontainer
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
      - typ:infra

  # Images in the Compose files (Traefik stack, telemetry: Umami, GlitchTip, databases).
  - package-ecosystem: docker-compose
    directories:
      - /deploy/traefik
      - /deploy/telemetry
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    labels:
      - dependencies
      - typ:infra

  # Accessibility testing tool (Playwright, axe-core), CI only.
  - package-ecosystem: npm
    directory: /tool/a11y
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    groups:
      a11y-tools:
        patterns: ["*"]
