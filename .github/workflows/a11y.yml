name: Accessibility

# axe-core check of the web version. Builds like ci.yml (web-smoke), runs
# tool/a11y/run.mjs (Playwright + @axe-core/playwright, versions in
# tool/a11y/package-lock.json) and checks stations, player, history, favorites,
# settings, alarm, about, the dialogs "Clear storage" and time, the sheets
# "Sleep timer" and "Export favorites", plus imprint and privacy policy (de/en)
# at 390 and 1280 px, light and dark (58 runs).
# Gate: no violation of any impact level (baseline 0), every view
# reachable. Checks axe cannot decide ("incomplete") appear in the report and
# summary but do not fail the run.
# Local runtime (2026-11-19, Windows, 8 cores): web build 95 s, axe 142 s;
# on the 4-core runner roughly double plus installation; plus the second
# web build with test IDs for the Google network check, hence 40 minutes.
# What axe does not find (screen reader flow, keyboard traps, comprehensibility)
# remains manual work, see docs/BARRIEREFREIHEIT.md.

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so new failures show up even without a commit.
  schedule:
    - cron: "29 4 * * 5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: a11y-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  axe:
    name: axe (WCAG 2.2, Web)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Build web
        run: |
          set -euo pipefail
          mapfile -t web_defines < <(bash tool/web_define_passthrough.sh)
          flutter build web --release --wasm --no-web-resources-cdn             --dart-define-from-file=config/app.json --base-href / "${web_defines[@]}"

      - name: Fallback fonts and postbuild
        run: |
          # Run outside the package (dart: imports only), as in ci.yml.
          cp tool/fetch_font_fallback.dart tool/web_postbuild.dart "$RUNNER_TEMP/"
          dart run "$RUNNER_TEMP/fetch_font_fallback.dart" build/web --strict
          dart run "$RUNNER_TEMP/web_postbuild.dart" build/web --no-precompress

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/a11y/package-lock.json

      - name: Install check tooling
        working-directory: tool/a11y
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      - name: axe check
        working-directory: tool/a11y
        timeout-minutes: 12
        run: node run.mjs --web ../../build/web --out out

      # Reach measurement with Google: without IDs no request goes to Google,
      # with test IDs only after consent. The test aborts requests to Google
      # in the browser, nothing leaves for the network.
      - name: Google network check without IDs
        working-directory: tool/a11y
        timeout-minutes: 5
        run: node analytics_net.mjs --web ../../build/web --mode none

      # Google Cast without hardware: tool/a11y/cast_net.mjs serves the build with
      # the deployed CSP and answers the gstatic cast_sender.js request with a
      # fake Cast SDK. Checks consent gating, loadMedia (stream URL, metadata),
      # revocation and that no CSP violation occurs.
      - name: Google Cast check with a fake Cast SDK
        working-directory: tool/a11y
        timeout-minutes: 5
        run: node cast_net.mjs --web ../../build/web --hosting ../../build/hosting

      # Serves the build with the CSP of the rendered nginx snippet and fails on
      # any CSP violation (style hashes and build nonce must cover the engine).
      - name: CSP check (no violations with the nginx policy)
        working-directory: tool/a11y
        timeout-minutes: 5
        run: node csp_check.mjs --web ../../build/web --hosting ../../build/hosting

      - name: CSP without IDs has no Google sources
        run: |
          if grep -q "googletagmanager" build/hosting/nginx/snippets/linefm-headers.conf; then
            echo "::error::CSP without IDs contains Google sources"
            exit 1
          fi

      - name: Summary
        if: ${{ always() }}
        working-directory: tool/a11y
        run: |
          if [ -f out/axe-report.json ]; then
            jq -r '"**axe:** \(.summary.runs) runs, \(.summary.violations) violations, \(.summary.unreachable) unreachable, \(.summary.incomplete) undecided (\(.summary.incompleteRules | join(", "))), \(.durationMs / 1000 | floor) s, Commit `\(.commit)`"' out/axe-report.json >> "$GITHUB_STEP_SUMMARY"
            jq -r '.results[] | select(.error or ((.violations // []) | length > 0)) | "- \(.theme) \(.layout) \(.view): \(.error // ([.violations[] | "\(.id) (\(.impact))"] | join(", ")))"' out/axe-report.json >> "$GITHUB_STEP_SUMMARY"
            printf '\nUndecided per rule (check manually):\n' >> "$GITHUB_STEP_SUMMARY"
            jq -r '[.results[] | (.incomplete // [])[] | .id] | group_by(.) | map("- \(.[0]): \(length) views") | .[]' out/axe-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**axe:** no report generated" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axe-report-${{ github.sha }}
          path: tool/a11y/out/
          retention-days: 30
          if-no-files-found: warn

  # Reach measurement with Google, test-ID half: a second web build with
  # test IDs, run beside the axe job so its build does not lengthen it.
  analytics:
    name: Google tag check (test IDs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Build web with test IDs (GTM-TEST000, G-TEST000000)
        run: |
          set -euo pipefail
          cp tool/fetch_font_fallback.dart tool/web_postbuild.dart "$RUNNER_TEMP/"
          mapfile -t web_defines < <(bash tool/web_define_passthrough.sh)
          jq '.GTM_ID = "GTM-TEST000" | .GA4_MEASUREMENT_ID = "G-TEST000000"' config/app.json > "$RUNNER_TEMP/app_ga.json"
          flutter build web --release --wasm --no-web-resources-cdn             --dart-define-from-file="$RUNNER_TEMP/app_ga.json" --base-href / --output build/web_ga "${web_defines[@]}"
          dart run "$RUNNER_TEMP/fetch_font_fallback.dart" build/web_ga --strict
          dart run "$RUNNER_TEMP/web_postbuild.dart" build/web_ga --config "$RUNNER_TEMP/app_ga.json"             --hosting-out build/hosting_ga --no-precompress
          grep -q "https://www.googletagmanager.com" build/hosting_ga/nginx/snippets/linefm-headers.conf

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/a11y/package-lock.json

      - name: Install check tooling
        working-directory: tool/a11y
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      - name: Google network check with test IDs
        working-directory: tool/a11y
        timeout-minutes: 5
        run: node analytics_net.mjs --web ../../build/web_ga --mode ids

  # Android accessibility tree in the emulator: the same tree TalkBack reads.
  # Walks the five areas plus Alarm and About and fails on an unlabelled
  # interactive node or a touch target under 48 x 48 dp
  # (tool/a11y/android_walk.py). The image is google_apis_playstore; when it
  # carries TalkBack, the job turns TalkBack on, checks that the service is
  # bound while the app runs and records the tree. Spoken output is not
  # captured (TalkBack has no supported speech log); that stays a device check.
  android-tree:
    name: Android accessibility tree and TalkBack (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go /usr/local/julia* || true
          df -h /

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      # Debug builds carry the debug signature, so the emulator installs them.
      - name: Build APK (x86_64, debug)
        run: flutter build apk --debug --target-platform android-x64 --dart-define-from-file=config/app.json

      - name: Boot emulator
        timeout-minutes: 20
        env:
          EMULATOR_TAG: google_apis_playstore
          EMULATOR_BOOT_POLLS: "450"
        run: |
          bash tool/perf/android_emulator.sh tool/a11y/out-android
          # The boot script puts platform-tools on PATH only for itself; the
          # following steps call adb directly.
          echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

      - name: Walk the screens and check the tree
        timeout-minutes: 15
        run: |
          set -euo pipefail
          adb install -r build/app/outputs/flutter-apk/app-debug.apk >/dev/null
          adb shell am start -W -n de.linefm.app/.MainActivity >/dev/null
          sleep 20
          python3 -I tool/a11y/android_walk.py "$(command -v adb)" --out tool/a11y/out-android

      - name: TalkBack on the running app
        timeout-minutes: 10
        run: |
          set -euo pipefail
          out=tool/a11y/out-android
          service="com.google.android.marvin.talkback/com.google.android.marvin.talkback.TalkBackService"
          if ! adb shell pm list packages com.google.android.marvin.talkback | grep -q talkback; then
            echo "absent" > "$out/talkback.txt"
            echo "TalkBack is not installed on this system image; tree check only."
            exit 0
          fi
          adb shell settings put secure enabled_accessibility_services "$service"
          adb shell settings put secure accessibility_enabled 1
          sleep 10
          adb shell am start -W -n de.linefm.app/.MainActivity >/dev/null
          sleep 10
          adb shell dumpsys accessibility > "$out/talkback-dumpsys.txt"
          adb shell uiautomator dump /sdcard/talkback.xml >/dev/null
          adb exec-out cat /sdcard/talkback.xml > "$out/tree-with-talkback.xml"
          adb shell settings delete secure enabled_accessibility_services >/dev/null
          adb shell settings put secure accessibility_enabled 0
          if ! grep -q "TalkBackService" "$out/talkback-dumpsys.txt"; then
            echo "::error::TalkBack is installed but its service did not bind"
            exit 1
          fi
          grep -q 'package="de.linefm.app"' "$out/tree-with-talkback.xml"
          echo "bound" > "$out/talkback.txt"

      - name: Summary
        if: ${{ always() }}
        run: |
          out=tool/a11y/out-android
          if [ -f "$out/walk.json" ]; then
            jq -r '"**Android tree:** \(.screens | length) screens, \([.screens[] | (.problems // []) | length] | add) findings, \([.screens[] | select(.error)] | length) unreachable"' "$out/walk.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Android tree:** no report generated" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "**TalkBack:** $(cat "$out/talkback.txt" 2>/dev/null || echo 'not checked')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-a11y-tree-${{ github.sha }}
          path: tool/a11y/out-android/
          retention-days: 30
          if-no-files-found: warn

  # Apple's accessibility audit (performAccessibilityAudit, iOS 17) on the
  # main screens in the simulator, from ios/RunnerUITests. It checks the tree
  # VoiceOver reads (labels, hit regions, contrast, clipped text, reachable
  # elements); it is not spoken VoiceOver output.
  ios-audit:
    name: iOS accessibility audit (simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Pick a simulator and start booting it
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid')
          test -n "$udid" && test "$udid" != "null"
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Configure the iOS project
        run: |
          flutter precache --ios
          flutter build ios --config-only --simulator --debug --dart-define-from-file=config/app.json

      - name: Run the accessibility audit
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild test -quiet \
            -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$UDID,arch=arm64" \
            -derivedDataPath build/derived-data \
            -resultBundlePath "$RUNNER_TEMP/ios-a11y/audit.xcresult" \
            -parallel-testing-enabled NO -disable-concurrent-destination-testing \
            -only-testing:RunnerUITests/AccessibilityAuditTests \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -d "$RUNNER_TEMP/ios-a11y/audit.xcresult" ]; then
            echo "**iOS accessibility audit:** result bundle in artifact ios-a11y-audit" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**iOS accessibility audit:** no result bundle" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-a11y-audit-${{ github.sha }}
          path: ${{ runner.temp }}/ios-a11y/
          retention-days: 30
          if-no-files-found: warn

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [axe, analytics, android-tree, ios-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
