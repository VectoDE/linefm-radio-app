name: Barrierefreiheit

# axe-core-Pruefung der Web-Version (A4). Baut wie ci.yml (web-smoke), startet
# tool/a11y/run.mjs (Playwright + @axe-core/playwright, Versionen in
# tool/a11y/package-lock.json) und prueft Sender, Player, Verlauf, Favoriten,
# Einstellungen, Wecker, Ueber, die Dialoge "Speicher loeschen" und Uhrzeit,
# die Sheets "Sleeptimer" und "Favoriten exportieren" sowie Impressum und
# Datenschutz (de/en) bei 390 und 1280 px, hell und dunkel (58 Laeufe).
# Gate: kein Verstoss gleich welcher Stufe (Baseline 0), jede Ansicht
# erreichbar. Von axe nicht entscheidbare Pruefungen ("incomplete") stehen in
# Bericht und Zusammenfassung, brechen aber nicht ab.
# Laufzeit lokal (19.11.2026, Windows, 8 Kerne): Web-Build 95 s, axe 142 s;
# auf dem 4-Kern-Runner grob das Doppelte plus Installation; dazu der zweite
# Web-Build mit Test-IDs fuer die Google-Netzpruefung (P31), daher 40 Minuten.
# Was axe nicht findet (Screenreader-Ablauf, Tastaturfallen, Verstaendlichkeit),
# bleibt Handarbeit, siehe docs/BARRIEREFREIHEIT.md.

on:
  pull_request:
  push:
    branches: [main]
  # Woechentlich, damit neue Fehler auch ohne Commit auffallen.
  schedule:
    - cron: "29 4 * * 5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: a11y-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  axe:
    name: axe (WCAG 2.2, Web)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Flutter einrichten
        uses: ./.github/actions/setup-flutter

      - name: Konfiguration schreiben
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Web bauen
        run: |
          set -euo pipefail
          mapfile -t web_defines < <(bash tool/web_define_passthrough.sh)
          flutter build web --release --wasm --no-web-resources-cdn             --dart-define-from-file=config/app.json --base-href / "${web_defines[@]}"

      - name: Ersatzschriften und Postbuild
        run: |
          # Ausserhalb des Pakets starten (nur dart:-Importe), wie in ci.yml.
          cp tool/fetch_font_fallback.dart tool/web_postbuild.dart "$RUNNER_TEMP/"
          dart run "$RUNNER_TEMP/fetch_font_fallback.dart" build/web --strict
          dart run "$RUNNER_TEMP/web_postbuild.dart" build/web

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/a11y/package-lock.json

      - name: Pruefwerkzeug installieren
        working-directory: tool/a11y
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      - name: axe-Pruefung
        working-directory: tool/a11y
        timeout-minutes: 12
        run: node run.mjs --web ../../build/web --out out

      # Reichweitenmessung mit Google (P31): ohne IDs keine Anfrage an Google,
      # mit Test-IDs erst nach Zustimmung. Anfragen an Google bricht der Test
      # im Browser ab, es geht nichts ins Netz.
      - name: Google-Netzpruefung ohne IDs
        working-directory: tool/a11y
        timeout-minutes: 5
        run: node analytics_net.mjs --web ../../build/web --mode none

      - name: Web mit Test-IDs bauen (GTM-TEST000, G-TEST000000)
        run: |
          set -euo pipefail
          mapfile -t web_defines < <(bash tool/web_define_passthrough.sh)
          jq '.GTM_ID = "GTM-TEST000" | .GA4_MEASUREMENT_ID = "G-TEST000000"' config/app.json > "$RUNNER_TEMP/app_ga.json"
          flutter build web --release --wasm --no-web-resources-cdn             --dart-define-from-file="$RUNNER_TEMP/app_ga.json" --base-href / --output build/web_ga "${web_defines[@]}"
          dart run "$RUNNER_TEMP/fetch_font_fallback.dart" build/web_ga --strict
          dart run "$RUNNER_TEMP/web_postbuild.dart" build/web_ga --config "$RUNNER_TEMP/app_ga.json"             --hosting-out build/hosting_ga
          grep -q "https://www.googletagmanager.com" build/hosting_ga/nginx/snippets/linefm-headers.conf
          if grep -q "googletagmanager" build/hosting/nginx/snippets/linefm-headers.conf; then
            echo "::error::CSP ohne IDs enthaelt Google-Quellen"
            exit 1
          fi

      - name: Google-Netzpruefung mit Test-IDs
        working-directory: tool/a11y
        timeout-minutes: 5
        run: node analytics_net.mjs --web ../../build/web_ga --mode ids

      - name: Zusammenfassung
        if: ${{ always() }}
        working-directory: tool/a11y
        run: |
          if [ -f out/axe-report.json ]; then
            jq -r '"**axe:** \(.summary.runs) Laeufe, \(.summary.violations) Verstoesse, \(.summary.unreachable) nicht erreichbar, \(.summary.incomplete) unentschieden (\(.summary.incompleteRules | join(", "))), \(.durationMs / 1000 | floor) s, Commit `\(.commit)`"' out/axe-report.json >> "$GITHUB_STEP_SUMMARY"
            jq -r '.results[] | select(.error or ((.violations // []) | length > 0)) | "- \(.theme) \(.layout) \(.view): \(.error // ([.violations[] | "\(.id) (\(.impact))"] | join(", ")))"' out/axe-report.json >> "$GITHUB_STEP_SUMMARY"
            printf '\nUnentschieden je Regel (von Hand pruefen):\n' >> "$GITHUB_STEP_SUMMARY"
            jq -r '[.results[] | (.incomplete // [])[] | .id] | group_by(.) | map("- \(.[0]): \(length) Ansichten") | .[]' out/axe-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**axe:** kein Bericht erzeugt" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bericht hochladen
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axe-report-${{ github.sha }}
          path: tool/a11y/out/
          retention-days: 30
          if-no-files-found: warn

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [axe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
