name: Build scripts

# Proves that the start scripts tool/bauen.ps1 (Windows PowerShell 5.1) and tool/bauen.sh
# (bash) really build the web version. Runs only when the scripts or this workflow
# change, and on manual trigger.

on:
  pull_request:
    paths:
      - tool/bauen.sh
      - tool/bauen.ps1
      - .github/workflows/build-scripts.yml
  push:
    branches: [main]
    paths:
      - tool/bauen.sh
      - tool/bauen.ps1
      - .github/workflows/build-scripts.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-scripts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: bauen.ps1 (Windows, web)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Invalid target is rejected with exit code 2
        shell: powershell
        run: |
          powershell -NoProfile -File tool\bauen.ps1 -Ziel invalid
          if ($LASTEXITCODE -ne 2) { throw "Exit code $LASTEXITCODE instead of 2" }
          exit 0

      - name: Build web (build only)
        shell: powershell
        run: |
          powershell -NoProfile -File tool\bauen.ps1 -Ziel web
          if ($LASTEXITCODE -ne 0) { throw "bauen.ps1 reported exit code $LASTEXITCODE" }
          exit 0

      - name: Check result
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          echo "build/web/index.html present"

  linux:
    name: bauen.sh (Linux, web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Check syntax
        run: bash -n tool/bauen.sh

      - name: Invalid target is rejected with exit code 2
        run: |
          set +e
          tool/bauen.sh invalid
          code=$?
          [ "$code" -eq 2 ] || { echo "Exit code $code instead of 2"; exit 1; }

      - name: Build web (build only)
        run: tool/bauen.sh web

      - name: Check result
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          echo "build/web/index.html present"

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [windows, linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
