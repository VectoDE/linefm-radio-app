name: Build

# Builds all six platforms and stores the results as artifacts "dist-<platform>".
# Change proposals build every platform including macOS/iOS, exactly as the
# release on main does, so no build or log-gate failure first shows up on main
# (public repo: Actions minutes are free). Manual starts include macOS/iOS only
# with apple=true. Documentation-only changes skip the build.
# Signing steps only run outside change proposals and only when the secrets are set;
# without secrets the artifacts are unsigned and the summary lists what is missing.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - docs/**
  workflow_dispatch:
    inputs:
      apple:
        description: Include the macOS and iOS build
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: Version tag (vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N)
        type: string
        required: false
        default: ""
      apple:
        description: Include the macOS and iOS build
        type: boolean
        required: false
        default: true
    # All optional: if a secret is missing, the matching signing step is skipped.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      WINDOWS_CERT_PFX_BASE64:
        required: false
      WINDOWS_CERT_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_DEVELOPER_ID_CERT_P12_BASE64:
        required: false
      APPLE_DEVELOPER_ID_CERT_PASSWORD:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_P8:
        required: false
      FIREBASE_CONFIG_JSON:
        required: false

permissions: {}

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}-${{ inputs.version || 'dev' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_BUILD_FLAGS: --release --dart-define-from-file=config/app.json

jobs:
  meta:
    name: Version and secret gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.version.outputs.run }}
      apple: ${{ steps.version.outputs.apple }}
      label: ${{ steps.version.outputs.label }}
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      app_env: ${{ steps.version.outputs.app_env }}
      legal_strict: ${{ steps.version.outputs.legal_strict }}
      cache: ${{ steps.version.outputs.cache }}
      sign_android: ${{ steps.android.outputs.ready == 'true' && steps.version.outputs.may_sign == 'true' }}
      sign_windows: ${{ steps.windows.outputs.ready == 'true' && steps.version.outputs.may_sign == 'true' }}
      sign_macos: ${{ steps.macos.outputs.ready == 'true' && steps.version.outputs.may_sign == 'true' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_APPLE: ${{ inputs.apple }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          HAS_APPLE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:apple') }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: |
          set -euo pipefail
          run=true
          # A new label only triggers the run if it is ci:apple.
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "labeled" ] && [ "$LABEL_NAME" != "ci:apple" ]; then
            run=false
          fi

          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$REF_TYPE" = "tag" ]; then version="$REF_NAME"; fi
          if [ -n "$version" ]; then
            if ! [[ "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version: $version (expected vX.Y.Z or vX.Y.Z-suffix)"
              exit 1
            fi
            label="${version#v}"
            app_env=prod
          else
            # Without a release: clearly recognizable development version with commit.
            label="0.0.0-dev+${GITHUB_SHA::7}"
            app_env=dev
          fi
          build_name="${label%%-*}"
          offset="${BUILD_NUMBER_OFFSET:-100}"
          build_number=$(( RUN_NUMBER + offset ))

          apple=false
          if [ "$INPUT_APPLE" = "true" ] || [ "$HAS_APPLE_LABEL" = "true" ] || [ "$EVENT_NAME" = "pull_request" ]; then apple=true; fi

          may_sign=false
          # Only a release (version passed in by release.yml) or a v* tag may sign;
          # change proposals and manual starts from any branch stay unsigned.
          if [ "$EVENT_NAME" != "pull_request" ] && { [ -n "$INPUT_VERSION" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; }; then may_sign=true; fi

          # Every tag build (prod) needs complete legal texts: release.yml
          # also uploads pre-releases (vX.Y.Z-rc.N) to Google Play and Snap, so
          # the same condition applies as for the store uploads. Dev builds only
          # report open placeholders.
          # Pre-releases (alpha, beta, rc) go to no store.
          legal_strict=false
          if [ "$app_env" = "prod" ] && ! [[ "$label" =~ -(alpha|beta|rc)\. ]]; then legal_strict=true; fi

          # Release builds (prod) never restore a cache: SDK, pub, Gradle and
          # Swift packages come fresh, so no cached content can reach a release.
          cache=true
          if [ "$app_env" = "prod" ]; then cache=false; fi

          {
            echo "cache=$cache"
            echo "legal_strict=$legal_strict"
            echo "run=$run"
            echo "apple=$apple"
            echo "label=$label"
            echo "build_name=$build_name"
            echo "build_number=$build_number"
            echo "app_env=$app_env"
            echo "may_sign=$may_sign"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Build $label"
            echo "- build-name: \`$build_name\`, build-number: \`$build_number\`, APP_ENV: \`$app_env\`"
            echo "- macOS/iOS: $apple"
            echo "- Signing allowed (release or v* tag only): $may_sign"
            echo "- Legal texts strict (required placeholders must be filled): $legal_strict"
            echo "- Build caches restored: $cache"
            echo ""
            echo "#### Signing gates"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Android signing gate
        id: android
        uses: ./.github/actions/secret-gate
        with:
          label: Android signing (upload key)
          checks: |
            ANDROID_KEYSTORE_BASE64=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
            ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
            ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS != '' }}
            ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD != '' }}

      - name: Windows code signing gate
        id: windows
        uses: ./.github/actions/secret-gate
        with:
          label: Windows code signing
          checks: |
            WINDOWS_CERT_PFX_BASE64=${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
            WINDOWS_CERT_PASSWORD=${{ secrets.WINDOWS_CERT_PASSWORD != '' }}

      - name: macOS signing and notarization gate
        id: macos
        uses: ./.github/actions/secret-gate
        with:
          label: macOS Developer ID signing + notarization
          checks: |
            APPLE_PUBLISHING_ENABLED=${{ vars.APPLE_PUBLISHING_ENABLED == 'true' }}
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID != '' }}
            APPLE_DEVELOPER_ID_CERT_P12_BASE64=${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 != '' }}
            APPLE_DEVELOPER_ID_CERT_PASSWORD=${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD != '' }}
            APP_STORE_CONNECT_API_KEY_ID=${{ secrets.APP_STORE_CONNECT_API_KEY_ID != '' }}
            APP_STORE_CONNECT_API_KEY_ISSUER_ID=${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID != '' }}
            APP_STORE_CONNECT_API_KEY_P8=${{ secrets.APP_STORE_CONNECT_API_KEY_P8 != '' }}

  android:
    name: Android (APK + AAB)
    needs: meta
    if: needs.meta.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      BUILD_NAME: ${{ needs.meta.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build timestamps = commit time (SOURCE_DATE_EPOCH), so identical
      # sources produce identical dates where the tools honor it (postbuild:
      # sitemap lastmod; ZIP/packers that support it). Bit-identical builds are
      # therefore NOT guaranteed and not verified (see docs/RELEASE-VERIFIZIEREN.md).
      - name: Set SOURCE_DATE_EPOCH from the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # The release build downloads NDK and CMake; without cleanup the runner
      # ran out of space and was cancelled ("runner has received a shutdown signal").
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go /usr/local/julia* || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # Gradle User Home cache (wrapper, dependencies, transforms). Written on
      # main only, read-only elsewhere, disabled for release builds.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: ${{ needs.meta.outputs.cache != 'true' }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: never
          cache-provider: basic

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache: ${{ needs.meta.outputs.cache }}

      - name: Write configuration
        uses: ./.github/actions/write-config
        with:
          app-env: ${{ needs.meta.outputs.app_env }}
          app-version: ${{ needs.meta.outputs.label }}
          legal-values-json: ${{ vars.LEGAL_VALUES_JSON }}
          legal-strict: ${{ needs.meta.outputs.legal_strict }}
          web-base-url: ${{ vars.WEB_BASE_URL }}
          features-json: ${{ vars.FEATURES_JSON }}
          umami-url: ${{ vars.UMAMI_URL }}
          umami-website-id: ${{ vars.UMAMI_WEBSITE_ID }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          sentry-environment: ${{ vars.SENTRY_ENVIRONMENT }}
          gsc-verification: ${{ vars.GSC_VERIFICATION }}
          gtm-id: ${{ vars.GTM_ID }}
          ga4-measurement-id: ${{ vars.GA4_MEASUREMENT_ID }}
          trust-gridinsoft-url: ${{ vars.TRUST_GRIDINSOFT_URL }}
          trust-trustpilot-url: ${{ vars.TRUST_TRUSTPILOT_URL }}
          firebase-config-json: ${{ secrets.FIREBASE_CONFIG_JSON }}

      - name: Provide upload keystore
        if: needs.meta.outputs.sign_android == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK (universal)
        run: flutter build apk $FLUTTER_BUILD_FLAGS --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: APK size budget
        run: python3 -I tool/perf/bundle_budget.py --apk "$(ls build/app/outputs/flutter-apk/app-release*.apk | head -n1)"

      - name: Build AAB
        run: flutter build appbundle $FLUTTER_BUILD_FLAGS --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Remove keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Collect artifacts
        env:
          SIGNED: ${{ needs.meta.outputs.sign_android }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(ls build/app/outputs/flutter-apk/app-release*.apk | head -n1)"
          cp "$apk" "dist/linefm-radio-${LABEL}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/linefm-radio-${LABEL}-android.aab"
          ls -la dist
          if [ "$SIGNED" = "true" ]; then
            echo "- Android: signed with upload key" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Android: **unsigned** (no upload key or build of a change proposal)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-android
          path: dist/
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web
    needs: meta
    if: needs.meta.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      BUILD_NAME: ${{ needs.meta.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build timestamps = commit time (SOURCE_DATE_EPOCH), so identical
      # sources produce identical dates where the tools honor it (postbuild:
      # sitemap lastmod; ZIP/packers that support it). Bit-identical builds are
      # therefore NOT guaranteed and not verified (see docs/RELEASE-VERIFIZIEREN.md).
      - name: Set SOURCE_DATE_EPOCH from the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache: ${{ needs.meta.outputs.cache }}

      - name: Write configuration
        uses: ./.github/actions/write-config
        with:
          app-env: ${{ needs.meta.outputs.app_env }}
          app-version: ${{ needs.meta.outputs.label }}
          legal-values-json: ${{ vars.LEGAL_VALUES_JSON }}
          legal-strict: ${{ needs.meta.outputs.legal_strict }}
          web-base-url: ${{ vars.WEB_BASE_URL }}
          features-json: ${{ vars.FEATURES_JSON }}
          umami-url: ${{ vars.UMAMI_URL }}
          umami-website-id: ${{ vars.UMAMI_WEBSITE_ID }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          sentry-environment: ${{ vars.SENTRY_ENVIRONMENT }}
          gsc-verification: ${{ vars.GSC_VERIFICATION }}
          gtm-id: ${{ vars.GTM_ID }}
          ga4-measurement-id: ${{ vars.GA4_MEASUREMENT_ID }}
          trust-gridinsoft-url: ${{ vars.TRUST_GRIDINSOFT_URL }}
          trust-trustpilot-url: ${{ vars.TRUST_TRUSTPILOT_URL }}
          firebase-config-json: ${{ secrets.FIREBASE_CONFIG_JSON }}

      - name: Build web
        shell: bash
        run: |
          mapfile -t web_defines < <(bash tool/web_define_passthrough.sh)
          # shellcheck disable=SC2086 # FLUTTER_BUILD_FLAGS is a flag list
          flutter build web $FLUTTER_BUILD_FLAGS --wasm --no-web-resources-cdn --base-href /             --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" "${web_defines[@]}"

      - name: Self-host fallback fonts
        run: |
          # Noto fallback into build/web/assets/fonts/fallback/ (checksums from tool/font_fallback.lock.json).
          cp tool/fetch_font_fallback.dart tool/web_postbuild.dart "$RUNNER_TEMP/"
          dart run "$RUNNER_TEMP/fetch_font_fallback.dart" build/web --strict

      - name: Postbuild (hashes, header files)
        env:
          LEGAL_STRICT: ${{ needs.meta.outputs.legal_strict }}
          # App links: Play signing certificate (SHA-256) and Apple team ID are
          # public values; without them the postbuild removes the templates (warning).
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -f tool/web_postbuild.dart ]; then
            strict=""
            if [ "$LEGAL_STRICT" = "true" ]; then strict="--strict"; fi
            # Start outside the package (dart: imports only), otherwise "dart run" builds the native asset hooks (GTK).
            cp tool/web_postbuild.dart "$RUNNER_TEMP/web_postbuild.dart"
            dart run "$RUNNER_TEMP/web_postbuild.dart" build/web $strict
          else
            echo "- Web: tool/web_postbuild.dart missing, postbuild skipped" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build/web && zip -q -r -9 "../../dist/linefm-radio-${LABEL}-web.zip" .)
          # Rendered hosting files (headers, redirects, .htaccess) from the postbuild.
          if [ -d build/hosting ]; then
            (cd build/hosting && zip -q -r -9 "../../dist/linefm-radio-${LABEL}-web-hosting.zip" .)
          fi
          ls -la dist

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-web
          path: dist/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (x64 tar.gz, deb, rpm, AppImage, installer)
    needs: meta
    if: needs.meta.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      BUILD_NAME: ${{ needs.meta.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build timestamps = commit time (SOURCE_DATE_EPOCH), so identical
      # sources produce identical dates where the tools honor it (postbuild:
      # sitemap lastmod; ZIP/packers that support it). Bit-identical builds are
      # therefore NOT guaranteed and not verified (see docs/RELEASE-VERIFIZIEREN.md).
      - name: Set SOURCE_DATE_EPOCH from the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: System packages
        uses: ./.github/actions/linux-deps

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache: ${{ needs.meta.outputs.cache }}

      - name: Write configuration
        uses: ./.github/actions/write-config
        with:
          app-env: ${{ needs.meta.outputs.app_env }}
          app-version: ${{ needs.meta.outputs.label }}
          legal-values-json: ${{ vars.LEGAL_VALUES_JSON }}
          legal-strict: ${{ needs.meta.outputs.legal_strict }}
          web-base-url: ${{ vars.WEB_BASE_URL }}
          features-json: ${{ vars.FEATURES_JSON }}
          umami-url: ${{ vars.UMAMI_URL }}
          umami-website-id: ${{ vars.UMAMI_WEBSITE_ID }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          sentry-environment: ${{ vars.SENTRY_ENVIRONMENT }}
          gsc-verification: ${{ vars.GSC_VERIFICATION }}
          gtm-id: ${{ vars.GTM_ID }}
          ga4-measurement-id: ${{ vars.GA4_MEASUREMENT_ID }}
          trust-gridinsoft-url: ${{ vars.TRUST_GRIDINSOFT_URL }}
          trust-trustpilot-url: ${{ vars.TRUST_TRUSTPILOT_URL }}
          firebase-config-json: ${{ secrets.FIREBASE_CONFIG_JSON }}

      - name: Build Linux
        run: flutter build linux $FLUTTER_BUILD_FLAGS --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Create tar.gz
        run: |
          set -euo pipefail
          mkdir -p dist
          # The bundle contents sit directly in the archive root (Flatpak/Snap unpack there).
          tar -C build/linux/x64/release/bundle -czf "dist/linefm-radio-${LABEL}-linux-x64.tar.gz" .
          ls -la dist

      # Installer: the shared setup UI (installer/ui) as an AppImage with
      # the POSIX engine (installer/posix) and the app bundle as payload.
      - name: Installer tools (xvfb, pinned appimagetool)
        run: |
          set -euo pipefail
          sudo apt-get install -y -q --no-install-recommends xvfb xauth desktop-file-utils shellcheck rpm
          bash installer/linux/fetch-appimagetool.sh build/installer/tools

      - name: Check the installer engine (shellcheck)
        run: shellcheck -s sh installer/posix/engine.sh installer/posix/root-helper.sh && shellcheck installer/posix/test-installer.sh installer/linux/*.sh installer/macos/*.sh packaging/linux/build-packages.sh packaging/linux/test-packages.sh && shellcheck -s sh packaging/linux/test-in-container.sh

      - name: Build the Linux installer (AppImage)
        run: |
          bash installer/linux/build.sh --version "$LABEL" --app build/linux/x64/release/bundle \
            --out "dist/linefm-radio-${LABEL}-linux-x64-setup.AppImage"

      - name: Test the Linux installer (install, update, downgrade, uninstall)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          setup="$PWD/dist/linefm-radio-${LABEL}-linux-x64-setup.AppImage"
          mkdir -p build/installer/extract
          (cd build/installer/extract && "$setup" --appimage-extract >/dev/null)
          xvfb-run -a -s '-screen 0 1280x900x24' bash installer/posix/test-installer.sh --os linux \
            --setup "$setup" --setup-dir build/installer/extract/squashfs-root/usr/lib/linefm-setup/setup \
            --artifacts build/installer-test

      # App packages: .deb, .rpm and AppImage of the app itself (separate
      # from the setup AppImage above).
      - name: Build the Linux packages (deb, rpm, AppImage)
        run: |
          bash packaging/linux/build-packages.sh --version "$LABEL"             --app build/linux/x64/release/bundle --out dist

      - name: Test the Linux packages (install, start, update, downgrade, uninstall)
        run: bash packaging/linux/test-packages.sh --version "$LABEL" --app build/linux/x64/release/bundle --dist dist --artifacts build/packages-test

      - name: Upload package test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-test-linux
          path: build/packages-test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installer screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-test-linux
          path: build/installer-test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (ZIP, MSIX, Installer)
    needs: meta
    if: needs.meta.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 80
    permissions:
      contents: read
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      BUILD_NAME: ${{ needs.meta.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build timestamps = commit time (SOURCE_DATE_EPOCH), so identical
      # sources produce identical dates where the tools honor it (postbuild:
      # sitemap lastmod; ZIP/packers that support it). Bit-identical builds are
      # therefore NOT guaranteed and not verified (see docs/RELEASE-VERIFIZIEREN.md).
      - name: Set SOURCE_DATE_EPOCH from the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Rust toolchain (for smtc_windows)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache: ${{ needs.meta.outputs.cache }}

      # Installer: engine (C++, CMake/MSVC) and own setup UI
      # (Flutter, installer/ui) first, so errors surface early.
      - name: Check setup UI (analyze, tests, screenshots)
        shell: bash
        working-directory: installer/ui
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

      - name: Build installer engine and setup UI
        shell: pwsh
        run: ./installer/windows/build.ps1 -Stage prepare -Version $env:LABEL

      - name: Write configuration
        uses: ./.github/actions/write-config
        with:
          app-env: ${{ needs.meta.outputs.app_env }}
          app-version: ${{ needs.meta.outputs.label }}
          legal-values-json: ${{ vars.LEGAL_VALUES_JSON }}
          legal-strict: ${{ needs.meta.outputs.legal_strict }}
          web-base-url: ${{ vars.WEB_BASE_URL }}
          features-json: ${{ vars.FEATURES_JSON }}
          umami-url: ${{ vars.UMAMI_URL }}
          umami-website-id: ${{ vars.UMAMI_WEBSITE_ID }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          sentry-environment: ${{ vars.SENTRY_ENVIRONMENT }}
          gsc-verification: ${{ vars.GSC_VERIFICATION }}
          gtm-id: ${{ vars.GTM_ID }}
          ga4-measurement-id: ${{ vars.GA4_MEASUREMENT_ID }}
          trust-gridinsoft-url: ${{ vars.TRUST_GRIDINSOFT_URL }}
          trust-trustpilot-url: ${{ vars.TRUST_TRUSTPILOT_URL }}
          firebase-config-json: ${{ secrets.FIREBASE_CONFIG_JSON }}

      - name: Build Windows
        shell: bash
        run: flutter build windows $FLUTTER_BUILD_FLAGS --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Provide code signing certificate
        id: cert
        if: needs.meta.outputs.sign_windows == 'true'
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Sign EXE
        if: needs.meta.outputs.sign_windows == 'true'
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.cert.outputs.path }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          # App, setup stub (also becomes uninstall.exe) and setup UI.
          $files = @(Get-ChildItem 'build/windows/x64/runner/Release' -Recurse -Include *.exe) +
                   @(Get-Item 'build/installer/engine/Release/setup_stub.exe') +
                   @(Get-ChildItem 'installer/ui/build/windows/x64/runner/Release' -Recurse -Include *.exe)
          foreach ($f in $files) {
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:PFX_PATH /p $env:PFX_PASSWORD $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($f.Name)" }
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "dist/linefm-radio-$env:LABEL-windows-x64.zip" -CompressionLevel Optimal
          Get-ChildItem dist

      - name: Create MSIX (sideload)
        if: hashFiles('assets/branding/icon_1024.png') != ''
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.cert.outputs.path }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msixArgs = @('run', 'msix:create', '--build-windows', 'false', '--version', "$env:BUILD_NAME.0",
                    '--output-path', 'dist', '--output-name', "linefm-radio-$env:LABEL-windows-x64")
          if ($env:PFX_PATH) {
            $msixArgs += @('--certificate-path', $env:PFX_PATH, '--certificate-password', $env:PFX_PASSWORD)
          } else {
            # Unsigned, msix requires a publisher identity; with a certificate it comes from the certificate.
            $msixArgs += @('--sign-msix', 'false', '--publisher', 'CN=LineFM Studios', '--publisher-display-name', 'LineFM Studios')
            "- Windows: MSIX **unsigned** (no code signing certificate), sideload only after signing" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          dart @msixArgs
          if ($LASTEXITCODE -ne 0) { throw 'msix:create failed' }
          # Without an .msix file the step has failed.
          $msix = Get-ChildItem dist -Filter *.msix
          if (-not $msix) { throw 'msix:create did not produce an .msix file' }
          $msix | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: MSIX notice
        if: hashFiles('assets/branding/icon_1024.png') == ''
        shell: bash
        run: |
          echo "- Windows: MSIX skipped, assets/branding/icon_1024.png still missing" >> "$GITHUB_STEP_SUMMARY"

      - name: Pack installer (own UI)
        shell: pwsh
        run: |
          ./installer/windows/build.ps1 -Stage pack -Version $env:LABEL `
            -Out "dist/linefm-radio-$env:LABEL-windows-x64-setup.exe"

      - name: Sign installer
        if: needs.meta.outputs.sign_windows == 'true'
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.cert.outputs.path }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Get-ChildItem dist -Filter *-setup.exe | ForEach-Object {
            & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:PFX_PATH /p $env:PFX_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.Name)" }
            & $signtool.FullName verify /pa $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid signature: $($_.Name)" }
          }

      # Installation, launch, update (running app, settings are kept),
      # downgrade block, UI via UI automation, uninstall and
      # "all users" on the runner. For the update a second setup.exe
      # with a smaller version is built from the same files (test only).
      # Axe.Windows CLI (Microsoft, MIT) scans the setup window for
      # accessibility problems; pinned release, verified by SHA-256.
      - name: Fetch Axe.Windows CLI
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'axe.zip'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/axe-windows/releases/download/v2.4.2/AxeWindowsCLI-2.4.2.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'aeca43f41c89b3ffb1db84011539e609ecd7cb3badd6e78fada2ada327d10a64') { throw "Axe.Windows hash mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'axe'
          Expand-Archive $zip -DestinationPath $dir -Force
          "AXE_CLI=$(Join-Path $dir 'AxeWindowsCLI.exe')" >> $env:GITHUB_ENV

      - name: Test installer (install, launch, update, uninstall)
        shell: pwsh
        run: |
          $old = '0.0.0-0'  # lowest valid SemVer, below every generated version
          ./installer/windows/build.ps1 -Stage pack -Version $old -Out build/installer/setup-old.exe
          ./installer/windows/test-installer.ps1 -Setup "dist/linefm-radio-$env:LABEL-windows-x64-setup.exe" `
            -OldSetup build/installer/setup-old.exe -OldVersion $old -Version $env:LABEL -ArtifactDir build/installer-test

      - name: Upload installer screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-test-windows
          path: |
            build/installer-test/
            installer/ui/build/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove certificate
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'codesign.pfx')

      - name: Signing status
        shell: bash
        env:
          SIGNED: ${{ needs.meta.outputs.sign_windows }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            echo "- Windows: EXE/installer signed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Windows: **unsigned** (no certificate or build of a change proposal), SmartScreen warning possible" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # The setup UI (installer/ui) does not depend on the app build, so it is
  # compiled on its own runner while the app builds and handed over as an
  # unsigned tarball; the macOS job signs it with everything else.
  macos-setup-ui:
    name: macOS setup UI
    needs: meta
    if: needs.meta.outputs.run == 'true' && needs.meta.outputs.apple == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      # Proposed-change builds compile Apple silicon only (official Flutter feature flag);
      # every other build, releases included, stays universal (arm64 + x86_64).
      FLUTTER_MACOS_ARM64_ONLY: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set SOURCE_DATE_EPOCH from the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache: ${{ needs.meta.outputs.cache }}
          pub-get: "false"

      - name: Build the setup UI
        working-directory: installer/ui
        run: |
          set -euo pipefail
          numeric=${LABEL%%[-+]*}
          flutter pub get
          flutter build macos --release --build-name "$numeric"
          # tar keeps the framework symlinks that upload-artifact would flatten.
          tar -C build/macos/Build/Products/Release -czf "$RUNNER_TEMP/setup-ui.tar.gz" "LINEFM Radio Setup.app"

      - name: Upload the setup UI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-setup-ui
          path: ${{ runner.temp }}/setup-ui.tar.gz
          if-no-files-found: error
          retention-days: 1

  # App build: compiled and signed here, handed over as a tarball. Runs in
  # parallel with macos-setup-ui; only the packaging job waits for both.
  macos-app:
    name: macOS app
    needs: meta
    if: needs.meta.outputs.run == 'true' && needs.meta.outputs.apple == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      BUILD_NAME: ${{ needs.meta.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
      APP_PATH: build/macos/Build/Products/Release/LINEFM Radio.app
      # Proposed-change builds compile Apple silicon only (official Flutter feature flag);
      # every other build, releases included, stays universal (arm64 + x86_64).
      FLUTTER_MACOS_ARM64_ONLY: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build timestamps = commit time (SOURCE_DATE_EPOCH), so identical
      # sources produce identical dates where the tools honor it (postbuild:
      # sitemap lastmod; ZIP/packers that support it). Bit-identical builds are
      # therefore NOT guaranteed and not verified (see docs/RELEASE-VERIFIZIEREN.md).
      - name: Set SOURCE_DATE_EPOCH from the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache: ${{ needs.meta.outputs.cache }}

      - name: Write configuration
        uses: ./.github/actions/write-config
        with:
          app-env: ${{ needs.meta.outputs.app_env }}
          app-version: ${{ needs.meta.outputs.label }}
          legal-values-json: ${{ vars.LEGAL_VALUES_JSON }}
          legal-strict: ${{ needs.meta.outputs.legal_strict }}
          web-base-url: ${{ vars.WEB_BASE_URL }}
          features-json: ${{ vars.FEATURES_JSON }}
          umami-url: ${{ vars.UMAMI_URL }}
          umami-website-id: ${{ vars.UMAMI_WEBSITE_ID }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          sentry-environment: ${{ vars.SENTRY_ENVIRONMENT }}
          gsc-verification: ${{ vars.GSC_VERIFICATION }}
          gtm-id: ${{ vars.GTM_ID }}
          ga4-measurement-id: ${{ vars.GA4_MEASUREMENT_ID }}
          trust-gridinsoft-url: ${{ vars.TRUST_GRIDINSOFT_URL }}
          trust-trustpilot-url: ${{ vars.TRUST_TRUSTPILOT_URL }}
          firebase-config-json: ${{ secrets.FIREBASE_CONFIG_JSON }}

      # Swift packages (Sentry binaries etc.) resolved into the derived data
      # folder. Release builds (meta output cache=false) never restore a cache and
      # resolve from scratch, so no cached content can reach a release.
      - name: Swift package cache
        if: needs.meta.outputs.cache == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/macos/SourcePackages
          key: spm-macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'macos/Runner.xcodeproj/project.pbxproj') }}

      - name: Build macOS
        run: flutter build macos $FLUTTER_BUILD_FLAGS --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Import Developer ID certificate
        if: needs.meta.outputs.sign_macos == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(openssl rand -hex 24)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/devid.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" >/dev/null
          # Deliberately unquoted: each existing keychain becomes its own argument
          # (paths under ~/Library/Keychains contain no spaces).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"

      - name: Sign app (Hardened Runtime)
        if: needs.meta.outputs.sign_macos == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          identity="Developer ID Application"
          ent="macos/Runner/Release.entitlements"
          codesign --force --deep --options runtime --timestamp --entitlements "$ent" \
            --sign "$identity" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Hand over the app
        run: |
          set -euo pipefail
          # tar keeps the framework symlinks that upload-artifact would flatten.
          tar -C "$(dirname "$APP_PATH")" -czf "$RUNNER_TEMP/macos-app.tar.gz" "$(basename "$APP_PATH")"

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          path: ${{ runner.temp }}/macos-app.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Remove keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  # Packaging: setup UI + signed app into the installer DMG and the plain DMG.
  # Needs no Flutter, so it starts as soon as both builds are done.
  macos:
    name: macOS (DMG)
    needs: [meta, macos-app, macos-setup-ui]
    if: needs.meta.outputs.run == 'true' && needs.meta.outputs.apple == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      APP_PATH: build/macos/Build/Products/Release/LINEFM Radio.app
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set SOURCE_DATE_EPOCH from the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Download the app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-app
          path: ${{ runner.temp }}/macos-app

      - name: Unpack the app
        env:
          SIGN: ${{ needs.meta.outputs.sign_macos }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$APP_PATH")"
          tar -C "$(dirname "$APP_PATH")" -xzf "$RUNNER_TEMP/macos-app/macos-app.tar.gz"
          codesign --verify --deep --strict "$APP_PATH" || [ "$SIGN" != "true" ]

      - name: Import Developer ID certificate
        if: needs.meta.outputs.sign_macos == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw="$(openssl rand -hex 24)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/devid.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc" >/dev/null
          # Deliberately unquoted: each existing keychain becomes its own argument
          # (paths under ~/Library/Keychains contain no spaces).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"

      # Installer: shared setup UI (installer/ui) as "LINEFM Radio
      # Setup.app" with the POSIX engine and the app as payload, in a
      # designed DMG (dmgbuild, pinned by hash).
      - name: Installer tools (dmgbuild)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet --require-hashes --no-deps -r installer/macos/requirements-dmg.txt
          echo "$RUNNER_TEMP/dmgvenv/bin" >> "$GITHUB_PATH"

      - name: Download the setup UI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-setup-ui
          path: ${{ runner.temp }}/setup-ui

      - name: Build the macOS installer (DMG)
        env:
          SIGN: ${{ needs.meta.outputs.sign_macos }}
        run: |
          set -euo pipefail
          ui_dir="installer/ui/build/macos/Build/Products/Release"
          mkdir -p "$ui_dir"
          tar -C "$ui_dir" -xzf "$RUNNER_TEMP/setup-ui/setup-ui.tar.gz"
          identity="-"
          [ "$SIGN" = "true" ] && identity="Developer ID Application"
          bash installer/macos/build.sh --version "$LABEL" --app "$APP_PATH" --identity "$identity" \
            --out "dist/linefm-radio-${LABEL}-macos-setup.dmg" --skip-ui-build

      - name: Test the macOS installer (install, update, downgrade, uninstall)
        run: |
          set -euo pipefail
          mnt="$RUNNER_TEMP/setup-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "dist/linefm-radio-${LABEL}-macos-setup.dmg"
          trap 'hdiutil detach "$mnt" -force >/dev/null 2>&1 || true' EXIT
          app="$mnt/LINEFM Radio Setup.app"
          bash installer/posix/test-installer.sh --os macos \
            --setup "$app/Contents/MacOS/LINEFM Radio Setup" --setup-dir "$app/Contents/Resources/setup" \
            --artifacts build/installer-test

      - name: Upload installer screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-test-macos
          path: build/installer-test/
          if-no-files-found: warn
          retention-days: 14

      - name: Create DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          dmg="dist/linefm-radio-${LABEL}-macos.dmg"
          if [ -f packaging/macos/create_dmg.sh ]; then
            bash packaging/macos/create_dmg.sh "$APP_PATH" "$dmg"
          else
            staging="$RUNNER_TEMP/dmg"
            rm -rf "$staging"; mkdir -p "$staging"
            cp -R "$APP_PATH" "$staging/"
            ln -s /Applications "$staging/Applications"
            hdiutil create -volname "LINEFM Radio" -srcfolder "$staging" -ov -format UDZO "$dmg"
            echo "- macOS: plain DMG (packaging/macos/create_dmg.sh from P26 still missing)" >> "$GITHUB_STEP_SUMMARY"
          fi
          hdiutil verify "$dmg"
          ls -la dist

      - name: Sign, notarize and staple DMG
        if: needs.meta.outputs.sign_macos == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          dmg="dist/linefm-radio-${LABEL}-macos.dmg"
          key="$RUNNER_TEMP/AuthKey.p8"
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$key"
          codesign --force --timestamp --sign "Developer ID Application" "$dmg"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          # Installer DMG, already signed by installer/macos/build.sh.
          setup="dist/linefm-radio-${LABEL}-macos-setup.dmg"
          xcrun notarytool submit "$setup" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$setup"
          rm -f "$key"
          echo "- macOS: signed and notarized" >> "$GITHUB_STEP_SUMMARY"

      - name: Signing notice
        if: needs.meta.outputs.sign_macos != 'true'
        run: |
          echo "- macOS: **unsigned, not notarized** (gate APPLE_PUBLISHING_ENABLED/Apple secrets or build of a change proposal); open via right-click > Open" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (compile check, no signing)
    needs: meta
    if: needs.meta.outputs.run == 'true' && needs.meta.outputs.apple == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      BUILD_NAME: ${{ needs.meta.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.meta.outputs.build_number }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build timestamps = commit time (SOURCE_DATE_EPOCH), so identical
      # sources produce identical dates where the tools honor it (postbuild:
      # sitemap lastmod; ZIP/packers that support it). Bit-identical builds are
      # therefore NOT guaranteed and not verified (see docs/RELEASE-VERIFIZIEREN.md).
      - name: Set SOURCE_DATE_EPOCH from the commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache: ${{ needs.meta.outputs.cache }}

      - name: Write configuration
        uses: ./.github/actions/write-config
        with:
          app-env: ${{ needs.meta.outputs.app_env }}
          app-version: ${{ needs.meta.outputs.label }}
          legal-values-json: ${{ vars.LEGAL_VALUES_JSON }}
          legal-strict: ${{ needs.meta.outputs.legal_strict }}
          web-base-url: ${{ vars.WEB_BASE_URL }}
          features-json: ${{ vars.FEATURES_JSON }}

      - name: Build iOS (no-codesign)
        run: flutter build ios $FLUTTER_BUILD_FLAGS --no-codesign --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      # Verifies that the hand-maintained parts of the Xcode project really end up
      # in the bundle: widget extension embedded, Info.plist keys set, privacy
      # manifests copied, native channels linked.
      - name: Check app bundle
        shell: bash
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          appex="$app/PlugIns/LinefmWidgetExtension.appex"
          fail=0
          check() { if eval "$2"; then echo "ok    $1"; else echo "MISSING $1"; fail=1; fi; }
          val() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null || true; }
          check "Widget extension embedded" '[ -x "$appex/LinefmWidgetExtension" ]'
          check "Widget: bundle ID de.linefm.app.widget" '[ "$(val "$appex/Info.plist" CFBundleIdentifier)" = "de.linefm.app.widget" ]'
          check "Widget: WidgetKit extension point" '[ "$(val "$appex/Info.plist" NSExtension:NSExtensionPointIdentifier)" = "com.apple.widgetkit-extension" ]'
          check "Widget: privacy manifest" '[ -f "$appex/PrivacyInfo.xcprivacy" ]'
          check "App: privacy manifest" '[ -f "$app/PrivacyInfo.xcprivacy" ]'
          check "App: MinimumOSVersion 16.0" '[ "$(val "$app/Info.plist" MinimumOSVersion)" = "16.0" ]'
          check "App: UIBackgroundModes audio" 'val "$app/Info.plist" UIBackgroundModes | grep -qx "[[:space:]]*audio"'
          check "App: CarPlay scene in manifest" '[ -n "$(val "$app/Info.plist" UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication:0:UISceneDelegateClassName)" ]'
          check "App: NSLocalNetworkUsageDescription" '[ -n "$(val "$app/Info.plist" NSLocalNetworkUsageDescription)" ]'
          check "App: AppIcon as primary icon" '[ "$(val "$app/Info.plist" CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName)" = "AppIcon" ]'
          check "App: asset catalog compiled" '[ -f "$app/Assets.car" ]'
          strings -a "$app/Runner" > "$RUNNER_TEMP/runner.strings" || true
          strings -a "$appex/LinefmWidgetExtension" > "$RUNNER_TEMP/widget.strings" || true
          for s in CarPlaySceneDelegate SceneDelegate AlarmNotifications AirPlayRoutePickerFactory \
                   de.linefm.app/carplay de.linefm.app/alarm_ios de.linefm.app/airplay_route_picker; do
            check "Binary contains $s" 'grep -qF "$s" "$RUNNER_TEMP/runner.strings"'
          done
          check "Widget binary contains group.de.linefm.app" 'grep -qF "group.de.linefm.app" "$RUNNER_TEMP/widget.strings"'
          exit "$fail"

      - name: Result
        run: |
          echo "- iOS: compile check succeeded (unsigned, no release artifact; store upload via store-apple.yml)" >> "$GITHUB_STEP_SUMMARY"

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Build log gate
    needs: [meta, android, web, linux, windows, macos-setup-ui, macos-app, macos, ios]
    if: always() && needs.meta.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Build log gate
          token: ${{ github.token }}
