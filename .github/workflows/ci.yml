name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Woechentlich, damit neue Fehler auch ohne Commit auffallen (#115).
  schedule:
    - cron: "11 4 * * 5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyse (Format + Analyzer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # #104: Die App-Version kommt nur aus dem Release; feste Nummern sind ein Fehler.
      - name: Keine feste App-Version
        run: bash tool/check_fixed_versions.sh

      - name: Flutter einrichten
        uses: ./.github/actions/setup-flutter

      - name: Formatierung pruefen
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyzer (fatal-infos)
        run: flutter analyze --fatal-infos

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Systempakete (Native-Asset-Hooks)
        uses: ./.github/actions/linux-deps

      - name: Flutter einrichten
        uses: ./.github/actions/setup-flutter

      # Golden-Tests (*_golden_test.dart, Tag "golden") haengen von der Rasterung des
      # Betriebssystems ab und laufen deshalb im Job "goldens" (Windows-Runner), nur dort
      # entstehen und gelten die Referenzbilder.
      - name: Tests mit Coverage (ohne Goldens)
        run: |
          mapfile -t files < <(find test -name '*_test.dart' ! -name '*_golden_test.dart' | sort)
          flutter test --coverage --branch-coverage --reporter=expanded "${files[@]}"

      - name: lcov installieren (HTML-Bericht)
        if: always()
        run: sudo apt-get install -y -q --no-install-recommends lcov

      # "flutter test --coverage" meldet nur Dateien, die ein Test laedt. Ungeladene Dateien
      # fehlten sonst im Wert und der Prozentsatz waere zu hoch. Dieser Lauf importiert jede
      # lib-Datei einmal, damit sie mit ihren (ungetroffenen) Zeilen in die Messung kommt.
      # Ausgenommen: generierter Code, part-Dateien und Dateien mit Web-Bibliotheken (nur im
      # Browser kompilierbar). Fehler hier bremsen den Job nicht, der Bericht nennt dann die
      # Dateien ohne Messdaten.
      - name: Ungeladene lib-Dateien einmessen
        if: always()
        continue-on-error: true
        run: |
          pkg=$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml | tr -d '\r')
          out=test/zz_coverage_all_test.dart
          {
            echo "// ignore_for_file: unused_import, directives_ordering"
            i=0
            while IFS= read -r f; do
              grep -q '^part of' "$f" && continue
              grep -qE "package:web/|dart:js_interop|dart:js_util|dart:html|dart:ui_web" "$f" && continue
              i=$((i + 1))
              echo "import 'package:${pkg}/${f#lib/}' as a${i};"
            done < <(find lib -name '*.dart' ! -path 'lib/l10n/gen/*' | sort)
            echo "void main() {}"
          } > "$out"
          flutter test --coverage --branch-coverage --coverage-path coverage/lcov.all.info "$out"
          rm -f "$out"

      - name: Coverage auswerten (gefiltert, je Datei, HTML)
        if: always()
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "Keine Coverage-Datei erzeugt." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash tool/coverage_report.sh coverage/lcov.info coverage/lcov.all.info coverage/report
          cat coverage/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          genhtml --quiet --branch-coverage --output-directory coverage/html coverage/report/lcov.filtered.info \
            || genhtml --quiet --output-directory coverage/html coverage/report/lcov.filtered.info \
            || echo "genhtml fehlgeschlagen, HTML-Bericht fehlt." >> "$GITHUB_STEP_SUMMARY"

      # Coverage darf nicht sinken: Vergleich der Zeilenabdeckung mit dem letzten erfolgreichen
      # Lauf auf main (Artefakt coverage-lcov, Datei report/total.txt). Toleranz 0,10 Prozentpunkte
      # gegen Messrauschen. Solange main noch keinen Vergleichswert hat, nur Hinweis.
      - name: Coverage darf nicht sinken
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f coverage/report/total.txt ] || { echo "::error::Keine Coverage-Auswertung vorhanden."; exit 1; }
          cur=$(sed -n 's/^lines=//p' coverage/report/total.txt)
          found=""
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
                        --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n coverage-lcov -D coverage/base >/dev/null 2>&1 \
               && [ -f coverage/base/report/total.txt ]; then found="$id"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::notice::Kein Coverage-Vergleichswert auf main gefunden (erst nach dem ersten main-Lauf mit dieser Auswertung)."
            echo "**Coverage-Vergleich:** kein Wert auf main, uebersprungen. Aktuell ${cur} %." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base=$(sed -n 's/^lines=//p' coverage/base/report/total.txt)
          echo "main (Lauf ${found}): ${base} %, dieser Lauf: ${cur} %"
          echo "**Coverage-Vergleich:** main ${base} %, dieser PR ${cur} %." >> "$GITHUB_STEP_SUMMARY"
          if awk -v c="$cur" -v b="$base" 'BEGIN { exit !(c + 0.10 < b) }'; then
            echo "::error::Coverage gesunken: ${base} % auf main, ${cur} % hier. Tests fuer neuen Code ergaenzen."
            exit 1
          fi

      - name: Coverage hochladen (lcov, Zusammenfassung)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
            coverage/lcov.all.info
            coverage/report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Coverage-HTML hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: coverage/html/
          if-no-files-found: ignore
          retention-days: 30

  goldens:
    name: Golden-Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Golden-Tests vorhanden?
        id: find
        shell: bash
        run: |
          mapfile -t files < <(find test -name '*_golden_test.dart' | sort)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "files=${files[*]}" >> "$GITHUB_OUTPUT"

      - name: Rust-Toolchain (Native-Asset-Hooks)
        if: steps.find.outputs.count != '0'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Flutter einrichten
        if: steps.find.outputs.count != '0'
        uses: ./.github/actions/setup-flutter

      - name: Golden-Tests
        if: steps.find.outputs.count != '0'
        shell: bash
        env:
          GOLDEN_FILES: ${{ steps.find.outputs.files }}
        run: |
          read -r -a files <<< "$GOLDEN_FILES"
          flutter test --reporter=expanded --tags golden "${files[@]}"

      - name: Abweichungen hochladen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
          retention-days: 14

      # Bei Abweichung oder fehlenden Referenzbildern: Bilder auf diesem Runner neu erzeugen und
      # als Kandidaten bereitstellen. Nach Sichtpruefung in den Branch kopieren und committen
      # (docs/ENTWICKLUNG.md, "Goldens aktualisieren"). Der Job bleibt rot.
      - name: Referenzbilder-Kandidaten erzeugen
        if: failure() && steps.find.outputs.count != '0'
        shell: bash
        env:
          GOLDEN_FILES: ${{ steps.find.outputs.files }}
        run: |
          read -r -a files <<< "$GOLDEN_FILES"
          flutter test --update-goldens --tags golden "${files[@]}"

      - name: Kandidaten hochladen
        if: failure() && steps.find.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-kandidaten
          path: test/**/goldens/*.png
          if-no-files-found: ignore
          retention-days: 14

  l10n-check:
    name: Uebersetzungen pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fehlende Schluessel in Nicht-Vorlage-Sprachen
        run: |
          set -euo pipefail
          template="lib/l10n/$(sed -n 's/^template-arb-file:[[:space:]]*//p' l10n.yaml | tr -d '\r')"
          echo "Vorlage: $template"
          keys() { jq -r 'keys[] | select(startswith("@") | not)' "$1" | sort; }
          keys "$template" > /tmp/template.keys
          status=0
          for arb in lib/l10n/app_*.arb; do
            [ "$arb" = "$template" ] && continue
            missing=$(comm -23 /tmp/template.keys <(keys "$arb"))
            extra=$(comm -13 /tmp/template.keys <(keys "$arb"))
            if [ -n "$missing" ]; then
              status=1
              echo "::error file=$arb::Fehlende Schluessel: $(echo "$missing" | paste -sd, -)"
            fi
            if [ -n "$extra" ]; then
              echo "::warning file=$arb::Schluessel nicht in der Vorlage: $(echo "$extra" | paste -sd, -)"
            fi
            echo "$arb: $(keys "$arb" | wc -l) Schluessel, fehlend: $(echo -n "$missing" | grep -c . || true)"
          done
          exit "$status"

      - name: Flutter einrichten
        uses: ./.github/actions/setup-flutter

      - name: Generierte Lokalisierung aktuell
        run: |
          flutter gen-l10n
          if ! git diff --exit-code -- lib/l10n/gen; then
            echo "::error::lib/l10n/gen ist veraltet. Lokal 'flutter gen-l10n' ausfuehren und committen."
            exit 1
          fi

  web-smoke:
    name: Web-Build (Smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Flutter einrichten
        uses: ./.github/actions/setup-flutter

      - name: Konfiguration schreiben
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Web bauen
        run: >-
          flutter build web --release --wasm --no-web-resources-cdn
          --dart-define-from-file=config/app.json --base-href /

      - name: Ersatzschriften selbst hosten (L14)
        run: |
          # Noto-Fallback nach build/web/assets/fonts/fallback/ (Pruefsummen aus tool/font_fallback.lock.json).
          cp tool/fetch_font_fallback.dart tool/web_postbuild.dart "$RUNNER_TEMP/"
          dart run "$RUNNER_TEMP/fetch_font_fallback.dart" build/web --strict

      - name: Postbuild (falls vorhanden)
        run: |
          if [ -f tool/web_postbuild.dart ]; then
            # Ausserhalb des Pakets starten (nur dart:-Importe), sonst baut "dart run" die Native-Asset-Hooks (GTK).
            cp tool/web_postbuild.dart "$RUNNER_TEMP/web_postbuild.dart"
            dart run "$RUNNER_TEMP/web_postbuild.dart" build/web
          else
            echo "tool/web_postbuild.dart fehlt noch (Paket P22), Schritt uebersprungen." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build-Ergebnis pruefen
        run: |
          set -euo pipefail
          for f in index.html flutter_bootstrap.js; do
            test -s "build/web/$f" || { echo "::error::build/web/$f fehlt"; exit 1; }
          done
          ls build/web/main*.dart.js >/dev/null 2>&1 || { echo "::error::kein main*.dart.js"; exit 1; }
          ls build/web/main*.dart.wasm >/dev/null 2>&1 || { echo "::error::kein main*.dart.wasm"; exit 1; }
          test -d build/web/canvaskit || { echo "::error::canvaskit/ fehlt (no-web-resources-cdn)"; exit 1; }
          if grep -rIl --include='*.js' --include='*.html' 'gstatic.com' build/web >/dev/null; then
            echo "::warning::Verweis auf gstatic.com im Web-Build gefunden"
          fi
          echo "**Web-Build:** $(du -sh build/web | cut -f1), $(find build/web -type f | wc -l) Dateien" >> "$GITHUB_STEP_SUMMARY"
