name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so new failures show up even without a commit.
  schedule:
    - cron: "11 4 * * 5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (format + analyzer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app version comes only from the release; hard-coded numbers are an error.
      - name: No fixed app version
        run: bash tool/check_fixed_versions.sh

      # Files describe behaviour in words; no tracker numbers or tracker words.
      - name: No tracker references
        run: python3 tool/check_no_issue_refs.py

      # Retired brand name nowhere, developer shown by name (linked), never by URL.
      - name: Branding
        run: python3 tool/check_branding.py

      # Dart files under lib/ and test/ stay at 400 lines or fewer.
      - name: File length limit
        run: python3 tool/check_file_lines.py

      # GitHub Actions files are English only.
      - name: English GitHub Actions
        run: python3 tool/check_english_ci.py

      # dependency_overrides only with a documented reason.
      - name: Dependency overrides documented
        run: bash tool/check_dependency_overrides.sh

      # The config check imports the app package, so "dart run" builds the
      # native asset hooks against GTK. It runs here, beside the short analyzer,
      # instead of on the critical path of the longer "Tests" job.
      - name: System packages (native asset hooks)
        uses: ./.github/actions/linux-deps

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Check config folder (config/)
        run: dart run tool/check_config.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyzer (fatal-infos)
        run: flutter analyze --fatal-infos

      - name: Python tool tests
        run: python3 -m unittest discover -s test/tool -p "test_*.py"

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System packages (native asset hooks)
        uses: ./.github/actions/linux-deps

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # Golden tests (*_golden_test.dart, tag "golden") depend on the operating
      # system's rasterization and therefore run in the "goldens" job (Windows runner);
      # the reference images are created and valid only there.
      - name: Tests with coverage (without goldens)
        env:
          # Fuzz tests (test/data/fuzz): more random cases than the local default.
          FUZZ_RUNS: '10000'
        run: |
          mapfile -t files < <(find test -name '*_test.dart' ! -name '*_golden_test.dart' | sort)
          flutter test --coverage --branch-coverage --reporter=expanded "${files[@]}"

      - name: Install lcov (HTML report)
        if: always()
        run: sudo apt-get install -y -q --no-install-recommends lcov

      # "flutter test --coverage" only reports files that a test loads. Unloaded files
      # would otherwise be missing from the figure and the percentage would be too high.
      # This run imports every lib file once so that it enters the measurement with its
      # (uncovered) lines. Excluded: generated code, part files and files using web
      # libraries (compilable in the browser only). Failures here do not stop the job; the
      # report then lists the files without measurement data.
      - name: Measure unloaded lib files
        if: always()
        run: |
          pkg=$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml | tr -d '\r')
          out=test/zz_coverage_all_test.dart
          {
            echo "// ignore_for_file: unused_import, directives_ordering"
            i=0
            while IFS= read -r f; do
              grep -q '^part of' "$f" && continue
              grep -qE "package:web/|dart:js_interop|dart:js_util|dart:html|dart:ui_web" "$f" && continue
              i=$((i + 1))
              echo "import 'package:${pkg}/${f#lib/}' as a${i};"
            done < <(find lib -name '*.dart' ! -path 'lib/l10n/gen/*' | sort)
            echo "import 'package:flutter_test/flutter_test.dart';"
            # flutter test exits with 79 when a file declares no test.
            echo "void main() => test('every lib file loads', () {});"
          } > "$out"
          flutter test --coverage --branch-coverage --coverage-path coverage/lcov.all.info "$out"
          rm -f "$out"

      - name: Evaluate coverage (filtered, per file, HTML)
        if: always()
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage file produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash tool/coverage_report.sh coverage/lcov.info coverage/lcov.all.info coverage/report
          cat coverage/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          # No fallback and no --ignore-errors: an inconsistent report turns the job red.
          genhtml --quiet --branch-coverage --output-directory coverage/html coverage/report/lcov.filtered.info

      # Coverage must not drop: compare line coverage with the last successful run on
      # main (artifact coverage-lcov, file report/total.txt). Tolerance of 0.10 percentage
      # points against measurement noise. While main has no reference value yet, notice only.
      - name: Coverage must not drop
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f coverage/report/total.txt ] || { echo "::error::No coverage evaluation available."; exit 1; }
          cur=$(sed -n 's/^lines=//p' coverage/report/total.txt)
          found=""
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
                        --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n coverage-lcov -D coverage/base >/dev/null 2>&1 \
               && [ -f coverage/base/report/total.txt ]; then found="$id"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::notice::No coverage reference value found on main (only available after the first main run with this evaluation)."
            echo "**Coverage comparison:** no value on main, skipped. Current ${cur} %." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base=$(sed -n 's/^lines=//p' coverage/base/report/total.txt)
          echo "main (run ${found}): ${base} %, this run: ${cur} %"
          echo "**Coverage comparison:** main ${base} %, this revision ${cur} %." >> "$GITHUB_STEP_SUMMARY"
          if awk -v c="$cur" -v b="$base" 'BEGIN { exit !(c + 0.10 < b) }'; then
            echo "::error::Coverage dropped: ${base} % on main, ${cur} % here. Add tests for the new code."
            exit 1
          fi

      - name: Upload coverage (lcov, summary)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
            coverage/lcov.all.info
            coverage/report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: coverage/html/
          if-no-files-found: ignore
          retention-days: 30

  integration:
    name: Integration test (playback flow)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System packages (native asset hooks)
        uses: ./.github/actions/linux-deps

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # Whole app (widgets, navigation, controller, providers) with a fake
      # audio backend and no network: play, now playing, stop, play again.
      # Headless, no device. The Windows desktop test runs nightly in
      # itest-windows.yml.
      - name: Playback flow
        run: flutter test -d flutter-tester --reporter=expanded integration_test/playback_flow_test.dart

  goldens:
    name: Golden tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Golden tests present?
        id: find
        shell: bash
        run: |
          mapfile -t files < <(find test -name '*_golden_test.dart' | sort)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "files=${files[*]}" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain (native asset hooks)
        if: steps.find.outputs.count != '0'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Set up Flutter
        if: steps.find.outputs.count != '0'
        uses: ./.github/actions/setup-flutter

      - name: Golden tests
        if: steps.find.outputs.count != '0'
        shell: bash
        env:
          GOLDEN_FILES: ${{ steps.find.outputs.files }}
        run: |
          read -r -a files <<< "$GOLDEN_FILES"
          flutter test --reporter=expanded --tags golden "${files[@]}"

      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
          retention-days: 14

      # On a mismatch or missing reference images: regenerate the images on this runner and
      # provide them as candidates. After visual review, copy them into the branch and commit
      # (docs/ENTWICKLUNG.md, "Goldens aktualisieren"). The job stays red.
      - name: Generate reference image candidates
        if: failure() && steps.find.outputs.count != '0'
        shell: bash
        env:
          GOLDEN_FILES: ${{ steps.find.outputs.files }}
        run: |
          read -r -a files <<< "$GOLDEN_FILES"
          flutter test --update-goldens --tags golden "${files[@]}"

      - name: Upload candidates
        if: failure() && steps.find.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-kandidaten
          path: test/**/goldens/*.png
          if-no-files-found: ignore
          retention-days: 14

  l10n-check:
    name: Check translations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Missing keys in non-template languages
        run: |
          set -euo pipefail
          template="lib/l10n/$(sed -n 's/^template-arb-file:[[:space:]]*//p' l10n.yaml | tr -d '\r')"
          echo "Template: $template"
          keys() { jq -r 'keys[] | select(startswith("@") | not)' "$1" | sort; }
          keys "$template" > /tmp/template.keys
          status=0
          for arb in lib/l10n/app_*.arb; do
            [ "$arb" = "$template" ] && continue
            missing=$(comm -23 /tmp/template.keys <(keys "$arb"))
            extra=$(comm -13 /tmp/template.keys <(keys "$arb"))
            if [ -n "$missing" ]; then
              status=1
              echo "::error file=$arb::Missing keys: $(echo "$missing" | paste -sd, -)"
            fi
            if [ -n "$extra" ]; then
              echo "::warning file=$arb::Keys not in the template: $(echo "$extra" | paste -sd, -)"
            fi
            echo "$arb: $(keys "$arb" | wc -l) keys, missing: $(echo -n "$missing" | grep -c . || true)"
          done
          exit "$status"

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Generated localization up to date
        run: |
          flutter gen-l10n
          if ! git diff --exit-code -- lib/l10n/gen; then
            echo "::error::lib/l10n/gen is outdated. Run 'flutter gen-l10n' locally and commit."
            exit 1
          fi

  web-smoke:
    name: Web build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Build web
        shell: bash
        run: |
          mapfile -t web_defines < <(bash tool/web_define_passthrough.sh)
          flutter build web --release --wasm --no-web-resources-cdn             --dart-define-from-file=config/app.json --base-href / "${web_defines[@]}"

      - name: Self-host fallback fonts
        run: |
          # Noto fallback into build/web/assets/fonts/fallback/ (checksums from tool/font_fallback.lock.json).
          cp tool/fetch_font_fallback.dart tool/web_postbuild.dart "$RUNNER_TEMP/"
          dart run "$RUNNER_TEMP/fetch_font_fallback.dart" build/web --strict

      - name: Postbuild (if present)
        run: |
          if [ -f tool/web_postbuild.dart ]; then
            # Start outside the package (dart: imports only), otherwise "dart run" builds the native asset hooks (GTK).
            cp tool/web_postbuild.dart "$RUNNER_TEMP/web_postbuild.dart"
            dart run "$RUNNER_TEMP/web_postbuild.dart" build/web --no-precompress
          else
            echo "tool/web_postbuild.dart does not exist yet, step skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check build output
        run: |
          set -euo pipefail
          for f in index.html flutter_bootstrap.js; do
            test -s "build/web/$f" || { echo "::error::build/web/$f is missing"; exit 1; }
          done
          ls build/web/main*.dart.js >/dev/null 2>&1 || { echo "::error::no main*.dart.js"; exit 1; }
          ls build/web/main*.dart.wasm >/dev/null 2>&1 || { echo "::error::no main*.dart.wasm"; exit 1; }
          test -d build/web/canvaskit || { echo "::error::canvaskit/ is missing (no-web-resources-cdn)"; exit 1; }
          # The engine keeps the gstatic.com CanvasKit URL as a default string;
          # what matters is that the build config switches to the bundled copy.
          grep -qF '"useLocalCanvasKit":true' build/web/flutter_bootstrap.js || { echo "::error::flutter_bootstrap.js does not use the bundled CanvasKit"; exit 1; }
          echo "**Web build:** $(du -sh build/web | cut -f1), $(find build/web -type f | wc -l) files" >> "$GITHUB_STEP_SUMMARY"

      # Size budget (tool/perf/bundle_budget.json): fails when the start-up
      # files or app assets grow past it.
      - name: Bundle budget
        run: python3 -I tool/perf/bundle_budget.py build/web

      # Hand the finished build (including hidden files such as .well-known) to the hosting smoke tests.
      - name: Upload web build for the hosting tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosting-web-${{ github.sha }}
          path: |
            build/web
            build/hosting
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Static checks of the hosting configs: header sets and cache rules must agree across nginx,
  # Plesk (nginx directives and .htaccess) and Cloudflare _headers; syntax with pinned images.
  hosting-config:
    name: Hosting config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Header and cache consistency across nginx, .htaccess and _headers
        run: |
          set -euo pipefail
          python3 tool/test_hosting_check.py
          python3 tool/hosting_check.py consistency

      - name: compose config, nginx -t, httpd -t
        run: bash tool/check_hosting_config.sh

  # Real servers with the real web build: the nginx container (standalone and behind Traefik) and
  # Apache with the Plesk .htaccess. Images are built here, never on the developer machine.
  hosting-smoke:
    name: Hosting smoke (${{ matrix.variant }})
    needs: web-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [nginx, traefik, apache]
    env:
      TRAEFIK_IMAGE: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
      HTTPD_IMAGE: httpd:2.4.66-alpine@sha256:968c8b4098fcecb473762b45f6c541a3b2b2cfab2caccb1edbd2cece071ef160
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch web build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosting-web-${{ github.sha }}
          path: build

      - name: nginx container (deploy/nginx)
        if: ${{ matrix.variant == 'nginx' }}
        run: |
          set -euo pipefail
          docker compose -f deploy/nginx/docker-compose.yml up -d --build --wait --wait-timeout 120
          python3 tool/hosting_check.py smoke --web build/web --port 8080

      - name: nginx container behind Traefik (deploy/traefik)
        if: ${{ matrix.variant == 'traefik' }}
        run: |
          set -euo pipefail
          # Test certificate for the default store: SAN covers the host name and the loopback IP,
          # so the smoke client verifies the TLS connection instead of skipping verification.
          certdir="$RUNNER_TEMP/traefik-tls"
          mkdir -p "$certdir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=app.linefm.de"             -keyout "$certdir/test.key" -out "$certdir/test.crt"             -addext "subjectAltName=DNS:app.linefm.de,IP:127.0.0.1"             -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=digitalSignature,keyCertSign"
          chmod 644 "$certdir/test.key"
          # The router references the shipped TLS options (linefm@file, sniStrict), so the file provider
          # loads them next to the test certificate. sniStrict ignores the default certificate, so the
          # certificate is listed explicitly as well.
          printf '%s\n' 'tls:' '  certificates:' '    - certFile: /certs/test.crt' '      keyFile: /certs/test.key' '  stores:' '    default:' '      defaultCertificate:' '        certFile: /certs/test.crt' '        keyFile: /certs/test.key' > "$certdir/dynamic.yml"
          cp deploy/traefik/linefm-tls.dynamic.yml "$certdir/linefm-tls.yml"
          docker network create traefik
          docker run -d --name traefik --network traefik             -p 127.0.0.1:8000:80 -p 127.0.0.1:8443:443             -v /var/run/docker.sock:/var/run/docker.sock:ro -v "$certdir:/certs:ro" "$TRAEFIK_IMAGE"             --providers.docker=true --providers.docker.exposedbydefault=false --providers.file.directory=/certs             --entrypoints.web.address=:80 --entrypoints.websecure.address=:443
          docker compose -f deploy/traefik/docker-compose.yml -f tool/hosting/traefik-smoke.yml             up -d --build --wait --wait-timeout 120
          for _ in $(seq 1 30); do
            curl -sf --cacert "$certdir/test.crt" -o /dev/null --resolve app.linefm.de:8443:127.0.0.1 https://app.linefm.de:8443/healthz && break
            sleep 1
          done
          python3 tool/hosting_check.py smoke --web build/web --port 8443 --tls --cafile "$certdir/test.crt" --redirect-port 8000

      - name: Apache with the Plesk .htaccess (deploy/plesk)
        if: ${{ matrix.variant == 'apache' }}
        run: |
          set -euo pipefail
          test -s build/web/.htaccess
          docker run -d --name httpd -p 127.0.0.1:8082:80             -v "$PWD/tool/hosting/httpd-smoke.conf:/usr/local/apache2/conf/httpd.conf:ro"             -v "$PWD/build/web:/usr/local/apache2/htdocs:ro" "$HTTPD_IMAGE"
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8082/ && break
            sleep 1
          done
          python3 tool/hosting_check.py smoke --web build/web --port 8082 --no-healthz --allow-server-version

      # Only on failure: server logs contain expected 404 lines that must not reach the log gate.
      - name: Container logs
        if: ${{ failure() }}
        run: |
          for c in $(docker ps -aq); do
            echo "::group::$(docker inspect -f '{{.Name}}' "$c")"
            docker logs "$c" 2>&1 | tail -n 60 || true
            echo "::endgroup::"
          done

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Build log gate
    needs: [analyze, test, integration, goldens, l10n-check, web-smoke, hosting-config, hosting-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Build log gate
          token: ${{ github.token }}
