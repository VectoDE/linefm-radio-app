name: CodeQL

# CodeQL does not support Dart (flutter analyze in ci.yml covers it).
# Analyzed: GitHub Actions workflows (every change/push), Android Kotlin/Java (weekly
# or manual), Swift (manual only, macOS minutes count 10x in a private repo).
# Without Code Scanning (private repo without GitHub Advanced Security) the SARIF
# results are stored as an artifact and findings fail the job. With the repository
# variable CODE_SCANNING_ENABLED=true or a public repo, the results are uploaded.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:
    inputs:
      swift:
        description: Also analyze Swift (iOS/macOS, macOS runner)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPLOAD: ${{ (vars.CODE_SCANNING_ENABLED == 'true' || !github.event.repository.private) && 'always' || 'never' }}

jobs:
  actions:
    name: CodeQL actions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: actions
          build-mode: none
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:actions
          upload: ${{ env.UPLOAD }}
          output: sarif-results

      - name: Results
        if: always()
        uses: ./.github/actions/codeql-results
        with:
          language: actions
          upload: ${{ env.UPLOAD }}

  java-kotlin:
    name: CodeQL java-kotlin
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # Gradle User Home cache (wrapper, dependencies, transforms). Written on
      # main only, read-only elsewhere.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: never
          cache-provider: basic

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Build Android (Kotlin extraction)
        run: flutter build apk --debug --dart-define-from-file=config/app.json

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:java-kotlin
          upload: ${{ env.UPLOAD }}
          output: sarif-results

      - name: Results
        if: always()
        uses: ./.github/actions/codeql-results
        with:
          language: java-kotlin
          upload: ${{ env.UPLOAD }}

  swift:
    name: CodeQL swift
    if: github.event_name == 'workflow_dispatch' && inputs.swift
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build iOS and macOS (Swift extraction)
        run: |
          flutter build ios --debug --no-codesign --dart-define-from-file=config/app.json
          flutter build macos --debug --dart-define-from-file=config/app.json

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:swift
          upload: ${{ env.UPLOAD }}
          output: sarif-results

      - name: Results
        if: always()
        uses: ./.github/actions/codeql-results
        with:
          language: swift
          upload: ${{ env.UPLOAD }}

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [actions, java-kotlin, swift]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
