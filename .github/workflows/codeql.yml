name: CodeQL

# Dart wird von CodeQL nicht unterstuetzt (dafuer flutter analyze in ci.yml).
# Analysiert: GitHub-Actions-Workflows (jeder PR/Push), Android-Kotlin/Java (woechentlich
# oder manuell), Swift (nur manuell, macOS-Minuten zaehlen im privaten Repo 10-fach).
# Ohne Code Scanning (privates Repo ohne GitHub Advanced Security) werden die SARIF-
# Ergebnisse als Artefakt abgelegt und Befunde lassen den Job scheitern. Mit
# Repository-Variable CODE_SCANNING_ENABLED=true oder oeffentlichem Repo erfolgt der Upload.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:
    inputs:
      swift:
        description: Swift (iOS/macOS) mitanalysieren (macOS-Runner)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPLOAD: ${{ (vars.CODE_SCANNING_ENABLED == 'true' || !github.event.repository.private) && 'always' || 'never' }}

jobs:
  actions:
    name: CodeQL actions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          build-mode: none
          queries: security-and-quality

      - name: Analysieren
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:actions
          upload: ${{ env.UPLOAD }}
          output: sarif-results

      - name: Ergebnisse
        if: always()
        uses: ./.github/actions/codeql-results
        with:
          language: actions
          upload: ${{ env.UPLOAD }}

  java-kotlin:
    name: CodeQL java-kotlin
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Flutter einrichten
        uses: ./.github/actions/setup-flutter

      - name: Konfiguration schreiben
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Android bauen (Kotlin-Extraktion)
        run: flutter build apk --debug --dart-define-from-file=config/app.json

      - name: Analysieren
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin
          upload: ${{ env.UPLOAD }}
          output: sarif-results

      - name: Ergebnisse
        if: always()
        uses: ./.github/actions/codeql-results
        with:
          language: java-kotlin
          upload: ${{ env.UPLOAD }}

  swift:
    name: CodeQL swift
    if: github.event_name == 'workflow_dispatch' && inputs.swift
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Flutter einrichten
        uses: ./.github/actions/setup-flutter

      - name: Konfiguration schreiben
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: iOS und macOS bauen (Swift-Extraktion)
        run: |
          flutter build ios --debug --no-codesign --dart-define-from-file=config/app.json
          flutter build macos --debug --dart-define-from-file=config/app.json

      - name: Analysieren
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
          upload: ${{ env.UPLOAD }}
          output: sarif-results

      - name: Ergebnisse
        if: always()
        uses: ./.github/actions/codeql-results
        with:
          language: swift
          upload: ${{ env.UPLOAD }}
