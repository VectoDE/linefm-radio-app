name: DAST

# Dynamic checks of the own web build. Everything runs against
# localhost on the runner: the web build is served with Cloudflare Pages
# semantics (wrangler pages dev, real _headers) and scanned with nikto.
# No third-party host is scanned. dependency-check runs when the secret
# NVD_API_KEY exists and is skipped cleanly otherwise.
# Report only: findings do not fail the job; triage happens in the tracker.

on:
  # Changes to this workflow are tested in their own proposed change (no secrets on forks).
  pull_request:
    paths:
      - .github/workflows/dast.yml
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same wrangler version as deploy-web.yml.
  WRANGLER_VERSION: "4.165.0"
  # sullo/nikto has no releases; pinned commit (checked 2026-11-25).
  NIKTO_COMMIT: 312645d873478a77986627ab1fc8cffe595e85d4
  DC_VERSION: "13.0.0"
  DC_SHA256: 44d920d1ec03e948df862a253f0912782a31b9beee8a7c8895b9cb95760176ed

jobs:
  nikto:
    name: nikto (web build on localhost)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Build web
        run: |
          set -euo pipefail
          mapfile -t web_defines < <(bash tool/web_define_passthrough.sh)
          flutter build web --release --wasm --no-web-resources-cdn             --dart-define-from-file=config/app.json --base-href / "${web_defines[@]}"

      - name: Fallback fonts and postbuild
        run: |
          cp tool/fetch_font_fallback.dart tool/web_postbuild.dart "$RUNNER_TEMP/"
          dart run "$RUNNER_TEMP/fetch_font_fallback.dart" build/web --strict
          dart run "$RUNNER_TEMP/web_postbuild.dart" build/web --no-precompress
          # Same cleanup as the Cloudflare deploy (deploy-web.yml).
          find build/web -name '.htaccess' -type f -delete
          find build/web -mindepth 1 -name '.*' -not -path '*/.well-known' -not -path '*/.well-known/*' -prune -exec rm -rf {} +

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Serve with Pages semantics
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" pages dev build/web --ip 127.0.0.1 --port 8788 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for _ in $(seq 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8788/; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/wrangler.log"
          exit 1

      - name: Fetch nikto (pinned commit)
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nikto"
          git -C "$RUNNER_TEMP/nikto" fetch -q --depth 1 https://github.com/sullo/nikto.git "$NIKTO_COMMIT"
          git -C "$RUNNER_TEMP/nikto" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nikto" rev-parse HEAD)" = "$NIKTO_COMMIT"

      # nikto checks for XML::Writer at start-up and stops without a report
      # when the module is missing (it is not part of the runner's Perl).
      # Its LibWhisker looks for Net::SSLeay (or Net::SSL) and leaves
      # $LW2::_SSL_LIBRARY undefined without one, which Perl warns about.
      - name: Install nikto Perl modules
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxml-writer-perl libnet-ssleay-perl

      - name: nikto
        working-directory: ${{ runner.temp }}/nikto/program
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          # A non-zero exit only means nikto reported findings; a missing or
          # empty report means the scan itself failed.
          # -nocheck skips the online update check, which fails from CI (HTTP 400).
          # -Plugins also limits the report plugins: without report_text the
          # headers-only run writes no file.
          perl nikto.pl -h http://127.0.0.1:8788 -maxtime 1500s -nointeractive -nocheck \
            -Format json -o "$GITHUB_WORKSPACE/out/nikto.json" || true
          perl nikto.pl -h http://127.0.0.1:8788 -maxtime 600s -nointeractive -nocheck \
            -Plugins "headers;report_text" -Format txt -o "$GITHUB_WORKSPACE/out/nikto-headers.txt" || true
          for f in nikto.json nikto-headers.txt; do
            test -s "$GITHUB_WORKSPACE/out/$f" || { echo "::error::nikto wrote no $f"; exit 1; }
          done

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f out/nikto.json ]; then
            n=$(jq '[.. | objects | select(has("msg"))] | length' out/nikto.json 2>/dev/null || echo "?")
            echo "**nikto** (commit \`${NIKTO_COMMIT:0:7}\`, localhost): $n entries" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.. | objects | select(has("msg")) | "- \(.url // "") \(.msg)"' out/nikto.json 2>/dev/null | head -50 >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "**nikto:** no report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nikto-report-${{ github.sha }}
          path: out/
          retention-days: 30
          if-no-files-found: error

  dependency-check:
    name: OWASP dependency-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Skip without NVD key
        if: ${{ env.NVD_API_KEY == '' }}
        run: echo "**dependency-check:** skipped, secret NVD_API_KEY is not set" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: ${{ env.NVD_API_KEY != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        if: ${{ env.NVD_API_KEY != '' }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch dependency-check (pinned, checksum)
        if: ${{ env.NVD_API_KEY != '' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLo dc.zip "https://github.com/dependency-check/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          echo "${DC_SHA256}  dc.zip" | sha256sum -c -
          unzip -q dc.zip

      # The Node analyzer needs node_modules next to each package-lock.json
      # and warns without it. Install exactly the locked versions, no scripts.
      - name: Install locked Node tools
        if: ${{ env.NVD_API_KEY != '' }}
        run: |
          set -euo pipefail
          for dir in tool/a11y tool/perf; do
            npm ci --prefix "$dir" --ignore-scripts --no-audit --no-fund
          done

      - name: dependency-check
        if: ${{ env.NVD_API_KEY != '' }}
        env:
          # The bundled H2/Lucene call java.lang.foreign; without this flag the
          # JVM prints a restricted-method warning on every run.
          JAVA_OPTS: --enable-native-access=ALL-UNNAMED
        run: |
          mkdir -p out
          "$RUNNER_TEMP/dependency-check/bin/dependency-check.sh" --project linefm-radio \
            --scan . --exclude '**/.git/**' --disableOssIndex \
            --nvdApiKey "$NVD_API_KEY" --format JSON --format HTML --out out \
            --data "$RUNNER_TEMP/dc-data"

      - name: Summary
        if: ${{ always() && env.NVD_API_KEY != '' }}
        run: |
          if [ -f out/dependency-check-report.json ]; then
            jq -r '"**dependency-check:** \([.dependencies[] | select(.vulnerabilities)] | length) dependencies with findings"' out/dependency-check-report.json >> "$GITHUB_STEP_SUMMARY"
            jq -r '.dependencies[] | select(.vulnerabilities) | "- \(.fileName): \([.vulnerabilities[] | "\(.name) (\(.severity))"] | join(", "))"' out/dependency-check-report.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**dependency-check:** no report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: ${{ always() && env.NVD_API_KEY != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report-${{ github.sha }}
          path: out/
          retention-days: 30
          if-no-files-found: warn

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [nikto, dependency-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
