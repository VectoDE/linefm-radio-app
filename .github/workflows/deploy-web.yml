name: Deploy Web

# Deploys the web variant (artifact "*-web.zip" from the GitHub release) to the selected targets:
#   cloudflare  Cloudflare Pages via wrangler
#   ssh         own nginx/Traefik server via rsync, release folder + atomic symlink switch
#   plesk       Plesk document root via rsync over SSH
# Targets: input "targets" (comma-separated) or, if empty, the repository variable
# WEB_DEPLOY_TARGETS. Without either, nothing happens (note in the summary).
# Each target runs in the "production" environment (configure required reviewers there) and only
# with complete secrets; otherwise it is skipped. Untested (no target server/account available).
# Setup guide and secret list: docs/secrets.md, docs/hosting-*.md.

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag (vX.Y.Z)
        type: string
        required: true
      targets:
        description: Targets, comma-separated (cloudflare, ssh, plesk). Empty = variable WEB_DEPLOY_TARGETS
        type: string
        required: false
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      DEPLOY_HOST:
        required: false
      DEPLOY_USER:
        required: false
      DEPLOY_SSH_KEY:
        required: false
      DEPLOY_KNOWN_HOSTS:
        required: false
      PLESK_SSH_HOST:
        required: false
      PLESK_SSH_USER:
        required: false
      PLESK_SSH_KEY:
        required: false
      PLESK_SSH_KNOWN_HOSTS:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag of an existing release (form vX.Y.Z)
        type: string
        required: true
      targets:
        description: Targets, comma-separated (cloudflare, ssh, plesk). Empty = variable WEB_DEPLOY_TARGETS
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  plan:
    name: Determine targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      cloudflare: ${{ steps.plan.outputs.cloudflare }}
      ssh: ${{ steps.plan.outputs.ssh }}
      plesk: ${{ steps.plan.outputs.plesk }}
    steps:
      - name: Evaluate targets
        id: plan
        env:
          TAG: ${{ inputs.tag }}
          INPUT_TARGETS: ${{ inputs.targets }}
          VAR_TARGETS: ${{ vars.WEB_DEPLOY_TARGETS }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag: $TAG"
            exit 1
          fi
          targets="${INPUT_TARGETS:-$VAR_TARGETS}"
          targets="${targets// /}"
          for t in cloudflare ssh plesk; do
            if [[ ",$targets," == *",$t,"* ]]; then echo "$t=true" >> "$GITHUB_OUTPUT"; else echo "$t=false" >> "$GITHUB_OUTPUT"; fi
          done
          # Report unknown names immediately.
          IFS=',' read -r -a list <<< "$targets"
          for t in "${list[@]}"; do
            [ -z "$t" ] && continue
            case "$t" in cloudflare|ssh|plesk) ;; *) echo "::error::Unknown target '$t' (allowed: cloudflare, ssh, plesk)"; exit 1 ;; esac
          done
          {
            echo "### Web-Deploy $TAG"
            if [ -z "$targets" ]; then
              echo "- No target selected (input targets and variable WEB_DEPLOY_TARGETS are empty): nothing deployed."
            else
              echo "- Targets: ${targets//,/, }"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  cloudflare:
    name: Cloudflare Pages
    needs: plan
    if: needs.plan.outputs.cloudflare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Gate Cloudflare
        id: gate
        uses: ./.github/actions/secret-gate
        with:
          label: Web-Deploy Cloudflare Pages (${{ inputs.tag }})
          checks: |
            CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
            CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
            CLOUDFLARE_PAGES_PROJECT=${{ vars.CLOUDFLARE_PAGES_PROJECT != '' }}

      - name: Validate project name
        if: steps.gate.outputs.ready == 'true'
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if ! [[ "$PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,56}$ ]]; then
            echo "::error::CLOUDFLARE_PAGES_PROJECT is not a valid Pages project name"
            exit 1
          fi

      - name: Fetch web build from the release
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/fetch-release
        with:
          tag: ${{ inputs.tag }}
          pattern: "*-web.zip"
          token: ${{ github.token }}

      - name: Unpack
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/web
          unzip -q dist/*-web.zip -d build/web
          test -f build/web/index.html
          # Pages ignores .htaccess; headers come from _headers. Every .htaccess
          # (including in subfolders) and every dotfile except .well-known is removed
          # before the upload so nothing hidden becomes public.
          find build/web -name '.htaccess' -type f -delete
          # Pages compresses on its own; the precompressed .gz/.br files of the
          # release bundle (for nginx gzip_static) are not uploaded.
          find build/web -type f \( -name '*.gz' -o -name '*.br' \) -delete
          find build/web -mindepth 1 -name '.*' -not -path '*/.well-known' -not -path '*/.well-known/*' -prune -exec rm -rf {} +
          if [ -n "$(find build/web -mindepth 1 -name '.*' -not -path '*/.well-known' -not -path '*/.well-known/*')" ]; then
            echo "Dotfiles in the upload folder" >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.165.0"
          command: pages deploy build/web --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: Summary
        if: steps.gate.outputs.ready == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "- Cloudflare Pages: $TAG deployed. Roll back in the dashboard (Deployments)." >> "$GITHUB_STEP_SUMMARY"

  ssh:
    name: SSH (nginx/Traefik)
    needs: plan
    if: needs.plan.outputs.ssh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Gate SSH deploy
        id: gate
        uses: ./.github/actions/secret-gate
        with:
          label: Web-Deploy SSH/rsync (${{ inputs.tag }})
          checks: |
            DEPLOY_HOST=${{ secrets.DEPLOY_HOST != '' }}
            DEPLOY_USER=${{ secrets.DEPLOY_USER != '' }}
            DEPLOY_SSH_KEY=${{ secrets.DEPLOY_SSH_KEY != '' }}
            DEPLOY_KNOWN_HOSTS=${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}
            DEPLOY_PATH=${{ vars.DEPLOY_PATH != '' }}

      - name: Fetch web build from the release
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/fetch-release
        with:
          tag: ${{ inputs.tag }}
          pattern: "*-web*.zip"
          token: ${{ github.token }}

      - name: Unpack
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/web build/hosting
          unzip -q dist/*-web.zip -d build/web
          test -f build/web/index.html
          if ls dist/*-web-hosting.zip >/dev/null 2>&1; then unzip -q dist/*-web-hosting.zip -d build/hosting; fi

      - name: Prepare SSH
        id: ssh
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          port: ${{ vars.DEPLOY_PORT || '22' }}

      - name: Deploy (release folder, symlink switch)
        if: steps.gate.outputs.ready == 'true'
        env:
          SSH_COMMAND: ${{ steps.ssh.outputs.ssh-command }}
          TARGET: ${{ steps.ssh.outputs.target }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELOAD_COMMAND: ${{ vars.DEPLOY_RELOAD_COMMAND }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "$DEPLOY_PATH" == *".."* ]]; then
            echo "::error::DEPLOY_PATH must be an absolute path of [A-Za-z0-9._/-] without '..'"
            exit 1
          fi
          base="${DEPLOY_PATH%/}"
          rel="${TAG#v}-${RUN_ID}"
          # Create the target folder, transfer files (header files kept separate for manual installation).
          $SSH_COMMAND "$TARGET" "mkdir -p '$base/releases/$rel' '$base/hosting'"
          rsync -a --delete -e "$SSH_COMMAND" build/web/ "$TARGET:$base/releases/$rel/"
          if [ -d build/hosting ] && [ -n "$(ls -A build/hosting)" ]; then
            rsync -a --delete -e "$SSH_COMMAND" build/hosting/ "$TARGET:$base/hosting/"
          fi
          # Switch atomically, keep only the last five releases.
          $SSH_COMMAND "$TARGET" "ln -sfn '$base/releases/$rel' '$base/current.new' && mv -Tf '$base/current.new' '$base/current' && cd '$base/releases' && ls -1t | tail -n +6 | xargs -r rm -rf --"
          if [ -n "$RELOAD_COMMAND" ]; then
            $SSH_COMMAND "$TARGET" "$RELOAD_COMMAND"
          fi
          {
            echo "- SSH: $TAG deployed to \`$base/releases/$rel\`, \`current\` switched."
            echo "- Rollback: point the \`current\` symlink at the previous folder in \`releases/\`."
            echo "- Changed header files are in \`$base/hosting/\` and must be copied to nginx if needed (docs/hosting-nginx.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH files
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

  plesk:
    name: Plesk (SSH)
    needs: plan
    if: needs.plan.outputs.plesk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Gate Plesk deploy
        id: gate
        uses: ./.github/actions/secret-gate
        with:
          label: Web-Deploy Plesk per SSH (${{ inputs.tag }})
          checks: |
            PLESK_SSH_HOST=${{ secrets.PLESK_SSH_HOST != '' }}
            PLESK_SSH_USER=${{ secrets.PLESK_SSH_USER != '' }}
            PLESK_SSH_KEY=${{ secrets.PLESK_SSH_KEY != '' }}
            PLESK_SSH_KNOWN_HOSTS=${{ secrets.PLESK_SSH_KNOWN_HOSTS != '' }}
            PLESK_DOCROOT=${{ vars.PLESK_DOCROOT != '' }}

      - name: Fetch web build from the release
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/fetch-release
        with:
          tag: ${{ inputs.tag }}
          pattern: "*-web.zip"
          token: ${{ github.token }}

      - name: Unpack
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mkdir -p build/web
          unzip -q dist/*-web.zip -d build/web
          test -f build/web/index.html

      - name: Prepare SSH
        id: ssh
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/ssh-setup
        with:
          host: ${{ secrets.PLESK_SSH_HOST }}
          user: ${{ secrets.PLESK_SSH_USER }}
          key: ${{ secrets.PLESK_SSH_KEY }}
          known-hosts: ${{ secrets.PLESK_SSH_KNOWN_HOSTS }}
          port: ${{ vars.PLESK_SSH_PORT || '22' }}

      - name: Sync document root
        if: steps.gate.outputs.ready == 'true'
        env:
          SSH_COMMAND: ${{ steps.ssh.outputs.ssh-command }}
          TARGET: ${{ steps.ssh.outputs.target }}
          DOCROOT: ${{ vars.PLESK_DOCROOT }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$DOCROOT" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$DOCROOT" == *".."* ]]; then
            echo "::error::PLESK_DOCROOT contains disallowed characters or '..'"
            exit 1
          fi
          # .well-known (assetlinks.json, AASA) and cgi-bin are left untouched.
          rsync -a --delete --exclude '.well-known/' --exclude 'cgi-bin/' \
            -e "$SSH_COMMAND" build/web/ "$TARGET:${DOCROOT%/}/"
          {
            echo "- Plesk: $TAG synced to \`${DOCROOT%/}/\` (\`.well-known/\` and \`cgi-bin/\` excluded)."
            echo "- Headers come from the \`.htaccess\` in the upload or from the nginx extra directives (docs/hosting-plesk.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH files
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [plan, cloudflare, ssh, plesk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
