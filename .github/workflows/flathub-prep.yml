name: Flathub preparation

# Fills the Flatpak manifest with the tarball URL and sha256 from the release and
# stores it as an artifact together with a submission template. Submits NOTHING to
# Flathub and creates no submission.
# Triggers: release.yml (final versions only) or manually with a tag.
# Needs no secrets. Prerequisite for Flathub: a public repository (the download URL
# must be reachable without signing in), see packaging/flathub/README.md.

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag (vX.Y.Z)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag of an existing release (format vX.Y.Z)
        type: string
        required: true

permissions: {}

concurrency:
  group: flathub-prep-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prep:
    name: Fill manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Fetch Linux tarball
        id: release
        uses: ./.github/actions/fetch-release
        with:
          tag: ${{ inputs.tag }}
          pattern: "*-linux-x64.tar.gz"
          token: ${{ github.token }}

      - name: Fill manifest
        env:
          LABEL: ${{ steps.release.outputs.label }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tarball="$(ls dist/*-linux-x64.tar.gz | head -n1)"
          name="$(basename "$tarball")"
          sha="$(sha256sum "$tarball" | cut -d' ' -f1)"
          url="https://github.com/${REPO}/releases/download/${TAG}/${name}"
          out="flathub/de.linefm.app.yml"
          mkdir -p flathub
          cp packaging/flathub/de.linefm.app.yml "$out"
          # Only replace the lines marked with "# release-tarball".
          sed -E -i "s|^([[:space:]]*url: ).*( # release-tarball)\$|\1${url}\2|" "$out"
          sed -E -i "s|^([[:space:]]*sha256: ).*( # release-tarball)\$|\1'${sha}'\2|" "$out"
          grep -qF "url: ${url} # release-tarball" "$out" || { echo "::error::URL line not replaced"; exit 1; }
          grep -qF "sha256: '${sha}' # release-tarball" "$out" || { echo "::error::sha256 line not replaced"; exit 1; }
          # The version comes only from the release: replace the placeholders vX.Y.Z and 0.0.0-dev.
          sed -E -i "s|/vX\.Y\.Z/(.*) # release-tag\$|/${TAG}/\1|" "$out"
          grep -q 'vX\.Y\.Z' "$out" && { echo "::error::Placeholder vX.Y.Z left in the manifest"; exit 1; }
          cp linux/de.linefm.app.metainfo.xml flathub/
          sed -i "s|<release version=\"0.0.0-dev\" date=\"[0-9-]*\">|<release version=\"${LABEL}\" date=\"$(date -u +%F)\">|" flathub/de.linefm.app.metainfo.xml
          grep -qF "<release version=\"${LABEL}\"" flathub/de.linefm.app.metainfo.xml || { echo "::error::Release version not set in metainfo"; exit 1; }
          {
            echo "# Submission template for flathub/flathub (version ${LABEL})"
            echo ""
            echo "Title: Add de.linefm.app"
            echo ""
            echo "- Manifest: de.linefm.app.yml (tarball ${name}, sha256 ${sha})"
            echo "- Source: ${url}"
            echo "- Check before submitting: packaging/flathub/README.md (proprietary license, binary tarball,"
            echo "  verified domain linefm.de, screenshots, OARS, public repository)."
            echo "- Submission by the owner only, branch new-pr against flathub/flathub."
          } > flathub/SUBMISSION_TEMPLATE.md
          {
            echo "### Flathub preparation"
            echo "- Version: ${LABEL}, sha256: \`${sha}\`"
            echo "- Artifact \`flathub-manifest-${LABEL}\` contains the manifest and the submission template. **Nothing was submitted.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flathub-manifest-${{ steps.release.outputs.label }}
          path: flathub/
          if-no-files-found: error
          retention-days: 30

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [prep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
