name: Windows integration test

# Integration test of the real app on Windows (integration_test/windows_app_test.dart):
# - Fast station switching with delayed laut.fm responses (network fakes),
# - Language de/en, rail width stays 104,
# - Custom title bar (maximize, double-click, minimize, close to tray, set size)
#   in the real window.
# Screenshots per step as the artifact "windows-itest-screens" (Flutter view and
# screen capture including the window frame). Cannot be tested: dragging, docking,
# snap layouts (real mouse input from the operating system).
# Only on change proposals and manually, no access to secrets.

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: itest-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-integration:
    name: Windows integration test
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (for smtc_windows)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Report screen resolution
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          "Screen: $($b.Width) x $($b.Height)"

      - name: Integration test
        shell: bash
        run: |
          set -euo pipefail
          out="$(cygpath -m "$GITHUB_WORKSPACE")/itest-screens"
          mkdir -p "$out"
          flutter test integration_test/windows_app_test.dart -d windows \
            --reporter=expanded --dart-define="ITEST_OUT=$out" 2>&1 | tee "$out/flutter-test.log"

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          out="itest-screens"
          {
            echo "### Windows integration test"
            if [ -d "$out" ]; then
              echo "Screenshots: $(ls "$out"/*.png 2>/dev/null | wc -l) (of which screen captures: $(ls "$out"/*-bildschirm.png 2>/dev/null | wc -l))"
              echo
              echo '```'
              # The German words match log lines printed by the Dart test.
              grep -E '^(Bilderordner|Titelleiste|[0-9:+ -]*(All tests passed|Some tests failed))|\[E\]|✓|✗' "$out/flutter-test.log" | tail -n 40 || true
              echo '```'
            else
              echo "No screenshot folder was created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-itest-screens
          path: itest-screens/
          retention-days: 14
          if-no-files-found: warn

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [windows-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
