name: Performance

# Reproduzierbare Performance-Messung (Issue #92). Nur messen und berichten:
# kein Schritt bricht wegen eines Messwerts ab (Budgets folgen spaeter).
#
# - web:      Wasm-Build wie ci.yml (web-smoke), ausgeliefert vom nginx-Container
#             aus deploy/traefik/Dockerfile (gzip und Cache-Header wie in
#             deploy/nginx/snippets). Lighthouse mobil und Desktop (je 5 Laeufe),
#             Playwright: Laden kalt/warm, Bedienung, Ton nach Klick
#             (wenige Einzelmessungen gegen die echten laut.fm-Streams).
# - windows:  Release-Build, Start bis erstes Bild, Speicher/CPU im Leerlauf,
#             Ton-Start per Deep Link, Paketgroesse (tool/perf/windows_start.ps1).
# - android:  APK (arm64, mit --analyze-size) und AAB, nur Groessen.
#             Kaltstart im Emulator ist eine Folgeaufgabe (docs/PERFORMANCE.md).
# - bericht:  Tabelle aus allen Ergebnissen in die Zusammenfassung des Laufs.
#
# Die Mess-Builds setzen --dart-define=LINEFM_PERF_MARKS=true
# (lib/core/perf/perf_marks.dart). Ohne den Schalter entfernt der Compiler die
# Messpunkte; Nutzer-Builds enthalten sie nicht.

on:
  pull_request:
    paths:
      - .github/workflows/performance.yml
      - tool/perf/**
      - lib/core/perf/**
  workflow_dispatch:
    inputs:
      runs:
        description: Laeufe je Kennzahl (mindestens 5)
        type: string
        default: "5"
  schedule:
    - cron: "37 2 * * 0"

permissions: {}

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNS: ${{ inputs.runs || '5' }}

jobs:
  web:
    name: Web (Lighthouse + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Flutter einrichten
        uses: ./.github/actions/setup-flutter

      - name: Konfiguration schreiben
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Web bauen (mit Messpunkten)
        run: >-
          flutter build web --release --wasm --no-web-resources-cdn
          --dart-define-from-file=config/app.json --dart-define=LINEFM_PERF_MARKS=true
          --base-href /

      - name: Ersatzschriften und Postbuild
        run: |
          # Ausserhalb des Pakets starten (nur dart:-Importe), wie in ci.yml.
          cp tool/fetch_font_fallback.dart tool/web_postbuild.dart "$RUNNER_TEMP/"
          dart run "$RUNNER_TEMP/fetch_font_fallback.dart" build/web --strict
          dart run "$RUNNER_TEMP/web_postbuild.dart" build/web

      - name: nginx-Container starten (deploy/traefik)
        run: |
          set -euo pipefail
          docker build -f deploy/traefik/Dockerfile -t linefm-perf-web .
          docker run -d --name linefm-perf-web --read-only --tmpfs /tmp -p 127.0.0.1:8080:8080 linefm-perf-web
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Header und Revalidierung pruefen
        run: |
          set -euo pipefail
          mkdir -p tool/perf/out
          base=http://127.0.0.1:8080
          wasm=$(cd build/web && ls main.*.dart.wasm | head -n1)
          mjs=$(cd build/web && ls main.*.dart.mjs | head -n1)
          skwasm=$(cd build/web && ls canvaskit/*/skwasm.wasm 2>/dev/null | head -n1 || true)
          {
            for path in / "/$wasm" "/$mjs" ${skwasm:+"/$skwasm"} /flutter_bootstrap.js /assets/FontManifest.json; do
              echo "### $path"
              curl -sS -o /dev/null -D - -H 'Accept-Encoding: gzip, br' "$base$path"
            done
            etag=$(curl -sSI "$base/" | tr -d '\r' | awk -F': ' 'tolower($1)=="etag"{print $2}')
            echo "### / mit If-None-Match: $etag"
            curl -sS -o /dev/null -D - -H "If-None-Match: $etag" "$base/"
          } > tool/perf/out/headers.txt
          status304=$(grep -A1 'If-None-Match' tool/perf/out/headers.txt | tail -n1 | awk '{print $2}')
          echo "Revalidierung von /: HTTP $status304 (erwartet 304)"
          echo "- Revalidierung von / mit ETag: HTTP $status304 (erwartet 304); Header-Dump im Artefakt (headers.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/perf/package-lock.json

      - name: Messwerkzeug installieren
        working-directory: tool/perf
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      - name: Groessen des Web-Builds
        working-directory: tool/perf
        run: node sizes.mjs --web ../../build/web --out out/sizes.json

      - name: Lighthouse (mobil und Desktop)
        working-directory: tool/perf
        timeout-minutes: 30
        run: node lighthouse.mjs --url http://127.0.0.1:8080/ --out out/lighthouse --runs "$RUNS"

      - name: Playwright (Laden, Bedienung, Ton)
        working-directory: tool/perf
        timeout-minutes: 35
        run: node web_perf.mjs --base http://127.0.0.1:8080 --out out --runs "$RUNS" --audio

      - name: Zusammenfassung (Web)
        if: ${{ always() }}
        working-directory: tool/perf
        run: |
          node summarize.mjs --in out --out out/perf-summary-web.md >/dev/null || true
          if [ -f out/perf-summary-web.md ]; then cat out/perf-summary-web.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: nginx-Protokoll
        if: ${{ always() }}
        run: docker logs linefm-perf-web > tool/perf/out/nginx.log 2>&1 || true

      - name: Ergebnisse hochladen
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-web-${{ github.sha }}
          path: tool/perf/out/
          retention-days: 30
          if-no-files-found: warn

  windows:
    name: Windows (Start, Speicher, CPU, Ton)
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust-Toolchain (fuer smtc_windows)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Flutter einrichten
        uses: ./.github/actions/setup-flutter

      - name: Konfiguration schreiben
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Windows bauen (Release, mit Messpunkten)
        shell: bash
        run: >-
          flutter build windows --release --dart-define-from-file=config/app.json
          --dart-define=LINEFM_PERF_MARKS=true

      - name: Messen
        shell: pwsh
        timeout-minutes: 25
        run: >-
          ./tool/perf/windows_start.ps1 -Exe build/windows/x64/runner/Release/linefm_radio.exe
          -OutDir tool/perf/out -Runs $env:RUNS -Audio

      - name: Ergebnisse hochladen
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-windows-${{ github.sha }}
          path: tool/perf/out/
          retention-days: 30
          if-no-files-found: warn

  android:
    name: Android (Groessen)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Wie build.yml: ohne Aufraeumen laeuft der Runner beim NDK-Download voll.
      - name: Plattenplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go /usr/local/julia* || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Flutter einrichten
        uses: ./.github/actions/setup-flutter

      - name: Konfiguration schreiben
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: APK arm64 mit Groessenanalyse
        run: >-
          flutter build apk --release --dart-define-from-file=config/app.json
          --target-platform android-arm64 --analyze-size --code-size-directory build/code-size

      - name: AAB
        run: flutter build appbundle --release --dart-define-from-file=config/app.json

      - name: Groessen festhalten
        run: |
          set -euo pipefail
          mkdir -p tool/perf/out
          apk=$(ls build/app/outputs/flutter-apk/app-release.apk)
          aab=build/app/outputs/bundle/release/app-release.aab
          cp build/code-size/*.json tool/perf/out/ 2>/dev/null || true
          jq -n --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson apk "$(stat -c %s "$apk")" --argjson aab "$(stat -c %s "$aab")" \
            '{tool: "performance.yml android", environment: {commit: $commit, runUrl: $run}, apkArm64Bytes: $apk, aabBytes: $aab}' \
            > tool/perf/out/android-sizes.json
          cat tool/perf/out/android-sizes.json

      - name: Ergebnisse hochladen
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-android-${{ github.sha }}
          path: tool/perf/out/
          retention-days: 30
          if-no-files-found: warn

  bericht:
    name: Bericht
    needs: [web, windows, android]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ergebnisse holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-*-${{ github.sha }}
          path: perf-in

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Tabelle erzeugen
        run: |
          node tool/perf/summarize.mjs --in perf-in --out perf-summary.md --json perf-summary.json >/dev/null
          cat perf-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Bericht hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-report-${{ github.sha }}
          path: |
            perf-summary.md
            perf-summary.json
          retention-days: 90
