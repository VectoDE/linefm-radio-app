name: Performance

# Reproducible performance measurement. Measuring never fails a run; the
# budget job does when a start time is over its limit
# (tool/perf/start_budget.json). Size budgets live in ci.yml and build.yml.
#
# - web:      Wasm build like ci.yml (web-smoke), served by the nginx container
#             from deploy/traefik/Dockerfile (gzip and cache headers as in
#             deploy/nginx/snippets). Lighthouse mobile and desktop (5 runs each),
#             Playwright: cold/warm load, interaction, audio after click
#             (a few single measurements against the real laut.fm streams).
#             Split: web-build builds once (web + nginx image), web-measure
#             measures in four parallel slices on separate runners (Lighthouse,
#             mobile load, mobile interaction, desktop with audio), each slice
#             serial; web merges the partial results into web-perf.json.
# - web-autoplay: start button and click-to-play in Chromium, Firefox, WebKit and
#             Edge (tool/perf/autoplay_browsers.mjs); a check that fails the run.
# - windows:  Release build, start to first frame, idle memory/CPU,
#             audio start via deep link, package size (tool/perf/windows_start.ps1).
# - android:  APK (arm64, with --analyze-size) and AAB, sizes only.
# - android-start: cold start in an x86_64 emulator (KVM): the build before the
#             performance work (input baseline-ref) and the build under test,
#             measured back to back on the same emulator (tool/perf/android_start.sh).
# - report:   Table of all results in the run summary.
# - budget:   Start-time budget gate (tool/perf/start_budget.py,
#             tool/perf/start_budget.json); fails when a start time is over its limit.
#
# The measurement builds set --dart-define=LINEFM_PERF_MARKS=true
# (lib/core/perf/perf_marks.dart). Without the flag the compiler strips the
# measurement points; user builds do not contain them.

on:
  pull_request:
    paths:
      - .github/workflows/performance.yml
      - tool/perf/**
      - lib/core/perf/**
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per metric (at least 5)
        type: string
        default: "5"
      baseline-ref:
        description: Commit of the state before the performance work (Android cold start baseline)
        type: string
        default: 7fe8bc8c0498b41ae8ed087aa648beb1b8c00f28
  schedule:
    - cron: "37 2 * * 0"

permissions: {}

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUNS: ${{ inputs.runs || '5' }}
  # State before the performance work (parent of the first optimization commit).
  BASELINE_REF: ${{ inputs.baseline-ref || '7fe8bc8c0498b41ae8ed087aa648beb1b8c00f28' }}

jobs:
  # Web is split so the slow parts run side by side: one build, then one
  # runner per measurement slice. Each slice runs serially on its own runner,
  # so slices never share CPU and the numbers match the former single job.
  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Build web (with measurement points)
        run: |
          set -euo pipefail
          mapfile -t web_defines < <(bash tool/web_define_passthrough.sh)
          flutter build web --release --wasm --no-web-resources-cdn \
            --dart-define-from-file=config/app.json --dart-define=LINEFM_PERF_MARKS=true \
            --base-href / "${web_defines[@]}"

      - name: Fallback fonts and postbuild
        run: |
          # Run outside the package (dart: imports only), as in ci.yml.
          cp tool/fetch_font_fallback.dart tool/web_postbuild.dart "$RUNNER_TEMP/"
          dart run "$RUNNER_TEMP/fetch_font_fallback.dart" build/web --strict
          dart run "$RUNNER_TEMP/web_postbuild.dart" build/web

      # One image for every slice, so all of them measure the same server.
      - name: Build nginx image (deploy/traefik)
        run: |
          set -euo pipefail
          docker build -f deploy/traefik/Dockerfile -t linefm-perf-web .
          mkdir -p perf-build
          docker save linefm-perf-web | gzip -1 > perf-build/image.tar.gz
          tar -czf perf-build/web.tar.gz build/web

      - name: Upload build for the measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webbuild-${{ github.sha }}
          path: perf-build/
          retention-days: 1
          if-no-files-found: error

  web-measure:
    name: Web measure (${{ matrix.slice }})
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        slice: [lighthouse, mobile-load, mobile-interaction, desktop]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webbuild-${{ github.sha }}
          path: perf-build

      - name: Start nginx container (deploy/traefik)
        run: |
          set -euo pipefail
          tar -xzf perf-build/web.tar.gz
          gunzip -c perf-build/image.tar.gz | docker load
          docker run -d --name linefm-perf-web --read-only --tmpfs /tmp -p 127.0.0.1:8080:8080 linefm-perf-web
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Check headers and revalidation
        if: ${{ matrix.slice == 'lighthouse' }}
        run: |
          set -euo pipefail
          mkdir -p tool/perf/out
          base=http://127.0.0.1:8080
          wasm=$(cd build/web && ls main.*.dart.wasm | head -n1)
          mjs=$(cd build/web && ls main.*.dart.mjs | head -n1)
          skwasm=$(cd build/web && ls canvaskit/*/skwasm.wasm 2>/dev/null | head -n1 || true)
          {
            for path in / "/$wasm" "/$mjs" ${skwasm:+"/$skwasm"} /flutter_bootstrap.js /assets/FontManifest.json; do
              echo "### $path"
              curl -sS -o /dev/null -D - -H 'Accept-Encoding: gzip, br' "$base$path"
            done
            etag=$(curl -sSI "$base/" | tr -d '\r' | awk -F': ' 'tolower($1)=="etag"{print $2}')
            echo "### / with If-None-Match: $etag"
            curl -sS -o /dev/null -D - -H "If-None-Match: $etag" "$base/"
          } > tool/perf/out/headers.txt
          status304=$(grep -A1 'If-None-Match' tool/perf/out/headers.txt | tail -n1 | awk '{print $2}')
          echo "Revalidation of /: HTTP $status304 (expected 304)"
          echo "- Revalidation of / with ETag: HTTP $status304 (expected 304); header dump in the artifact (headers.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/perf/package-lock.json

      # Browser download keyed on the lockfile, which pins the Playwright version.
      - name: Playwright browsers from cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tool/perf/package-lock.json') }}

      - name: Install measurement tooling
        working-directory: tool/perf
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          if [ "$PW_CACHE_HIT" = "true" ]; then
            npx --no-install playwright install-deps chromium
          else
            npx --no-install playwright install --with-deps chromium
          fi

      - name: Web build sizes
        if: ${{ matrix.slice == 'lighthouse' }}
        working-directory: tool/perf
        run: node sizes.mjs --web ../../build/web --out out/sizes.json

      - name: Lighthouse (mobile and desktop)
        if: ${{ matrix.slice == 'lighthouse' }}
        working-directory: tool/perf
        timeout-minutes: 30
        run: node lighthouse.mjs --url http://127.0.0.1:8080/ --out out/lighthouse --runs "$RUNS"

      # Before: the same build behind a stock nginx without any hosting config (no gzip, no cache
      # headers). The comparison with the project server above is the before/after evidence.
      - name: Lighthouse baseline (stock nginx)
        if: ${{ matrix.slice == 'lighthouse' }}
        working-directory: tool/perf
        timeout-minutes: 30
        run: |
          set -euo pipefail
          image=$(grep -m1 '^FROM ' ../../deploy/traefik/Dockerfile | awk '{print $2}')
          docker run -d --name linefm-perf-baseline -p 127.0.0.1:8081:8080             -v "$GITHUB_WORKSPACE/build/web:/usr/share/nginx/html:ro" "$image"
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8081/ && break
            sleep 1
          done
          node lighthouse.mjs --url http://127.0.0.1:8081/ --out out/lighthouse-baseline --runs "$RUNS"
          node hosting_compare.mjs --before out/lighthouse-baseline --after out/lighthouse --out out/hosting-compare.md >> "$GITHUB_STEP_SUMMARY"
          docker rm -f linefm-perf-baseline >/dev/null

      - name: Playwright (${{ matrix.slice }})
        if: ${{ matrix.slice != 'lighthouse' }}
        working-directory: tool/perf
        timeout-minutes: 30
        env:
          SLICE: ${{ matrix.slice }}
        run: |
          set -euo pipefail
          case "$SLICE" in
            mobile-load) opts=(--profiles mobile --phases load) ;;
            mobile-interaction) opts=(--profiles mobile --phases interaction) ;;
            desktop) opts=(--profiles desktop --phases "load,interaction,audio" --audio) ;;
            *) echo "unknown slice $SLICE" >&2; exit 1 ;;
          esac
          node web_perf.mjs --base http://127.0.0.1:8080 --out out --runs "$RUNS" --part "$SLICE" "${opts[@]}"

      - name: nginx log
        if: ${{ always() }}
        env:
          SLICE: ${{ matrix.slice }}
        run: |
          mkdir -p tool/perf/out
          docker logs linefm-perf-web > "tool/perf/out/nginx-$SLICE.log" 2>&1 || true

      - name: Upload partial result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webslice-${{ matrix.slice }}-${{ github.sha }}
          path: tool/perf/out/
          retention-days: 1
          if-no-files-found: warn

  web:
    name: Web (Lighthouse + Playwright)
    needs: web-measure
    if: ${{ always() && needs.web-measure.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch partial results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: webslice-*-${{ github.sha }}
          path: slices

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/perf/package-lock.json

      # web_perf.mjs imports playwright at load time; merging needs no browser.
      - name: Install measurement tooling
        working-directory: tool/perf
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Merge partial results
        run: |
          set -euo pipefail
          mkdir -p tool/perf/out
          # Lighthouse, sizes, headers and nginx logs keep their layout.
          for d in slices/*/; do cp -r "$d". tool/perf/out/; done
          find tool/perf/out -name web-perf-part.json -delete
          node tool/perf/web_perf.mjs --merge slices --out tool/perf/out

      - name: Summary (web)
        if: ${{ always() }}
        working-directory: tool/perf
        run: |
          node summarize.mjs --in out --out out/perf-summary-web.md >/dev/null || true
          if [ -f out/perf-summary-web.md ]; then cat out/perf-summary-web.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-web-${{ github.sha }}
          path: tool/perf/out/
          retention-days: 30
          if-no-files-found: warn

  # Autoplay in real browser engines: the app must stay silent, show its start
  # button and play only after a real click (tool/perf/autoplay_browsers.mjs).
  # Fails when an engine breaks that behaviour; it is a check, not a measurement.
  web-autoplay:
    name: Web autoplay (${{ matrix.browser }})
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, msedge]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webbuild-${{ github.sha }}
          path: perf-build

      - name: Start nginx container (deploy/traefik)
        run: |
          set -euo pipefail
          tar -xzf perf-build/web.tar.gz
          gunzip -c perf-build/image.tar.gz | docker load
          docker run -d --name linefm-perf-web --read-only --tmpfs /tmp -p 127.0.0.1:8080:8080 linefm-perf-web
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/perf/package-lock.json

      # Edge comes with the runner image; the other engines are Playwright builds.
      - name: Install browser
        working-directory: tool/perf
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          if [ "$BROWSER" = msedge ]; then
            npx --no-install playwright install-deps chromium
          else
            npx --no-install playwright install --with-deps "$BROWSER"
          fi

      # HTTPS in front of the container, as Traefik does in production, so the
      # security headers reach every engine unmodified. Throwaway self-signed
      # certificate: created in RUNNER_TEMP, valid one day, never uploaded.
      - name: Start HTTPS front (self-signed, loopback only)
        working-directory: tool/perf
        run: |
          set -euo pipefail
          tls_dir="$RUNNER_TEMP/autoplay-tls"
          mkdir -p "$tls_dir"
          chmod 700 "$tls_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -sha256             -keyout "$tls_dir/key.pem" -out "$tls_dir/cert.pem"             -subj "/CN=127.0.0.1"             -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" 2>/dev/null
          chmod 600 "$tls_dir/key.pem"
          nohup node tls_proxy.mjs --cert "$tls_dir/cert.pem" --key "$tls_dir/key.pem"             --listen 8443 --upstream 8080 > "$RUNNER_TEMP/tls_proxy.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS --cacert "$tls_dir/cert.pem" https://127.0.0.1:8443/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS --cacert "$tls_dir/cert.pem" https://127.0.0.1:8443/healthz
          curl -fsSI --cacert "$tls_dir/cert.pem" https://127.0.0.1:8443/ | grep -i '^content-security-policy:.*upgrade-insecure-requests'

      - name: Autoplay check
        working-directory: tool/perf
        env:
          BROWSER: ${{ matrix.browser }}
        run: node autoplay_browsers.mjs --base https://127.0.0.1:8443 --out out/autoplay-"$BROWSER" --browsers "$BROWSER"

      - name: Remove TLS key
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/autoplay-tls"

      - name: Upload result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autoplay-${{ matrix.browser }}-${{ github.sha }}
          path: tool/perf/out/
          retention-days: 14
          if-no-files-found: warn

  windows:
    name: Windows (start, memory, CPU, audio)
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (for smtc_windows)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Build Windows (release, with measurement points)
        shell: bash
        run: >-
          flutter build windows --release --dart-define-from-file=config/app.json
          --dart-define=LINEFM_PERF_MARKS=true

      - name: Measure
        shell: pwsh
        timeout-minutes: 25
        run: >-
          ./tool/perf/windows_start.ps1 -Exe build/windows/x64/runner/Release/linefm_radio.exe
          -OutDir tool/perf/out -Runs $env:RUNS -Audio

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-windows-${{ github.sha }}
          path: tool/perf/out/
          retention-days: 30
          if-no-files-found: warn

  android:
    name: Android (sizes)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in build.yml: without cleanup the runner runs out of disk during the NDK download.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go /usr/local/julia* || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # Gradle User Home cache (wrapper, dependencies, transforms). Written on
      # main only, read-only elsewhere.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: never
          cache-provider: basic

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: APK arm64 with size analysis
        run: >-
          flutter build apk --release --dart-define-from-file=config/app.json
          --target-platform android-arm64 --analyze-size --code-size-directory build/code-size

      - name: AAB
        run: flutter build appbundle --release --dart-define-from-file=config/app.json

      - name: Record sizes
        run: |
          set -euo pipefail
          mkdir -p tool/perf/out
          apk=$(ls build/app/outputs/flutter-apk/app-release.apk)
          aab=build/app/outputs/bundle/release/app-release.aab
          cp build/code-size/*.json tool/perf/out/ 2>/dev/null || true
          jq -n --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson apk "$(stat -c %s "$apk")" --argjson aab "$(stat -c %s "$aab")" \
            '{tool: "performance.yml android", environment: {commit: $commit, runUrl: $run}, apkArm64Bytes: $apk, aabBytes: $aab}' \
            > tool/perf/out/android-sizes.json
          cat tool/perf/out/android-sizes.json

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-android-${{ github.sha }}
          path: tool/perf/out/
          retention-days: 30
          if-no-files-found: warn

  android-start:
    name: Android (cold start, emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/go /usr/local/julia* || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          add-job-summary: never
          cache-provider: basic

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      # Same build flags for both APKs; x86_64 because the emulator runs with KVM.
      - name: Build APK under test (with measurement points)
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-x64 \
            --dart-define-from-file=config/app.json --dart-define=LINEFM_PERF_MARKS=true
          mkdir -p perf-apk
          cp build/app/outputs/flutter-apk/app-release.apk perf-apk/current.apk

      # The baseline tree gets today's config and today's measurement hook
      # (Android marks go to logcat), nothing else from the new state.
      - name: Build baseline APK
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/baseline" "$BASELINE_REF"
          cp config/app.json "$RUNNER_TEMP/baseline/config/app.json"
          cp lib/core/perf/perf_marks_io.dart "$RUNNER_TEMP/baseline/lib/core/perf/perf_marks_io.dart"
          cd "$RUNNER_TEMP/baseline"
          flutter pub get
          flutter build apk --release --target-platform android-x64 \
            --dart-define-from-file=config/app.json --dart-define=LINEFM_PERF_MARKS=true
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/perf-apk/baseline.apk"

      # Release builds without android/key.properties are unsigned, and the
      # emulator refuses to install them (INSTALL_PARSE_FAILED_NO_CERTIFICATES).
      # Both APKs get signed afterwards with a throwaway key made in this job.
      # Signing does not change the compiled code, so the timings stay those of
      # the release build. The key never leaves the runner.
      - name: Sign APKs with a throwaway key
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          test -x "$apksigner"
          openssl rand -hex 16 > "$RUNNER_TEMP/perf-key.pass"
          keytool -genkeypair -keystore "$RUNNER_TEMP/perf.keystore" -storetype PKCS12             -alias perf -keyalg RSA -keysize 2048 -validity 3 -dname "CN=perf"             -storepass:file "$RUNNER_TEMP/perf-key.pass"
          for apk in perf-apk/baseline.apk perf-apk/current.apk; do
            "$apksigner" sign --ks "$RUNNER_TEMP/perf.keystore" --ks-key-alias perf               --ks-pass "file:$RUNNER_TEMP/perf-key.pass" "$apk"
            "$apksigner" verify "$apk"
          done

      - name: Boot emulator
        timeout-minutes: 20
        run: bash tool/perf/android_emulator.sh tool/perf/out

      - name: Measure cold start (baseline, then current)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          BUILD_REF="$BASELINE_REF" bash tool/perf/android_start.sh --apk perf-apk/baseline.apk \
            --label baseline --runs "$RUNS" --out tool/perf/out/android-start-baseline.json
          BUILD_REF="$GITHUB_SHA" bash tool/perf/android_start.sh --apk perf-apk/current.apk \
            --label current --runs "$RUNS" --out tool/perf/out/android-start-current.json

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-android-start-${{ github.sha }}
          path: tool/perf/out/
          retention-days: 30
          if-no-files-found: warn

  report:
    name: Report
    needs: [web, windows, android, android-start]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-*-${{ github.sha }}
          path: perf-in

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Generate table
        run: |
          node tool/perf/summarize.mjs --in perf-in --out perf-summary.md --json perf-summary.json >/dev/null
          cat perf-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-report-${{ github.sha }}
          path: |
            perf-summary.md
            perf-summary.json
          retention-days: 90

  budget:
    name: Start-time budget
    needs: [web, windows, android-start]
    if: ${{ always() && needs.web.result == 'success' && needs.windows.result == 'success' && needs.android-start.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-*-${{ github.sha }}
          path: perf-in

      - name: Check start times against the budget
        run: python3 -I tool/perf/start_budget.py perf-in

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [web-build, web-measure, web, web-autoplay, windows, android, android-start, report, budget]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
