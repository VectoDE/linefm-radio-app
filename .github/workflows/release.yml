name: Release

# Ausloeser: Tag vX.Y.Z oder vX.Y.Z-rc.N (der Trigger nimmt jedes v*.*.*, der Job
# "version" laesst aber nur diese beiden Formen zu; rc-Tags werden Vorabversionen).
# Baut alle Plattformen ueber build.yml. Der Job "sign" erzeugt SHA256SUMS.txt und
# eine SBOM (SPDX), legt GitHub-Attestierungen (Build-Provenance, SBOM) an und
# signiert jede Release-Datei plus SHA256SUMS.txt keyless mit cosign (Sigstore,
# Bundles *.sigstore.json). "publish" signiert SHA256SUMS.txt optional mit GPG
# (Secrets GPG_PRIVATE_KEY, GPG_PASSPHRASE; ohne sie uebersprungen) und legt das
# GitHub-Release an. Android (APK/AAB), Windows (EXE) und macOS (DMG) tragen ihre
# Plattform-Signatur nur mit gesetzten Signier-Secrets. Pruefen: docs/RELEASE-VERIFIZIEREN.md.
# Danach starten die Store-Workflows; Google Play und Snap auch fuer rc-Tags, alle
# anderen nur fuer Endversionen.

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag und pubspec-Version pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag und pubspec-Version vergleichen
        uses: ./.github/actions/tag-version
        with:
          tag: ${{ github.ref_name }}

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
      apple: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
      APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
    permissions:
      contents: read

  # Signieren (P31): nur dieser Job bekommt id-token: write (OIDC fuer Sigstore).
  # Er erzeugt SBOM und SHA256SUMS.txt, attestiert die Herkunft (GitHub-Attestierung,
  # Sigstore) und signiert jede Release-Datei plus SHA256SUMS.txt keyless mit cosign.
  # Die Bundles (*.sigstore.json) gehen als Artefakt an "publish" und landen als
  # Release-Assets am Release. Pruefen: docs/RELEASE-VERIFIZIEREN.md.
  sign:
    name: Pruefsummen, Attestierung und Signatur
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version pruefen
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG ist keine SemVer-Version"
            exit 1
          fi
          echo "LABEL=${TAG#v}" >> "$GITHUB_ENV"
          mkdir -p dist

      # Vor "Artefakte holen": die SBOM beschreibt die Quellen, nicht die
      # fertigen Release-Dateien in dist/.
      - name: SBOM erzeugen (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/linefm-radio-${{ env.LABEL }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Artefakte holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Pruefsummen
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt ./*.sigstore.json ./*.asc
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Release-Dateien"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Das Repository ist oeffentlich: Attestierungen sind Pflicht, ein Fehler bricht
      # das Release ab. Nur ein privates Repository ohne Enterprise Cloud kann keine
      # Attestierung anlegen; dort werden die Schritte uebersprungen (Zusammenfassung).
      - name: Build-Provenance attestieren
        id: provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: SBOM attestieren
        id: sbom
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS.txt
          sbom-path: dist/linefm-radio-${{ env.LABEL }}-sbom.spdx.json

      - name: cosign installieren
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Dateien mit cosign signieren (keyless)
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null
          done

      - name: cosign-Signaturen gegenpruefen
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cd dist
          count=0
          for b in *.sigstore.json; do
            cosign verify-blob --bundle "$b" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${b%.sigstore.json}" > /dev/null
            count=$((count + 1))
          done
          echo "COSIGN_COUNT=$count" >> "$GITHUB_ENV"

      - name: Signatur-Status
        env:
          PROVENANCE: ${{ steps.provenance.outcome }}
          SBOM: ${{ steps.sbom.outcome }}
        run: |
          {
            echo "### Attestierungen und Signaturen"
            echo "- Build-Provenance (GitHub-Attestierung): $PROVENANCE"
            echo "- SBOM-Attestierung: $SBOM"
            echo "- cosign keyless: $COSIGN_COUNT Dateien signiert und gegengeprueft (*.sigstore.json)"
            if [ "$PROVENANCE" = "skipped" ]; then
              echo ""
              echo "Hinweis: privates Repository, Attestierungen nur mit GitHub Enterprise Cloud."
            fi
            echo ""
            echo "Pruefen: docs/RELEASE-VERIFIZIEREN.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Signierte Dateien weitergeben
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Release veroeffentlichen
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version pruefen
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG ist keine SemVer-Version"
            exit 1
          fi
          echo "LABEL=${TAG#v}" >> "$GITHUB_ENV"

      - name: Signierte Dateien holen
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: dist

      - name: Gate GPG-Signatur
        id: gpg
        uses: ./.github/actions/secret-gate
        with:
          label: GPG-Signatur (SHA256SUMS.txt.asc)
          checks: |
            GPG_PRIVATE_KEY=${{ secrets.GPG_PRIVATE_KEY != '' }}
            GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE != '' }}

      # Optional: detached ASCII-Signatur der Pruefsummen mit dem Schluessel des
      # Betreibers. Der Schluessel lebt nur in einem temporaeren GNUPGHOME.
      - name: SHA256SUMS.txt mit GPG signieren
        if: steps.gpg.outputs.ready == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/gnupg.XXXXXX")"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill all || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/pass"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$GNUPGHOME/pass" \
            --armor --detach-sign --output dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
          gpg --batch --verify dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
          fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "- GPG: SHA256SUMS.txt.asc, Schluessel $fpr" >> "$GITHUB_STEP_SUMMARY"

      - name: Release-Notizen aus CHANGELOG.md
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$LABEL" '
              /^## / { if (found) exit; if (index($0, "[" ver "]") || index($0, " " ver)) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            echo "LINEFM Radio $LABEL" > "$notes"
            echo "" >> "$notes"
            echo "Kein Abschnitt fuer $LABEL in CHANGELOG.md gefunden." >> "$notes"
          fi
          {
            echo ""
            echo "### Pruefen der Downloads"
            echo ""
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo "gh attestation verify <datei> -R ${GITHUB_REPOSITORY}"
            echo "cosign verify-blob --bundle <datei>.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com <datei>"
            echo '```'
            echo ""
            echo "Alle Wege (auch GPG, SBOM, Plattform-Signaturen): docs/RELEASE-VERIFIZIEREN.md im Repository."
          } >> "$notes"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "LINEFM Radio $LABEL" \
            --notes-file "$NOTES_FILE" \
            --verify-tag \
            "${flags[@]}"

  # Store- und Deploy-Pipelines (P27). Jede ruft nur das auf, wofuer Secrets/Variablen
  # gesetzt sind; sonst wird sauber uebersprungen. Die Release-Dateien stammen aus dem
  # eben angelegten GitHub-Release.
  google-play:
    name: Google Play
    needs: publish
    uses: ./.github/workflows/store-google.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
    permissions:
      contents: read

  snap-store:
    name: Snap Store
    needs: publish
    uses: ./.github/workflows/store-snap.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    permissions:
      contents: read

  microsoft-store:
    name: Microsoft Store
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/store-microsoft.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
      MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
      MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
      MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
      FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
    permissions:
      contents: read

  flathub-prep:
    name: Flathub-Vorbereitung
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/flathub-prep.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

  apple-stores:
    name: Apple (TestFlight, Mac App Store)
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/store-apple.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
      APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      APPLE_MAC_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_MAC_INSTALLER_CERT_P12_BASE64 }}
      APPLE_MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_MAC_INSTALLER_CERT_PASSWORD }}
      APPLE_IOS_PROVISIONING_PROFILES_BASE64: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILES_BASE64 }}
      APPLE_MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MACOS_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
    permissions:
      contents: read

  deploy-web:
    name: Web-Deploy
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/deploy-web.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PLESK_SSH_HOST: ${{ secrets.PLESK_SSH_HOST }}
      PLESK_SSH_USER: ${{ secrets.PLESK_SSH_USER }}
      PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
      PLESK_SSH_KNOWN_HOSTS: ${{ secrets.PLESK_SSH_KNOWN_HOSTS }}
    permissions:
      contents: read
