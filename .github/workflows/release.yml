name: Release

# Every merge to main creates a release. The "version" job computes the version
# from the highest existing release tag and the open tickets
# (tool/release/next_version.dart, logic in lib/core/update/app_version.dart):
# starts at 0.1.0-alpha.1, every merge increments the prerelease number; beta once no
# ticket with typ:feature is open any more; rc (1.0.0-rc.N) once only tickets with
# nur-noch:linefm-studios are open; 1.0.0 when nothing is open. The version is not # english-ci: allow
# hard-coded anywhere; pubspec.yaml carries only the placeholder 0.0.0-dev.
# Builds all platforms via build.yml. The "sign" job creates SHA256SUMS.txt and
# an SBOM (SPDX and CycloneDX, syft), creates GitHub attestations (build provenance,
# SBOM) and signs every release file plus SHA256SUMS.txt keyless with cosign
# (Sigstore, bundles *.sigstore.json). "publish" optionally signs SHA256SUMS.txt with
# GPG (secrets GPG_PRIVATE_KEY, GPG_PASSPHRASE; skipped without them), writes the
# release notes from the commit titles of the changes and creates the GitHub release
# with its tag on the merged commit. Android (APK/AAB), Windows (EXE) and macOS (DMG)
# carry their platform signature only when the signing secrets are set.
# Verify: docs/RELEASE-VERIFIZIEREN.md.
# After that the store workflows and the web deploy start, all only from 1.0.0 (no
# prerelease). alpha, beta and rc go out only as a GitHub prerelease.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# Releases run one after another: each needs the tag of the previous one.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    # Releases only from main, also on manual start.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      skip: ${{ steps.calc.outputs.skip }}
      tag: ${{ steps.calc.outputs.tag }}
      version: ${{ steps.calc.outputs.version }}
      stage: ${{ steps.calc.outputs.stage }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
      last: ${{ steps.calc.outputs.last }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # Only the Dart SDK; the app's dependencies (with native build hooks)
      # are not fetched for the version computation.
      - name: Set up Flutter (without pub get)
        uses: ./.github/actions/setup-flutter
        with:
          cache: "false"
          pub-get: "false"

      - name: Prepare version calculator
        run: dart pub get --directory tool/release

      - name: Compute version
        id: calc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/version"
          mkdir -p "$dir"
          # Already a release on this commit (re-run): do nothing.
          existing="$(git tag --points-at HEAD --list 'v*' | head -n1)"
          if [ -n "$existing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit already has release $existing, skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag --list 'v*' > "$dir/tags.txt"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000             --json labels > "$dir/items.json"
          (cd tool/release && dart run next_version.dart --tags "$dir/tags.txt"             --items "$dir/items.json") > "$dir/pre.txt"
          last="$(sed -n 's/^last=//p' "$dir/pre.txt")"
          if [ -n "$last" ]; then
            git log --format=%s "$last..HEAD" > "$dir/subjects.txt"
          else
            git log -1 --format=%s > "$dir/subjects.txt"
          fi
          (cd tool/release && dart run next_version.dart --tags "$dir/tags.txt"             --items "$dir/items.json" --subjects "$dir/subjects.txt") > "$dir/out.txt"
          cat "$dir/out.txt"
          { echo "skip=false"; cat "$dir/out.txt"; } >> "$GITHUB_OUTPUT"
          cp "$dir/subjects.txt" subjects.txt
          {
            echo "### Release $(sed -n 's/^tag=//p' "$dir/out.txt")"
            echo "- Stage: $(sed -n 's/^stage=//p' "$dir/out.txt"), previous: ${last:-none}"
            echo "- open tickets: $(jq length "$dir/items.json")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check tag and pubspec placeholder
        if: steps.calc.outputs.skip != 'true'
        uses: ./.github/actions/tag-version
        with:
          tag: ${{ steps.calc.outputs.tag }}

      - name: Pass on commit titles
        if: steps.calc.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-subjects
          path: subjects.txt
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.tag }}
      apple: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
      APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
    permissions:
      contents: read
      # The build log gate in build.yml reads the job logs and annotations of this run.
      actions: read
      checks: read

  # Signing: only this job gets id-token: write (OIDC for Sigstore).
  # It creates the SBOM and SHA256SUMS.txt, attests the provenance (GitHub attestation,
  # Sigstore) and signs every release file plus SHA256SUMS.txt keyless with cosign.
  # The bundles (*.sigstore.json) go to "publish" as an artifact and end up as
  # release assets on the release. Verify: docs/RELEASE-VERIFIZIEREN.md.
  sign:
    name: Checksums, attestation and signature
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a SemVer version"
            exit 1
          fi
          echo "LABEL=${TAG#v}" >> "$GITHUB_ENV"
          mkdir -p dist

      # Before "Fetch artifacts": the SBOM describes the sources, not the
      # finished release files in dist/.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/linefm-radio-${{ env.LABEL }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/linefm-radio-${{ env.LABEL }}-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      # Publisher LineFM Studios, manufacturer Tim Hauke (VectoDE), decision
      # of the owner of 21 Nov 2026; enter into both SBOMs.
      - name: Set SBOM supplier and manufacturer
        run: |
          set -euo pipefail
          cdx="dist/linefm-radio-${LABEL}-sbom.cdx.json"
          spdx="dist/linefm-radio-${LABEL}-sbom.spdx.json"
          jq '.metadata.supplier = {"name": "LineFM Studios"}
              | .metadata.manufacturer = {"name": "Tim Hauke (VectoDE)", "url": ["https://github.com/VectoDE"]}
              | .metadata.authors = [{"name": "Tim Hauke (VectoDE)"}]' "$cdx" > "$cdx.tmp"
          mv "$cdx.tmp" "$cdx"
          jq '.creationInfo.creators += ["Organization: LineFM Studios", "Person: Tim Hauke (VectoDE)"]' "$spdx" > "$spdx.tmp"
          mv "$spdx.tmp" "$spdx"

      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # The installer with its own setup UI exists for every desktop OS
      # and is part of every release (checksum, cosign bundle, provenance
      # follow in the next steps like for every other file).
      - name: Check the desktop installers
        run: |
          set -euo pipefail
          missing=0
          for f in "linefm-radio-${LABEL}-windows-x64-setup.exe" \
                   "linefm-radio-${LABEL}-macos-setup.dmg" \
                   "linefm-radio-${LABEL}-linux-x64-setup.AppImage"; do
            if [ -s "dist/$f" ]; then echo "found: $f"; else echo "::error::installer missing: $f"; missing=1; fi
          done
          exit "$missing"

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS.txt ./*.sigstore.json ./*.asc
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "### Release files"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The repository is public: attestations are mandatory, a failure aborts
      # the release. Only a private repository without Enterprise Cloud cannot create an
      # attestation; there the steps are skipped (summary).
      - name: Attest build provenance
        id: provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Attest SBOM
        id: sbom
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt
          sbom-path: dist/linefm-radio-${{ env.LABEL }}-sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign files with cosign (keyless)
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null
          done

      - name: Verify cosign signatures
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cd dist
          count=0
          for b in *.sigstore.json; do
            cosign verify-blob --bundle "$b" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${b%.sigstore.json}" > /dev/null
            count=$((count + 1))
          done
          echo "COSIGN_COUNT=$count" >> "$GITHUB_ENV"

      - name: Signature status
        env:
          PROVENANCE: ${{ steps.provenance.outcome }}
          SBOM: ${{ steps.sbom.outcome }}
        run: |
          {
            echo "### Attestations and signatures"
            echo "- Build provenance (GitHub attestation): $PROVENANCE"
            echo "- SBOM attestation: $SBOM"
            echo "- cosign keyless: $COSIGN_COUNT files signed and verified (*.sigstore.json)"
            if [ "$PROVENANCE" = "skipped" ]; then
              echo ""
              echo "Note: private repository, attestations only with GitHub Enterprise Cloud."
            fi
            echo ""
            echo "Verify: docs/RELEASE-VERIFIZIEREN.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pass on signed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a SemVer version"
            exit 1
          fi
          echo "LABEL=${TAG#v}" >> "$GITHUB_ENV"

      - name: Fetch signed files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: dist

      - name: Gate GPG signature
        id: gpg
        uses: ./.github/actions/secret-gate
        with:
          label: GPG signature (SHA256SUMS.txt.asc)
          checks: |
            GPG_PRIVATE_KEY=${{ secrets.GPG_PRIVATE_KEY != '' }}
            GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE != '' }}

      # Optional: detached ASCII signature of the checksums with the operator's key.
      # The key lives only in a temporary GNUPGHOME.
      - name: Sign SHA256SUMS.txt with GPG
        if: steps.gpg.outputs.ready == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/gnupg.XXXXXX")"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill all || true; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/pass"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$GNUPGHOME/pass" \
            --armor --detach-sign --output dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
          gpg --batch --verify dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
          fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')"
          echo "- GPG: SHA256SUMS.txt.asc, key $fpr" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch commit titles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-subjects
          path: ${{ runner.temp }}/subjects

      # English release notes from the commit titles of the changes since the last
      # release. Appended numbers from squash merges and references to tickets
      # or change proposals are removed: release notes only describe.
      - name: Write release notes
        env:
          STAGE: ${{ needs.version.outputs.stage }}
          LAST: ${{ needs.version.outputs.last }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          case "$STAGE" in
            alpha) stufe="Alpha prerelease: early state, features are still missing." ;;
            beta) stufe="Beta prerelease: all features are in, testing is still ongoing." ;;
            rc) stufe="Release candidate: only the operator's approval is still open." ;;
            *) stufe="Stable version." ;;
          esac
          {
            echo "LINEFM Radio $LABEL. $stufe"
            echo ""
            echo "Publisher: LineFM Studios. Manufacturer: Tim Hauke (VectoDE)."
            echo ""
            echo "### Changes"
            echo ""
            grep -v '^[[:space:]]*$' "$RUNNER_TEMP/subjects/subjects.txt"               | sed -E 's/[[:space:]]*\(([[:alpha:]]+ )?#[0-9]+\)//Ig; s/[[:space:]]*(refs|fixes|closes|resolves)[[:space:]]+#[0-9]+//Ig'               | sed 's/^/- /'
            echo ""
            if [ -n "$LAST" ]; then
              echo "All changes: https://github.com/${GITHUB_REPOSITORY}/compare/${LAST}...${TAG}"
              echo ""
            fi
            echo "### Install and update"
            echo ""
            echo "- Android, Linux, macOS and web: files below. The Windows installer follows later."
            echo "- Prereleases are meant for testers and do not appear in the stores."
            echo ""
            echo "### Verifying the downloads"
            echo ""
            echo '```'
            echo "sha256sum -c SHA256SUMS.txt --ignore-missing"
            echo "gh attestation verify <datei> -R ${GITHUB_REPOSITORY}"
            echo "cosign verify-blob --bundle <datei>.sigstore.json \\"
            echo "  --certificate-identity 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com <datei>"
            echo '```'
            echo ""
            echo "SBOM: *-sbom.spdx.json and *-sbom.cdx.json. All verification methods: docs/RELEASE-VERIFIZIEREN.md in the repository."
          } > "$notes"
          echo "NOTES_FILE=$notes" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" dist/*             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "LINEFM Radio $LABEL"             --notes-file "$NOTES_FILE"             "${flags[@]}"

  # Store and deploy pipelines. Each one only runs what its secrets/variables are
  # set for; otherwise it is skipped cleanly. The release files come from the
  # GitHub release just created.
  google-play:
    name: Google Play
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    uses: ./.github/workflows/store-google.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
    permissions:
      contents: read
      # The log gate of the called workflow reads job logs and annotations.
      actions: read
      checks: read

  snap-store:
    name: Snap Store
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    uses: ./.github/workflows/store-snap.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    permissions:
      contents: read
      # The log gate of the called workflow reads job logs and annotations.
      actions: read
      checks: read

  microsoft-store:
    name: Microsoft Store
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    uses: ./.github/workflows/store-microsoft.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
      MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
      MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
      MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
      FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
    permissions:
      contents: read
      # The log gate of the called workflow reads job logs and annotations.
      actions: read
      checks: read

  flathub-prep:
    name: Flathub preparation
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    uses: ./.github/workflows/flathub-prep.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: read
      # The log gate of the called workflow reads job logs and annotations.
      actions: read
      checks: read

  apple-stores:
    name: Apple (TestFlight, Mac App Store)
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    uses: ./.github/workflows/store-apple.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
      APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
      APPLE_MAC_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_MAC_INSTALLER_CERT_P12_BASE64 }}
      APPLE_MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_MAC_INSTALLER_CERT_PASSWORD }}
      APPLE_IOS_PROVISIONING_PROFILES_BASE64: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILES_BASE64 }}
      APPLE_MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_MACOS_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
    permissions:
      contents: read
      # The log gate of the called workflow reads job logs and annotations.
      actions: read
      checks: read

  deploy-web:
    name: Web deploy
    needs: [version, publish]
    if: needs.version.outputs.prerelease == 'false'
    uses: ./.github/workflows/deploy-web.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PLESK_SSH_HOST: ${{ secrets.PLESK_SSH_HOST }}
      PLESK_SSH_USER: ${{ secrets.PLESK_SSH_USER }}
      PLESK_SSH_KEY: ${{ secrets.PLESK_SSH_KEY }}
      PLESK_SSH_KNOWN_HOSTS: ${{ secrets.PLESK_SSH_KNOWN_HOSTS }}
    permissions:
      contents: read
      # The log gate of the called workflow reads job logs and annotations.
      actions: read
      checks: read

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [version, build, sign, publish, google-play, snap-store, microsoft-store, flathub-prep, apple-stores, deploy-web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
