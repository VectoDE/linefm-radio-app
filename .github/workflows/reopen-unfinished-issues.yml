name: Reopen unfinished tickets

# House rule F470: An ticket is only closed once all tasks (checkboxes) and
# sub-tickets are done. If it is closed with open "- [ ]" tasks or open sub-tickets,
# this workflow reopens it immediately and explains why in a comment.
# Checkboxes inside code blocks (``` or ~~~) do not count.

on:
  issues:
    types: [closed]

permissions: {}

concurrency:
  group: reopen-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reopen:
    name: Check for open tasks
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check and reopen if needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Read the current state via the API (not from the event, in case it was edited since).
          issue_json="$(gh api "repos/$REPO/issues/$NUMBER")"
          state="$(jq -r '.state' <<< "$issue_json")"
          if [ "$state" != "closed" ]; then
            echo "Ticket #$NUMBER is no longer closed, nothing to do."
            exit 0
          fi

          # Collect open checkboxes outside of code blocks.
          jq -r '.body // ""' <<< "$issue_json" | tr -d '\r' | awk '
            /^[[:space:]]*(```|~~~)/ { fence = !fence; next }
            fence { next }
            /^[[:space:]]*([-*+]|[0-9]+[.)])[[:space:]]+\[ \][[:space:]]/ {
              line = $0
              sub(/^[[:space:]]*([-*+]|[0-9]+[.)])[[:space:]]+\[ \][[:space:]]*/, "", line)
              if (length(line) > 160) line = substr(line, 1, 157) "..."
              # Defuse @ (zero-width space): the bot comment must not mention anyone
              # and must not trigger a team notification (N3-Sec).
              gsub(/@/, "@\342\200\213", line)
              print line
            }
          ' > open_tasks.txt
          open_tasks=$(grep -c . open_tasks.txt || true)

          sub_total="$(jq -r '.sub_issues_summary.total // 0' <<< "$issue_json")"
          sub_done="$(jq -r '.sub_issues_summary.completed // 0' <<< "$issue_json")"
          open_subs=$(( sub_total - sub_done ))

          echo "Open tasks: $open_tasks, open sub-tickets: $open_subs"
          if [ "$open_tasks" -eq 0 ] && [ "$open_subs" -le 0 ]; then
            echo "All tasks done, ticket stays closed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "Reopened automatically: this ticket was closed although not everything is done."
            echo ""
            if [ "$open_tasks" -gt 0 ]; then
              echo "**Open tasks ($open_tasks):**"
              echo ""
              head -n 25 open_tasks.txt | sed 's/^/- /'
              if [ "$open_tasks" -gt 25 ]; then echo "- … and $((open_tasks - 25)) more"; fi
              echo ""
            fi
            if [ "$open_subs" -gt 0 ]; then
              echo "**Open sub-tickets:** $open_subs of $sub_total"
              echo ""
            fi
            echo "Rule: a ticket is only closed once all tasks are checked off with evidence (commit, merge, CI run, measurement) and all sub-tickets are done. Unfinished tasks are completed, not removed. Please finish them, check them off and then close the ticket again."
          } > comment.md

          gh issue reopen "$NUMBER" --repo "$REPO" --comment "$(cat comment.md)"
          {
            echo "Ticket #$NUMBER reopened."
            echo ""
            cat comment.md
          } >> "$GITHUB_STEP_SUMMARY"

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [reopen]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
