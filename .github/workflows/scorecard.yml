name: OpenSSF Scorecard

# Private repo: results are not published (publish_results only for public repos)
# but stored as a JSON artifact plus a job summary.
# Once the repo is public, SARIF + Code Scanning + badge data run automatically.
# The analysis job deliberately contains no run steps and no env (a requirement of
# the Scorecard workflow verification when publish_results is set).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: ${{ github.event.repository.private && 'scorecard.json' || 'scorecard.sarif' }}
          results_format: ${{ github.event.repository.private && 'json' || 'sarif' }}
          # Optional fine-grained PAT (read-only) for checks such as Branch-Protection.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: ${{ !github.event.repository.private }}

      - name: Store result as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard.*
          retention-days: 30

      - name: Upload SARIF to Code Scanning
        if: ${{ !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif

  summary:
    name: Scorecard summary
    needs: analysis
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Fetch result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scorecard-results

      - name: Write table
        run: |
          set -euo pipefail
          score=$(jq -r '.score' scorecard.json)
          {
            echo "### OpenSSF Scorecard (private, not published): ${score} / 10"
            echo ""
            echo "| Check | Score | Reason |"
            echo "|---|---|---|"
            jq -r '.checks | sort_by(.score) | .[] | "| \(.name) | \(.score) | \(.reason | gsub("\\|"; "/")) |"' scorecard.json
          } >> "$GITHUB_STEP_SUMMARY"

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [analysis, summary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
