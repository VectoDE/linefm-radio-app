name: Security findings

# Keeps exactly one open ticket with the label typ:sicherheit for every open
# security alert and closes it as soon as the alert is closed.
# Sources: Code Scanning (CodeQL, Semgrep, Trivy, zizmor, Scorecard), Dependabot,
# Secret Scanning.
#
# Triggers: after every CodeQL, Semgrep, Scorecard and Supply Chain run on main,
# plus weekly and manually. No foreign code is checked out and no artifact is
# read; the job only reads the alert APIs and maintains tickets.
#
# The repo is public: the tickets deliberately contain only source, number,
# severity and the link to the alert (visible to maintainers only), no file
# paths, message texts or secret types.
#
# Permissions: GITHUB_TOKEN reads Code Scanning (security-events: read) and
# maintains tickets. GITHUB_TOKEN cannot reach Dependabot and Secret Scanning
# alerts. By the owner's decision (2026-11-22) there is no additional token: the
# sync is limited to Code Scanning. Dependabot and secret findings are reviewed
# in the repo's Security view (SECURITY.md).

on:
  # The dangerous-triggers exception is justified in .github/zizmor.yml.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CodeQL, Semgrep, OpenSSF Scorecard, Supply Chain]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-alerts
  cancel-in-progress: false

jobs:
  sync:
    name: Sync alerts with tickets
    # Only runs from pushes to main (not from change proposal runs with head branch main from forks).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      security-events: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Sync alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABEL: typ:sicherheit
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/alerts"
          mkdir -p "$work"

          # Create the label if it is missing.
          gh label create "$LABEL" --repo "$REPO" --color B60205 \
            --description "Security finding (automatic, from Code Scanning, Dependabot, Secret Scanning)" 2>/dev/null || true

          # Open alerts as lines "source<TAB>number<TAB>severity<TAB>tool<TAB>url".
          : > "$work/open.tsv"
          gh api --paginate "repos/$REPO/code-scanning/alerts?state=open&per_page=100" \
            --jq '.[] | ["code-scanning", (.number|tostring), (.rule.security_severity_level // .rule.severity // "unknown"), .tool.name, .html_url] | @tsv' \
            >> "$work/open.tsv"

          # Regular operation: Code Scanning only. Dependabot and Secret Scanning
          # cannot be read with the Actions token and are not synced.
          echo "::notice::Sync covers Code Scanning only. Dependabot and Secret Scanning alerts are reviewed in the repo's Security view (see SECURITY.md)."

          # Existing tickets with the marker "<!-- sicherheitsfund:source:number -->".
          # The marker keeps its German key because existing tickets already carry it.
          gh issue list --repo "$REPO" --label "$LABEL" --state all --limit 1000 \
            --json number,state,body \
            --jq '.[] | (.body | capture("<!-- sicherheitsfund:(?<k>[a-z-]+):(?<n>[0-9]+) -->")?) as $m
                  | select($m != null) | [$m.k + ":" + $m.n, (.number|tostring), .state] | @tsv' \
            > "$work/tickets.tsv"

          created=0; reopened=0; closed=0
          while IFS=$'\t' read -r kind num sev tool url; do
            key="$kind:$num"
            line="$(awk -F'\t' -v k="$key" '$1==k' "$work/tickets.tsv" | sort -t$'\t' -k2,2n | tail -n 1)"
            if [ -z "$line" ]; then
              body="$(printf '%s\n\n%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s\n%s\n%s\n' \
                "<!-- sicherheitsfund:$key -->" \
                "Created automatically by the Security findings workflow (security-alerts.yml)." \
                "- Source: $tool" \
                "- Alert: $kind #$num" \
                "- Severity: $sev" \
                "- Details (visible to maintainers only): $url" \
                "## Tasks" \
                "- [ ] Review the finding (reachable? real input source?)" \
                "- [ ] Fix it, or close it with a justification as false positive/won't fix" \
                "- [ ] Alert is closed (this ticket then closes automatically)")"
              gh issue create --repo "$REPO" --label "$LABEL" \
                --title "Security finding: $tool, $kind #$num ($sev)" --body "$body"
              created=$((created + 1))
            else
              inum="$(cut -f2 <<<"$line")"; istate="$(cut -f3 <<<"$line")"
              if [ "$istate" = "CLOSED" ]; then
                gh issue reopen "$inum" --repo "$REPO" --comment "Alert $kind #$num is open again."
                reopened=$((reopened + 1))
              fi
            fi
          done < "$work/open.tsv"

          # Close open tickets whose Code Scanning alert is no longer open.
          # Tickets from other sources are left untouched.
          while IFS=$'\t' read -r key inum istate; do
            [ "$istate" = "OPEN" ] || continue
            kind="${key%%:*}"
            [ "$kind" = "code-scanning" ] || continue
            if ! awk -F'\t' -v k="$key" '$1":"$2==k {f=1} END {exit !f}' "$work/open.tsv"; then
              gh issue close "$inum" --repo "$REPO" --reason completed \
                --comment "Alert $key is closed (fixed or dismissed with a justification)."
              closed=$((closed + 1))
            fi
          done < "$work/tickets.tsv"

          {
            echo "### Security findings"
            echo "- Open alerts: $(wc -l < "$work/open.tsv")"
            echo "- Source: Code Scanning only (for Dependabot/Secret Scanning see the Security view)"
            echo "- Tickets created: $created, reopened: $reopened, closed: $closed"
          } >> "$GITHUB_STEP_SUMMARY"

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [sync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
