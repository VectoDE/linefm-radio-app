name: Semgrep

# Semgrep Community Edition (CE) without an account and without a token, as a
# complement to CodeQL. Semgrep does not cover Dart (no ruleset in the registry);
# flutter analyze in ci.yml covers it instead. Targeted checks cover Kotlin
# (android/), Swift (ios/, macos/), JavaScript (web/, tool/a11y), Python (tool/),
# Bash (tool/*.sh), Dockerfile and Compose (deploy/) and the GitHub Actions
# workflows.
# - Official semgrep/semgrep image, pinned by digest (index digest from Docker
#   Hub). To update: pick a new version tag at least 7 days old, fetch the digest
#   from https://hub.docker.com/v2/repositories/semgrep/semgrep/tags/<version>
#   (field "digest") and enter it below.
# - --metrics=off: no usage data is sent to Semgrep.
# - CE only analyzes within a single function (no cross-file analysis; that is
#   only available in the paid Semgrep Code).
# SARIF goes to Code Scanning (not for change proposals from forks). Any finding
# fails the job; justified exceptions use "nosemgrep: <rule-id>" with a comment.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * 4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # SARIF to Code Scanning
    env:
      SEMGREP_IMAGE: semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
      CAN_UPLOAD: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Excluded rule html.security.audit.missing-integrity: it reports every
      # <link>/<script> without integrity, including canonical/hreflang links and
      # own files (legal.css). Subresource Integrity only matters for third-party
      # sources; the web pages load none, and the CSP (script-src/style-src 'self')
      # forbids them. The following step makes sure it stays that way.
      - name: No third-party scripts or stylesheets in web/
        run: |
          set -euo pipefail
          if grep -rnE --include='*.html' '<script[^>]+src="(https?:)?//|<link[^>]+rel="(stylesheet|preload|modulepreload)"[^>]+href="(https?:)?//|<link[^>]+href="(https?:)?//[^"]*"[^>]+rel="(stylesheet|preload|modulepreload)"' web; then
            echo "::error::Third-party source found in web/: an integrity attribute and a CSP allowance are needed, review the Semgrep exclusion"
            exit 1
          fi

      - name: Run Semgrep scan
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src \
            -e SEMGREP_SEND_METRICS=off \
            "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --disable-version-check --quiet \
              --config p/default \
              --config p/owasp-top-ten \
              --config p/secrets \
              --config p/ci \
              --config p/security-audit \
              --config p/kotlin --config r/kotlin \
              --config p/swift --config r/swift \
              --config p/javascript \
              --config p/python \
              --config r/bash \
              --config p/dockerfile \
              --config p/docker-compose \
              --config p/github-actions \
              --exclude-rule html.security.audit.missing-integrity.missing-integrity \
              --sarif --output semgrep.sarif .

      - name: Upload SARIF to Code Scanning
        if: always() && env.CAN_UPLOAD == 'true' && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Gate and summary
        if: always()
        run: |
          set -euo pipefail
          test -s semgrep.sarif || { echo "::error::semgrep.sarif is missing"; exit 1; }
          rules="$(jq '[.runs[].tool.driver.rules[]?] | length' semgrep.sarif)"
          n="$(jq '[.runs[].results[]] | length' semgrep.sarif)"
          {
            echo "### Semgrep CE"
            echo "- Rules: ${rules}, findings: ${n}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" != "0" ]; then
            jq -r '.runs[].results[]
              | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId)"' semgrep.sarif
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 14

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
