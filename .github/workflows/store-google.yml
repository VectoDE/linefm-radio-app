name: Store Google Play

# Uploads the AAB from the GitHub release to a Play track.
# Trigger: release.yml (after publishing) or manually with a tag.
# Without the secret PLAY_SERVICE_ACCOUNT_JSON it is skipped cleanly (note in the summary).
# Tracks: internal (default) and alpha (= "Closed testing"). Production is intentionally
# not selectable; the owner releases it in the Play Console.

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag (vX.Y.Z or vX.Y.Z-suffix)
        type: string
        required: true
      track:
        description: Play track (internal or alpha)
        type: string
        required: false
        default: internal
      status:
        description: draft (release stays a draft) or completed
        type: string
        required: false
        default: draft
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      FIREBASE_CONFIG_JSON:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag of an existing release (form vX.Y.Z)
        type: string
        required: true
      track:
        description: Play track
        type: choice
        options:
          - internal
          - alpha
        default: internal
      status:
        description: Release status (new apps must start with draft)
        type: choice
        options:
          - draft
          - completed
        default: draft

permissions: {}

concurrency:
  group: store-google-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    name: Google Play (${{ inputs.track }})
    runs-on: ubuntu-latest
    environment: store-google
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      TRACK: ${{ inputs.track }}
      STATUS: ${{ inputs.status }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Validate inputs
        run: |
          set -euo pipefail
          case "$TRACK" in internal|alpha) ;; *) echo "::error::Track '$TRACK' not allowed (internal, alpha)"; exit 1 ;; esac
          case "$STATUS" in draft|completed) ;; *) echo "::error::Status '$STATUS' not allowed (draft, completed)"; exit 1 ;; esac

      - name: Validate release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only an existing version tag may be checked out; branch names and
          # commit SHAs are rejected before any repository code runs.
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$INPUT_TAG' is not a version tag (vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N)"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/$INPUT_TAG" > /dev/null; then
            echo "::error::Tag '$INPUT_TAG' does not exist"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      # Even on a manual start (workflow_dispatch) the tag must match pubspec.yaml,
      # as in the "version" job of release.yml.
      - name: Compare tag and pubspec version
        uses: ./.github/actions/tag-version
        with:
          tag: ${{ inputs.tag }}

      - name: Gate Google Play
        id: gate
        uses: ./.github/actions/secret-gate
        with:
          label: Google Play upload (${{ inputs.tag }}, track ${{ inputs.track }})
          checks: |
            PLAY_SERVICE_ACCOUNT_JSON=${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

      - name: Fetch AAB from the release
        id: release
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/fetch-release
        with:
          tag: ${{ inputs.tag }}
          pattern: "*-android.aab"
          token: ${{ github.token }}

      - name: Verify AAB signature
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          aab="$(ls dist/*-android.aab | head -n1)"
          if ! jarsigner -verify "$aab" 2>&1 | grep -q "jar verified"; then
            echo "::error::The AAB in the release is not signed (upload key was missing at build time, see secrets ANDROID_KEYSTORE_*). Play rejects unsigned bundles."
            exit 1
          fi
          echo "AAB: $aab (signed)"
          echo "AAB_PATH=$aab" >> "$GITHUB_ENV"

      # N7: No store upload with open mandatory placeholders in the imprint or the
      # privacy policy, not even for pre-releases. The texts inside the AAB itself
      # are checked, using the check script from the checkout of the tag: tags that do not
      # contain the script yet fail here (intended, no upload without a check).
      # The active telemetry providers are derived as in write-config from the same
      # variables/secrets that build.yml used to build the AAB.
      - name: Check legal texts in the AAB
        if: steps.gate.outputs.ready == 'true'
        env:
          HAS_UMAMI: ${{ vars.UMAMI_URL != '' && vars.UMAMI_WEBSITE_ID != '' }}
          HAS_SENTRY: ${{ vars.SENTRY_DSN != '' }}
          HAS_FIREBASE: ${{ secrets.FIREBASE_CONFIG_JSON != '' }}
        run: |
          set -euo pipefail
          providers=()
          if [ "$HAS_UMAMI" = "true" ]; then providers+=(umami); fi
          if [ "$HAS_SENTRY" = "true" ]; then providers+=(sentry); fi
          if [ "$HAS_FIREBASE" = "true" ]; then providers+=(firebase); fi
          list="$(IFS=,; echo "${providers[*]:-}")"
          python3 -I tool/legal_store_check.py --aab "$AAB_PATH" --providers="$list"

      - name: Upload to Google Play
        if: steps.gate.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.linefm.app
          releaseFiles: ${{ env.AAB_PATH }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          releaseName: ${{ steps.release.outputs.label }}

      - name: Summary
        if: steps.gate.outputs.ready == 'true'
        run: |
          {
            echo "### Google Play"
            echo "- Version: $TAG, track: $TRACK, status: $STATUS"
            if [ "$STATUS" = "draft" ]; then
              echo "- The release stays a draft. Review it in the Play Console and submit it for review there."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [upload]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
