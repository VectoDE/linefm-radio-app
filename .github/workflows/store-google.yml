name: Store Google Play

# Laedt das AAB aus dem GitHub-Release in eine Play-Spur hoch.
# Ausloeser: release.yml (nach dem Veroeffentlichen) oder manuell mit Tag.
# Ohne Secret PLAY_SERVICE_ACCOUNT_JSON wird sauber uebersprungen (Hinweis in der Zusammenfassung).
# Spuren: internal (Standard) und alpha (= "Geschlossener Test"). Produktion ist absichtlich
# nicht auswaehlbar, das gibt der Inhaber in der Play Console frei.

on:
  workflow_call:
    inputs:
      tag:
        description: Versions-Tag (vX.Y.Z oder vX.Y.Z-suffix)
        type: string
        required: true
      track:
        description: Play-Spur (internal oder alpha)
        type: string
        required: false
        default: internal
      status:
        description: draft (Release bleibt Entwurf) oder completed
        type: string
        required: false
        default: draft
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      FIREBASE_CONFIG_JSON:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Versions-Tag eines vorhandenen Releases (Form vX.Y.Z)
        type: string
        required: true
      track:
        description: Play-Spur
        type: choice
        options:
          - internal
          - alpha
        default: internal
      status:
        description: Release-Status (Neue Apps muessen mit draft starten)
        type: choice
        options:
          - draft
          - completed
        default: draft

permissions: {}

concurrency:
  group: store-google-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    name: Google Play (${{ inputs.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      TRACK: ${{ inputs.track }}
      STATUS: ${{ inputs.status }}
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Eingaben pruefen
        run: |
          set -euo pipefail
          case "$TRACK" in internal|alpha) ;; *) echo "::error::Spur '$TRACK' nicht erlaubt (internal, alpha)"; exit 1 ;; esac
          case "$STATUS" in draft|completed) ;; *) echo "::error::Status '$STATUS' nicht erlaubt (draft, completed)"; exit 1 ;; esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # S3-04: auch bei manuellem Start (workflow_dispatch) muss der Tag zu pubspec.yaml
      # passen, wie im Job "version" von release.yml.
      - name: Tag und pubspec-Version vergleichen
        uses: ./.github/actions/tag-version
        with:
          tag: ${{ inputs.tag }}

      - name: Gate Google Play
        id: gate
        uses: ./.github/actions/secret-gate
        with:
          label: Google-Play-Upload (${{ inputs.tag }}, Spur ${{ inputs.track }})
          checks: |
            PLAY_SERVICE_ACCOUNT_JSON=${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

      - name: AAB aus dem Release holen
        id: release
        if: steps.gate.outputs.ready == 'true'
        uses: ./.github/actions/fetch-release
        with:
          tag: ${{ inputs.tag }}
          pattern: "*-android.aab"
          token: ${{ github.token }}

      - name: Signatur des AAB pruefen
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          aab="$(ls dist/*-android.aab | head -n1)"
          if ! jarsigner -verify "$aab" 2>&1 | grep -q "jar verified"; then
            echo "::error::Das AAB im Release ist nicht signiert (Upload-Key fehlte beim Build, siehe Secrets ANDROID_KEYSTORE_*). Play lehnt unsignierte Bundles ab."
            exit 1
          fi
          echo "AAB: $aab (signiert)"
          echo "AAB_PATH=$aab" >> "$GITHUB_ENV"

      # N7: Kein Store-Upload mit offenen Pflicht-Platzhaltern im Impressum oder in der
      # Datenschutzerklaerung, auch nicht fuer Vorabversionen. Geprueft werden die Texte im
      # AAB selbst, mit dem Pruefskript aus dem Checkout des Tags: Tags, die das Skript noch
      # nicht enthalten, scheitern hier (gewollt, kein Upload ohne Pruefung).
      # Die aktiven Telemetrie-Anbieter leiten sich wie in write-config aus denselben
      # Variablen/Secrets ab, mit denen build.yml das AAB gebaut hat (R3-P02).
      - name: Rechtstexte im AAB pruefen
        if: steps.gate.outputs.ready == 'true'
        env:
          HAS_UMAMI: ${{ vars.UMAMI_URL != '' && vars.UMAMI_WEBSITE_ID != '' }}
          HAS_SENTRY: ${{ vars.SENTRY_DSN != '' }}
          HAS_FIREBASE: ${{ secrets.FIREBASE_CONFIG_JSON != '' }}
        run: |
          set -euo pipefail
          providers=()
          if [ "$HAS_UMAMI" = "true" ]; then providers+=(umami); fi
          if [ "$HAS_SENTRY" = "true" ]; then providers+=(sentry); fi
          if [ "$HAS_FIREBASE" = "true" ]; then providers+=(firebase); fi
          list="$(IFS=,; echo "${providers[*]:-}")"
          python3 -I tool/legal_store_check.py --aab "$AAB_PATH" --providers="$list"

      - name: Nach Google Play hochladen
        if: steps.gate.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.linefm.app
          releaseFiles: ${{ env.AAB_PATH }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          releaseName: ${{ steps.release.outputs.label }}

      - name: Zusammenfassung
        if: steps.gate.outputs.ready == 'true'
        run: |
          {
            echo "### Google Play"
            echo "- Version: $TAG, Spur: $TRACK, Status: $STATUS"
            if [ "$STATUS" = "draft" ]; then
              echo "- Der Release bleibt Entwurf. In der Play Console pruefen und dort zur Ueberpruefung senden."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [upload]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
