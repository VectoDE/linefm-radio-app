name: Store Microsoft

# Builds an MSIX with the Store identity and submits it to Partner Center via the Microsoft Store
# Developer CLI (msstore). The MSIX from the release (build.yml) carries the sideload
# identity and is not suitable for the Store, so this workflow rebuilds it.
# Trigger: release.yml (final versions only) or manually with a tag.
# Without the secrets/variables below it is skipped cleanly. Untested (no Partner Center account).
#
# Secrets:    MS_STORE_TENANT_ID, MS_STORE_SELLER_ID, MS_STORE_CLIENT_ID, MS_STORE_CLIENT_SECRET
# Variables:  MS_STORE_PRODUCT_ID, MS_STORE_IDENTITY_NAME, MS_STORE_PUBLISHER,
#             MS_STORE_PUBLISHER_DISPLAY_NAME (values from Partner Center > Product identity)

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag (vX.Y.Z)
        type: string
        required: true
      commit:
        description: "true: submit, false: leave as a draft in Partner Center"
        type: boolean
        required: false
        default: false
    secrets:
      MS_STORE_TENANT_ID:
        required: false
      MS_STORE_SELLER_ID:
        required: false
      MS_STORE_CLIENT_ID:
        required: false
      MS_STORE_CLIENT_SECRET:
        required: false
      FIREBASE_CONFIG_JSON:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag of an existing release (form vX.Y.Z)
        type: string
        required: true
      commit:
        description: Submit (off = draft in Partner Center)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: store-microsoft-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  gate:
    name: Secret gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Validate release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only an existing version tag may be checked out; branch names and
          # commit SHAs are rejected before any repository code runs.
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$INPUT_TAG' is not a version tag (vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N)"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/$INPUT_TAG" > /dev/null; then
            echo "::error::Tag '$INPUT_TAG' does not exist"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      # Even on a manual start (workflow_dispatch) the tag must match pubspec.yaml,
      # as in the "version" job of release.yml.
      - name: Compare tag and pubspec version
        uses: ./.github/actions/tag-version
        with:
          tag: ${{ inputs.tag }}

      - name: Gate Microsoft Store
        id: gate
        uses: ./.github/actions/secret-gate
        with:
          label: Microsoft Store submission (${{ inputs.tag }})
          checks: |
            MS_STORE_TENANT_ID=${{ secrets.MS_STORE_TENANT_ID != '' }}
            MS_STORE_SELLER_ID=${{ secrets.MS_STORE_SELLER_ID != '' }}
            MS_STORE_CLIENT_ID=${{ secrets.MS_STORE_CLIENT_ID != '' }}
            MS_STORE_CLIENT_SECRET=${{ secrets.MS_STORE_CLIENT_SECRET != '' }}
            MS_STORE_PRODUCT_ID=${{ vars.MS_STORE_PRODUCT_ID != '' }}
            MS_STORE_IDENTITY_NAME=${{ vars.MS_STORE_IDENTITY_NAME != '' }}
            MS_STORE_PUBLISHER=${{ vars.MS_STORE_PUBLISHER != '' }}
            MS_STORE_PUBLISHER_DISPLAY_NAME=${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME != '' }}

  submit:
    name: Submit to Microsoft Store
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      COMMIT: ${{ inputs.commit }}
      PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
      IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
      PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
      PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Validate release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only an existing version tag may be checked out; branch names and
          # commit SHAs are rejected before any repository code runs.
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$INPUT_TAG' is not a version tag (vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N)"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/$INPUT_TAG" > /dev/null; then
            echo "::error::Tag '$INPUT_TAG' does not exist"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Determine version
        id: version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag: $TAG"
            exit 1
          fi
          if ! [[ "$PRODUCT_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::error::MS_STORE_PRODUCT_ID contains invalid characters"
            exit 1
          fi
          label="${TAG#v}"
          build_name="${label%%-*}"
          {
            echo "label=$label"
            echo "build_name=$build_name"
            echo "build_number=$(( RUN_NUMBER + ${BUILD_NUMBER_OFFSET:-100} ))"
          } >> "$GITHUB_OUTPUT"

      - name: Rust toolchain (for smtc_windows)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          cache: "false"

      - name: Write config
        uses: ./.github/actions/write-config
        with:
          app-env: prod
          app-version: ${{ steps.version.outputs.label }}
          legal-values-json: ${{ vars.LEGAL_VALUES_JSON }}
          # Store upload: always strict, even on a manual run with a pre-release.
          legal-strict: true
          web-base-url: ${{ vars.WEB_BASE_URL }}
          features-json: ${{ vars.FEATURES_JSON }}
          umami-url: ${{ vars.UMAMI_URL }}
          umami-website-id: ${{ vars.UMAMI_WEBSITE_ID }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          sentry-environment: ${{ vars.SENTRY_ENVIRONMENT }}
          gsc-verification: ${{ vars.GSC_VERIFICATION }}
          gtm-id: ${{ vars.GTM_ID }}
          ga4-measurement-id: ${{ vars.GA4_MEASUREMENT_ID }}
          trust-gridinsoft-url: ${{ vars.TRUST_GRIDINSOFT_URL }}
          trust-trustpilot-url: ${{ vars.TRUST_TRUSTPILOT_URL }}
          firebase-config-json: ${{ secrets.FIREBASE_CONFIG_JSON }}

      - name: Build Windows
        shell: bash
        env:
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: flutter build windows --release --dart-define-from-file=config/app.json --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER"

      - name: Create Store MSIX (no own signature, the Store signs)
        id: msix
        shell: pwsh
        env:
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $name = "linefm-radio-$env:LABEL-windows-store"
          dart run msix:create --build-windows false --store `
            --identity-name $env:IDENTITY_NAME --publisher $env:PUBLISHER `
            --publisher-display-name $env:PUBLISHER_DISPLAY_NAME `
            --version "$env:BUILD_NAME.0" --output-path dist --output-name $name
          if ($LASTEXITCODE -ne 0) { throw 'msix:create failed' }
          $file = Join-Path (Resolve-Path dist).Path "$name.msix"
          if (-not (Test-Path $file)) { throw "MSIX not found: $file" }
          "file=$file" >> $env:GITHUB_OUTPUT

      - name: Install msstore CLI
        uses: microsoft/setup-msstore-cli@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Configure msstore
        shell: pwsh
        env:
          MS_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          msstore settings --enableTelemetry false
          msstore reconfigure --tenantId $env:MS_TENANT_ID --sellerId $env:MS_SELLER_ID --clientId $env:MS_CLIENT_ID --clientSecret $env:MS_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'msstore reconfigure failed' }

      - name: Submit
        shell: pwsh
        env:
          MSIX_FILE: ${{ steps.msix.outputs.file }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishArgs = @('publish', (Split-Path $env:MSIX_FILE), '--inputFile', $env:MSIX_FILE, '--appId', $env:PRODUCT_ID)
          if ($env:COMMIT -ne 'true') { $publishArgs += '--noCommit' }
          msstore @publishArgs
          if ($LASTEXITCODE -ne 0) { throw 'msstore publish failed' }
          "### Microsoft Store" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Version: $env:TAG, product: $env:PRODUCT_ID" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($env:COMMIT -ne 'true') {
            "- Submission is a draft in Partner Center. Review and submit it there (or start the workflow with commit=true)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "- Submission sent, certification is running in Partner Center." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [gate, submit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
