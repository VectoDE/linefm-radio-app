name: Store Snap

# Builds the snap from packaging/snap/snapcraft.yaml (copied to snap/, as snapcraft
# expects) and uploads it to the Snap Store (default: channel edge).
# Trigger: release.yml or manually with a tag. For proposed changes that touch the
# snap packaging, the LGPL check or this workflow it only builds and checks the
# snap from the proposed change (no upload, no secrets). Without the secret SNAPCRAFT_STORE_CREDENTIALS it is
# skipped cleanly and the expensive build does not run at all. Untested (no Linux build
# and no Snap Store account during development).
#
# The snap part builds with the Flutter version from .fvmrc and with config/app.json, which
# the job writes beforehand like the other release builds (packaging/snap/snapcraft.yaml).

on:
  pull_request:
    paths:
      - packaging/snap/**
      - tool/check_native_lgpl.py
      - .github/workflows/store-snap.yml
  workflow_call:
    inputs:
      tag:
        description: Version tag (vX.Y.Z or vX.Y.Z-suffix)
        type: string
        required: true
      channel:
        description: Snap channel (edge, beta, candidate, stable)
        type: string
        required: false
        default: edge
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (form vX.Y.Z)
        type: string
        required: true
      channel:
        description: Snap channel (stable only after testing on edge/candidate)
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable
        default: edge
      build_only:
        description: Build only and keep as artifact, no upload (no store account)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: store-snap-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Secret gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Validate inputs
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::Invalid tag: $TAG"; exit 1; fi
          case "$CHANNEL" in edge|beta|candidate|stable) ;; *) echo "::error::Channel '$CHANNEL' not allowed"; exit 1 ;; esac

      - name: Validate release tag
        if: github.event_name != 'pull_request'
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only an existing version tag may be checked out; branch names and
          # commit SHAs are rejected before any repository code runs.
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$INPUT_TAG' is not a version tag (vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N)"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/$INPUT_TAG" > /dev/null; then
            echo "::error::Tag '$INPUT_TAG' does not exist"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      # Even on a manual start (workflow_dispatch) the tag must match pubspec.yaml,
      # as in the "version" job of release.yml.
      - name: Compare tag and pubspec version
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/tag-version
        with:
          tag: ${{ inputs.tag }}

      - name: Gate Snap Store
        id: gate
        if: ${{ !inputs.build_only && github.event_name != 'pull_request' }}
        uses: ./.github/actions/secret-gate
        with:
          label: Snap Store upload (${{ inputs.tag }}, channel ${{ inputs.channel }})
          checks: |
            SNAPCRAFT_STORE_CREDENTIALS=${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}

  publish:
    name: Build and upload snap
    needs: gate
    if: needs.gate.outputs.ready == 'true' || inputs.build_only || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # PR builds and build-only runs never touch store credentials, so they skip the protected environment.
    environment: ${{ (github.event_name != 'pull_request' && !inputs.build_only) && 'store-snap' || '' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Validate release tag
        if: github.event_name != 'pull_request'
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Only an existing version tag may be checked out; branch names and
          # commit SHAs are rejected before any repository code runs.
          if ! [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$INPUT_TAG' is not a version tag (vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N)"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/$INPUT_TAG" > /dev/null; then
            echo "::error::Tag '$INPUT_TAG' does not exist"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}
          persist-credentials: false

      - name: Version from the tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            echo "label=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            # Proposed change: version from pubspec.yaml (without +build number).
            echo "label=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml | head -n1)" >> "$GITHUB_OUTPUT"
          fi

      # Same build values as the other release builds; the snap part reads
      # config/app.json from the source tree.
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          pub-get: "false"

      - name: Write config
        id: cfg
        uses: ./.github/actions/write-config
        with:
          app-env: prod
          app-version: ${{ steps.version.outputs.label }}
          legal-values-json: ${{ vars.LEGAL_VALUES_JSON }}
          web-base-url: ${{ vars.WEB_BASE_URL }}
          features-json: ${{ vars.FEATURES_JSON }}
          umami-url: ${{ vars.UMAMI_URL }}
          umami-website-id: ${{ vars.UMAMI_WEBSITE_ID }}
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          sentry-environment: ${{ vars.SENTRY_ENVIRONMENT }}

      # N7: fill the legal texts from LEGAL_VALUES_JSON and fail on open
      # required placeholders. Providers come from config/app.json, so
      # telemetry-dependent fields become required once a provider is active.
      # The check script comes from the tag checkout; older tags without it
      # fail here on purpose.
      - name: Fill and check legal texts
        # Release gate only; a build of a proposed change is never published.
        if: github.event_name != 'pull_request'
        env:
          LEGAL_VALUES_JSON: ${{ vars.LEGAL_VALUES_JSON }}
          PROVIDERS: ${{ steps.cfg.outputs.providers }}
        run: python3 -I tool/legal_store_check.py --fill --providers="$PROVIDERS"

      - name: Copy snapcraft.yaml to snap/
        run: |
          set -euo pipefail
          mkdir -p snap
          cp packaging/snap/snapcraft.yaml snap/snapcraft.yaml

      - name: Build snap
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0

      # The proprietary app may only ship LGPL builds of libmpv and FFmpeg.
      # Unpack the snap and read the build configuration embedded in the
      # libraries; fails on any GPL part (tool/check_native_lgpl.py).
      - name: Check libmpv and FFmpeg are LGPL
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          set -euo pipefail
          if ! command -v unsquashfs >/dev/null; then
            bash tool/ci/apt_update.sh -qq
            sudo apt-get install -y -qq squashfs-tools
          fi
          unsquashfs -q -d "$RUNNER_TEMP/snap-root" "$SNAP_FILE"
          python3 -I tool/check_native_lgpl.py "$RUNNER_TEMP/snap-root"

      - name: Store snap as artifact
        if: ${{ inputs.build_only || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap-${{ inputs.tag || github.sha }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload snap
        if: ${{ !inputs.build_only && github.event_name != 'pull_request' }}
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ inputs.channel }}

      - name: Summary
        if: ${{ !inputs.build_only && github.event_name != 'pull_request' }}
        env:
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          {
            echo "### Snap Store"
            echo "- Version: $TAG, channel: $CHANNEL"
            echo "- Next step: test the snap (\`snap install linefm-radio --channel=$CHANNEL\`), then promote the channel."
          } >> "$GITHUB_STEP_SUMMARY"

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [gate, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
