name: Supply Chain

# Checks that SECURITY.md promises. The reports are attached to the run as an
# artifact (14 days); the summary states the number of findings.
# - OSV: known vulnerabilities in the Dart dependencies (pubspec.lock) and in the
#   accessibility tooling (tool/a11y/package-lock.json) via the official action
#   google/osv-scanner-action. packages/linefm_firebase has no lock file of its
#   own (library package); its dependencies only appear in pubspec.lock after
#   tool/enable_firebase.dart and are covered from then on.
# - Secret scan: gitleaks over the entire git history. As a CLI from the release,
#   because the gitleaks action requires a license for organizations. Version and
#   SHA-256 are pinned here; an update changes both values together.
# - Trivy: filesystem (dependencies incl. dev, secrets, misconfiguration in
#   Dockerfile and IaC) and the web container built from deploy/traefik/Dockerfile.
#   As a CLI from the release with a pinned SHA-256 instead of trivy-action: in March 2026
#   the tags of trivy-action and setup-trivy were compromised
#   (GHSA-69fq-xp46-6x23). SARIF (all severities) goes to code scanning,
#   HIGH/CRITICAL fail the job (image: fixable only, see step).
#   Justified individual exceptions belong in .trivyignore.yaml.
# - Workflow check: zizmor (SARIF to code scanning, configuration in
#   .github/zizmor.yml) and actionlint (CLI with pinned SHA-256).
# SARIF uploads only run if the token may write (not for change proposals from forks).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv:
    name: OSV (pubspec.lock, a11y tool)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --format=json
            --output-file=osv-results.json
            --lockfile=pubspec.lock
            --lockfile=tool/a11y/package-lock.json

      - name: OSV summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### OSV (pubspec.lock, tool/a11y/package-lock.json)"
            if [ -s osv-results.json ]; then
              pkgs="$(jq '[.results[]?.packages[]? | select((.vulnerabilities // []) | length > 0)] | length' osv-results.json)"
              vulns="$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' osv-results.json)"
              echo "- Affected packages: ${pkgs}, vulnerabilities: ${vulns}"
              if [ "$vulns" != "0" ]; then
                echo ""
                echo "| Package | Version | IDs |"
                echo "|---|---|---|"
                jq -r '.results[]?.packages[]? | select((.vulnerabilities // []) | length > 0)
                  | "| \(.package.name) | \(.package.version) | \([.vulnerabilities[].id] | join(", ")) |"' osv-results.json
              fi
            else
              echo "- No report generated (scanner did not run?)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OSV report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-report
          path: osv-results.json
          if-no-files-found: ignore
          retention-days: 14

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks and verify checksum
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan history
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" .

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          count=0
          if [ -f "$RUNNER_TEMP/gitleaks.json" ]; then
            count="$(jq 'length' "$RUNNER_TEMP/gitleaks.json")"
          fi
          {
            echo "### Secret scan"
            echo "- gitleaks ${GITLEAKS_VERSION}, findings (redacted): ${count}"
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/gitleaks.json" gitleaks-report.json 2>/dev/null || true

      # The report is generated with --redact: locations without secret values.
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14

  trivy:
    name: Trivy (filesystem, configuration, web container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # SARIF an Code Scanning
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      TRIVY_NO_PROGRESS: "true"
      TRIVY_DISABLE_VEX_NOTICE: "true"
      CAN_UPLOAD: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Trivy and verify checksum
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" --version

      - name: Scan filesystem (SARIF, all severities)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trivy" fs --quiet --scanners vuln,secret,misconfig \
            --include-dev-deps --format sarif --output trivy-fs.sarif .

      # Build the real Dockerfile (incl. apk upgrade), with placeholders instead of
      # the Flutter build: the app files are static and do not change the operating
      # system of the image. This scans exactly the package set that is shipped.
      - name: Build and scan web container (SARIF)
        id: image
        run: |
          set -euo pipefail
          base="$(sed -n 's/^FROM[[:space:]]\+\([^[:space:]]*\).*/\1/p' deploy/traefik/Dockerfile | head -n 1)"
          case "$base" in
            *@sha256:*) ;;
            *) echo "::error file=deploy/traefik/Dockerfile::Base image not pinned by digest: $base"; exit 1 ;;
          esac
          mkdir -p build/web build/hosting/nginx build/hosting/traefik
          cp -r deploy/nginx/snippets build/hosting/nginx/
          cp deploy/traefik/nginx.conf build/hosting/traefik/nginx.conf
          echo '<!doctype html><title>scan</title>' > build/web/index.html
          image="linefm-app-web:scan"
          docker build --pull -f deploy/traefik/Dockerfile -t "$image" .
          echo "image=$image" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/trivy" image --quiet --skip-db-update --scanners vuln,secret \
            --format sarif --output trivy-image.sarif "$image"

      - name: SARIF to code scanning (filesystem)
        if: always() && env.CAN_UPLOAD == 'true' && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: SARIF to code scanning (web container)
        if: always() && env.CAN_UPLOAD == 'true' && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Filesystem gate: any HIGH/CRITICAL finding fails the job.
      - name: Gate filesystem (HIGH, CRITICAL)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trivy" fs --quiet --skip-db-update --scanners vuln,secret,misconfig \
            --include-dev-deps --severity HIGH,CRITICAL --exit-code 1 --format table .

      # Web container gate: only vulnerabilities with an available fix. Packages without
      # a fix have nothing to update; they still appear in the SARIF (code scanning)
      # and are re-evaluated on every run (apk upgrade, Dependabot digest updates).
      - name: Gate web container (HIGH, CRITICAL, fixable)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trivy" image --quiet --skip-db-update --scanners vuln,secret \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table "$IMAGE"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          count() { [ -s "$1" ] && jq '[.runs[].results[]] | length' "$1" || echo "no report"; }
          {
            echo "### Trivy ${TRIVY_VERSION}"
            echo "- Filesystem (all severities): $(count trivy-fs.sarif)"
            echo "- Web container (all severities): $(count trivy-image.sarif)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: trivy-*.sarif
          if-no-files-found: ignore
          retention-days: 14

  workflows:
    name: Workflow check (zizmor, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # SARIF an Code Scanning
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      CAN_UPLOAD: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zizmor from a hash-verified wheel file (the action pins every version by
      # hash). With write access as SARIF to code scanning, otherwise as plain text with
      # exit code (change proposals from forks).
      - name: zizmor
        id: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          persona: regular
          advanced-security: ${{ env.CAN_UPLOAD }}

      # SARIF output sets no exit code: count findings here.
      - name: Gate zizmor
        if: env.CAN_UPLOAD == 'true'
        run: |
          set -euo pipefail
          sarif="$RUNNER_TEMP/zizmor"
          test -s "$sarif" || { echo "::error::zizmor SARIF missing"; exit 1; }
          n="$(jq '[.runs[].results[] | select((.suppressions // []) | length == 0)] | length' "$sarif")"
          echo "### zizmor: ${n} open findings" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" != "0" ]; then
            jq -r '.runs[].results[] | select((.suppressions // []) | length == 0)
              | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' "$sarif"
            exit 1
          fi

      - name: Download actionlint and verify checksum
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      # With shellcheck (preinstalled on the runner) for the run blocks. Gate from
      # severity "warning"; style and info hints (e.g. SC2086 for intentionally
      # split build flags, SC2012) do not fail the job.
      - name: actionlint
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [osv, gitleaks, trivy, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
