name: Uptime

# Checks every 30 minutes whether the web version and the laut.fm API respond.
# Runs only if the repository variable WEB_BASE_URL is set (the same
# variable as for the web build, e.g. https://app.linefm.de). Without it
# the run skips itself with a note.
#
# On failure a ticket with the label "uptime" is created. If an open uptime
# ticket already exists, the run comments there (at most every 6 hours)
# instead of creating a new one. It never closes a ticket; the operator does that.
# When everything is reachable again, a single note is added to the open ticket.
#
# GitHub does not run scheduled workflows to the minute and may delay them
# under high load. This is an alerting hint, not an operations guarantee. Docs:
# docs/betrieb/RUNBOOK.md.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Check availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check variable
        id: gate
        run: |
          set -euo pipefail
          if [ -z "${WEB_BASE_URL:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Uptime skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The repository variable WEB_BASE_URL is not set (Settings > Secrets and variables > Actions > Variables)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "$WEB_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]]; then
            echo "::error::WEB_BASE_URL must be an https address without a path, found: $WEB_BASE_URL"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Probe addresses
        id: probe
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -uo pipefail
          base="${WEB_BASE_URL%/}"
          : > failures.txt
          check() {
            local name="$1" url="$2" code
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              --retry 2 --retry-delay 5 --retry-all-errors "$url" 2>curl.err)" || code="000"
            if [ "$code" = "200" ]; then
              echo "OK   $name $url"
            else
              echo "FAIL $name $url (HTTP $code)"
              echo "- $name: $url responds with HTTP $code" >> failures.txt
            fi
          }
          check "Web-Version" "$base/"
          check "Web-Version, version.json" "$base/version.json"
          check "laut.fm-API" "https://api.laut.fm/station/linefm"
          if [ -s failures.txt ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### Uptime"
            if [ -s failures.txt ]; then cat failures.txt; else echo "All addresses respond with HTTP 200."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or comment on ticket
        if: steps.probe.outputs.failed == 'true'
        run: |
          set -euo pipefail
          gh label create uptime --repo "$REPO" --color D93F0B \
            --description "Uptime monitor: service unreachable" 2>/dev/null || true
          number="$(gh issue list --repo "$REPO" --label uptime --state open \
            --json number --jq '.[0].number // empty')"
          {
            echo "Checked: $(date -u '+%Y-%m-%d %H:%M') UTC"
            echo
            cat failures.txt
            echo
            echo "Run: $RUN_URL"
          } > body.md
          if [ -z "$number" ]; then
            {
              cat body.md
              echo
              echo "## Tasks"
              echo
              echo "- [ ] Clarify the cause (procedure: docs/betrieb/INCIDENT.md)"
              echo "- [ ] Roll back if necessary (docs/betrieb/RUNBOOK.md)"
              echo "- [ ] Service reachable again, post-incident review for S1 or S2"
            } > new.md
            gh issue create --repo "$REPO" --label uptime \
              --title "Uptime: service unreachable" --body-file new.md
          else
            last="$(gh issue view "$number" --repo "$REPO"               --json createdAt,comments               --jq '(.comments | last | .createdAt) // .createdAt')"
            age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
            if [ "$age" -ge 21600 ]; then
              gh issue comment "$number" --repo "$REPO" --body-file body.md
            else
              echo "Last entry in #$number is less than 6 hours old, no new comment."
            fi
          fi

      - name: Note recovery in the open ticket
        if: steps.probe.outputs.failed == 'false'
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$REPO" --label uptime --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          [ -n "$number" ] || exit 0
          marker="<!-- uptime-recovered -->"
          lastbody="$(gh issue view "$number" --repo "$REPO" --json comments             --jq '(.comments | last | .body) // ""')"
          if grep -q "uptime-recovered" <<< "$lastbody"; then exit 0; fi
          # Report only once: if the last comment is already the recovery note, nothing happens.
          printf '%s\nAll addresses respond with HTTP 200 again (%s UTC). The operator closes the ticket once the cause is resolved.\n\nRun: %s\n' \
            "$marker" "$(date -u '+%Y-%m-%d %H:%M')" "$RUN_URL" > ok.md
          gh issue comment "$number" --repo "$REPO" --body-file ok.md

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [probe]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
