name: Uptime

# Prueft alle 30 Minuten, ob die Web-Version und die laut.fm-API antworten.
# Laeuft nur, wenn die Repository-Variable WEB_BASE_URL gesetzt ist (dieselbe
# Variable wie beim Web-Build, z. B. https://app.linefm.de). Ohne sie
# ueberspringt sich der Lauf mit einem Hinweis.
#
# Bei einem Fehler entsteht ein Issue mit dem Label "uptime". Gibt es schon ein
# offenes Uptime-Issue, kommentiert der Lauf dort (hoechstens alle 6 Stunden)
# statt ein neues anzulegen. Er schliesst nie ein Issue. Das macht der Betreiber.
# Wird alles wieder erreichbar, steht einmal ein Hinweis im offenen Issue.
#
# GitHub fuehrt geplante Laeufe nicht minutengenau aus und kann sie bei hoher
# Last verzoegern. Das ist ein Hinweisgeber, keine Betriebszusage. Doku:
# docs/betrieb/RUNBOOK.md.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    name: Erreichbarkeit pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Runner haerten
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Variable pruefen
        id: gate
        run: |
          set -euo pipefail
          if [ -z "${WEB_BASE_URL:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Uptime uebersprungen" >> "$GITHUB_STEP_SUMMARY"
            echo "Die Repository-Variable WEB_BASE_URL ist nicht gesetzt (Einstellungen > Secrets and variables > Actions > Variables)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! [[ "$WEB_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]]; then
            echo "::error::WEB_BASE_URL muss eine https-Adresse ohne Pfad sein, gefunden: $WEB_BASE_URL"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Adressen abfragen
        id: probe
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -uo pipefail
          base="${WEB_BASE_URL%/}"
          : > failures.txt
          check() {
            local name="$1" url="$2" code
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 \
              --retry 2 --retry-delay 5 --retry-all-errors "$url" 2>curl.err)" || code="000"
            if [ "$code" = "200" ]; then
              echo "OK   $name $url"
            else
              echo "FAIL $name $url (HTTP $code)"
              echo "- $name: $url antwortet mit HTTP $code" >> failures.txt
            fi
          }
          check "Web-Version" "$base/"
          check "Web-Version, version.json" "$base/version.json"
          check "laut.fm-API" "https://api.laut.fm/station/linefm"
          if [ -s failures.txt ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### Uptime"
            if [ -s failures.txt ]; then cat failures.txt; else echo "Alle Adressen antworten mit HTTP 200."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Issue anlegen oder kommentieren
        if: steps.probe.outputs.failed == 'true'
        run: |
          set -euo pipefail
          gh label create uptime --repo "$REPO" --color D93F0B \
            --description "Uptime-Monitor: Dienst nicht erreichbar" 2>/dev/null || true
          number="$(gh issue list --repo "$REPO" --label uptime --state open \
            --json number --jq '.[0].number // empty')"
          {
            echo "Geprueft: $(date -u '+%d.%m.%Y %H:%M') UTC"
            echo
            cat failures.txt
            echo
            echo "Lauf: $RUN_URL"
          } > body.md
          if [ -z "$number" ]; then
            {
              cat body.md
              echo
              echo "## Aufgaben"
              echo
              echo "- [ ] Ursache klaeren (Ablauf: docs/betrieb/INCIDENT.md)"
              echo "- [ ] Falls noetig Rollback (docs/betrieb/RUNBOOK.md)"
              echo "- [ ] Dienst wieder erreichbar, Nachbetrachtung bei S1 oder S2"
            } > new.md
            gh issue create --repo "$REPO" --label uptime \
              --title "Uptime: Dienst nicht erreichbar" --body-file new.md
          else
            last="$(gh issue view "$number" --repo "$REPO"               --json createdAt,comments               --jq '(.comments | last | .createdAt) // .createdAt')"
            age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
            if [ "$age" -ge 21600 ]; then
              gh issue comment "$number" --repo "$REPO" --body-file body.md
            else
              echo "Letzter Eintrag in #$number ist juenger als 6 Stunden, kein neuer Kommentar."
            fi
          fi

      - name: Entwarnung im offenen Issue vermerken
        if: steps.probe.outputs.failed == 'false'
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$REPO" --label uptime --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          [ -n "$number" ] || exit 0
          marker="<!-- uptime-recovered -->"
          lastbody="$(gh issue view "$number" --repo "$REPO" --json comments             --jq '(.comments | last | .body) // ""')"
          if grep -q "uptime-recovered" <<< "$lastbody"; then exit 0; fi
          # Nur einmal melden: Ist der letzte Kommentar schon die Entwarnung, passiert nichts.
          printf '%s\nAlle Adressen antworten wieder mit HTTP 200 (%s UTC). Das Issue schliesst der Betreiber, wenn die Ursache geklaert ist.\n\nLauf: %s\n' \
            "$marker" "$(date -u '+%d.%m.%Y %H:%M')" "$RUN_URL" > ok.md
          gh issue comment "$number" --repo "$REPO" --body-file ok.md
