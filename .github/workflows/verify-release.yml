name: Verify release signatures

# Verifies the cosign bundles (*.sigstore.json) of a release with every pinned
# cosign version (2.x and 3.x, SHA-256 pins in tool/release/cosign-pins.txt)
# and reports a table per version in the job summary and as an artifact.
# Read-only: the release is only downloaded, nothing is signed or published.
# Release to check: the tag input, the tag of a published release, or, for
# changes, the latest pre-release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (empty: latest pre-release)"
        required: false
        type: string
  release:
    types: [published]
  pull_request:
    paths:
      - tool/release/**
      - .github/workflows/verify-release.yml

permissions: {}

concurrency:
  group: verify-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: cosign matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${EVENT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag="$(gh release list -R "$REPO" --exclude-drafts --limit 30 \
              --json tagName,isPrerelease -q '[.[] | select(.isPrerelease)][0].tagName')"
          fi
          if [ -z "$tag" ] || [ "$tag" = null ]; then
            echo "No release to verify found." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release assets (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" -R "$REPO" -D "$RUNNER_TEMP/assets"
          ls -l "$RUNNER_TEMP/assets"

      - name: Verify with every pinned cosign version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          report=out/cosign-matrix.md
          {
            echo "### cosign verification of \`$TAG\`"
            echo
            echo "| cosign | result | verified | failed |"
            echo "|---|---|---|---|"
          } > "$report"
          status=0
          mapfile -t versions < <(awk '!/^#/ && NF {print $1}' tool/release/cosign-pins.txt | sort -uV)
          for v in "${versions[@]}"; do
            log="out/cosign-$v.log"
            if bin="$(tool/release/verify_cosign.sh fetch "$v" "$RUNNER_TEMP/cosign")" \
              && tool/release/verify_cosign.sh verify "$bin" "$RUNNER_TEMP/assets" > "$log" 2>&1; then
              result=pass
            else
              result=FAIL
              status=1
              # fetch errors go to stderr of the failed command, keep them
              [ -f "$log" ] || echo "download or checksum check failed" > "$log"
            fi
            ok="$(sed -n 's/^verified: \([0-9]*\), failed: \([0-9]*\)$/\1/p' "$log" | tail -1)"
            bad="$(sed -n 's/^verified: \([0-9]*\), failed: \([0-9]*\)$/\2/p' "$log" | tail -1)"
            echo "| $v | $result | ${ok:--} | ${bad:--} |" >> "$report"
          done
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Store result as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cosign-matrix
          path: out/
          if-no-files-found: ignore
          retention-days: 30

  # Zero-warning rule: any warning or error in a job log or a check-run
  # annotation of this run fails it. Fix the cause; tool/build_log_allowlist.json
  # holds the few documented upstream exceptions, each with an expiry date.
  log-gate:
    name: Log gate
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Log gate
          token: ${{ github.token }}
