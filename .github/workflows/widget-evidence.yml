name: Widget evidence

# iOS home screen widget in light and dark mode, captured in the macOS
# simulator. The widget views are rendered by WidgetSnapshotTests (RunnerTests)
# with ImageRenderer: WidgetKit has no API to place a widget on the simulator
# home screen, and scripting the widget gallery breaks with each iOS release.
# A short simulator video shows the app while the system appearance switches.
# Everything ends up in the artifact "widget-evidence".
#
# The desktop jobs capture the macOS and Linux apps: Gatekeeper behaviour for
# the unsigned DMG, the window title bar in light and dark mode and the app
# icon in Dock and Finder (artifact "desktop-evidence-macos"), and the Linux
# window under Xvfb (artifact "desktop-evidence-linux").
# Hosted macOS runners run a logged-in Aqua session, and the runner image
# grants /bin/bash ScreenCapture and osascript AppleEvents for System Events in
# the TCC database, so screencapture and osascript work without a prompt.
# Whether Gatekeeper is enabled on the image is not documented: the job writes
# "spctl --status" and "spctl --assess" next to the screenshots, so a missing
# dialog is explained by the log instead of silently absent.

on:
  pull_request:
    paths:
      - ios/LinefmWidget/**
      - ios/RunnerTests/**
      - ios/Shared/**
      - ios/Runner.xcodeproj/**
      - macos/**
      - linux/**
      - lib/platform/desktop/**
      - .github/workflows/widget-evidence.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: widget-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-widget:
    name: iOS widget light and dark
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write configuration
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Pick a simulator and start booting it
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid')
          test -n "$udid" && test "$udid" != "null"
          # Boots while the build runs; the capture step waits for it.
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Generates Generated.xcconfig and the plugin packages. The app itself is
      # built once below, by xcodebuild, together with the test bundle.
      - name: Configure the iOS project
        # precache makes sure the iOS engine artifacts exist before config-only.
        run: |
          flutter precache --ios
          flutter build ios --config-only --simulator --debug --dart-define-from-file=config/app.json

      - name: Build app, widget and tests once
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -quiet \
            -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$UDID,arch=arm64" \
            -derivedDataPath build/derived-data \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

      - name: Render widget snapshots (light and dark)
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/widget-evidence"
          mkdir -p "$out"
          # No parallel testing and no concurrent destinations: otherwise
          # xcodebuild clones and boots extra simulators and runs the suite
          # once per clone.
          TEST_RUNNER_WIDGET_SNAPSHOT_DIR="$out" xcodebuild test-without-building -quiet \
            -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$UDID,arch=arm64" \
            -derivedDataPath build/derived-data \
            -parallel-testing-enabled NO -disable-concurrent-destination-testing \
            -only-testing:RunnerTests/WidgetSnapshotTests \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO
          for f in small-light small-dark medium-light medium-dark; do
            test -s "$out/widget-$f.png"
          done

      - name: Screenshots and video of the simulator
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/widget-evidence"
          app=$(find build/derived-data/Build/Products -maxdepth 2 -name Runner.app -path '*iphonesimulator*' | head -n 1)
          test -n "$app"
          test -x "$app/PlugIns/LinefmWidgetExtension.appex/LinefmWidgetExtension"
          # The tests ran on this device (no clones); make sure it is up.
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$app"
          xcrun simctl io "$UDID" recordVideo --display=internal --codec=h264 --force "$out/simulator.mp4" &
          rec=$!
          sleep 3
          for mode in light dark light; do
            xcrun simctl ui "$UDID" appearance "$mode"
            sleep 2
            xcrun simctl io "$UDID" screenshot --display=internal "$out/home-$mode.png"
          done
          xcrun simctl launch "$UDID" de.linefm.app
          sleep 8
          for mode in dark light; do
            xcrun simctl ui "$UDID" appearance "$mode"
            sleep 3
            xcrun simctl io "$UDID" screenshot --display=internal "$out/app-$mode.png"
          done
          kill -INT "$rec"
          wait "$rec" || true
          test -s "$out/simulator.mp4"

      - name: Upload widget evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: widget-evidence
          path: ${{ runner.temp }}/widget-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Result
        run: |
          echo "- iOS widget: light and dark snapshots, simulator screenshots and video in artifact widget-evidence" >> "$GITHUB_STEP_SUMMARY"

  macos-desktop:
    name: macOS Gatekeeper, title bar and icon
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write configuration
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Build macOS app (unsigned)
        run: flutter build macos --release --dart-define-from-file=config/app.json

      - name: Unsigned DMG with quarantine flag
        shell: bash
        # create-dmg drives Finder by AppleScript; bound it on a headless runner.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-evidence"
          # The PNG backgrounds are rendered from this SVG; a parse error there
          # ends up as an error page inside the DMG window.
          xmllint --noout packaging/macos/dmg-background.svg
          # Same script as the release build, so the screenshot shows the
          # styled window with the illustrated first-launch guide.
          bash packaging/macos/create_dmg.sh "build/macos/Build/Products/Release/LINEFM Radio.app" "$RUNNER_TEMP/linefm.dmg"
          # Same flag a browser sets on a download; Gatekeeper only checks
          # quarantined files.
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "$RUNNER_TEMP/linefm.dmg"

      # Every GUI call is bounded: open, osascript (Automation prompt) or a
      # Gatekeeper dialog can block forever on a runner without a user.
      - name: Gatekeeper flow
        shell: bash
        timeout-minutes: 8
        run: |
          # The default shell runs with -e; spctl rejecting the unsigned app
          # (exit 3) is the expected result here, not a failure.
          set +e -uo pipefail
          out="$RUNNER_TEMP/desktop-evidence"
          log="$out/gatekeeper.txt"
          app="/Applications/LINEFM Radio.app"
          # macOS has no coreutils timeout; perl alarm ends the command.
          bounded() { local secs=$1; shift; perl -e 'alarm shift; exec @ARGV' "$secs" "$@"; }
          # Harden-Runner installs a macOS system extension; macOS answers with
          # a "System Extension Blocked" alert (UserNotificationCenter) and a
          # Notification Center banner that would cover the evidence.
          dismiss_noise() {
            pkill -x UserNotificationCenter || true
            bounded 20 osascript -e 'with timeout of 15 seconds' -e 'tell application "System Events" to tell process "NotificationCenter" to repeat with w in windows' -e 'try' -e 'perform (first action of w whose name contains "Close")' -e 'end try' -e 'end repeat' -e 'end timeout' >/dev/null 2>&1 || true
            sleep 1
          }
          # Capture only the front window of a process; full screen as fallback.
          shoot_window() {
            local proc=$1 file=$2 b
            b=$(bounded 20 osascript -e 'with timeout of 15 seconds' -e "tell application \"System Events\" to tell process \"$proc\"" -e 'set {x, y} to position of window 1' -e 'set {w, h} to size of window 1' -e 'return (x as text) & "," & (y as text) & "," & (w as text) & "," & (h as text)' -e 'end tell' -e 'end timeout' 2>/dev/null)
            if [[ "$b" =~ ^-?[0-9]+,-?[0-9]+,[0-9]+,[0-9]+$ ]]; then
              echo "## $file bounds of $proc: $b" >> "$RUNNER_TEMP/desktop-evidence/gatekeeper.txt"
              bounded 20 screencapture -x -R "$b" "$file"
            else
              echo "## $file: no window bounds for $proc, full screen" >> "$RUNNER_TEMP/desktop-evidence/gatekeeper.txt"
              bounded 20 screencapture -x "$file"
            fi
          }
          dismiss_noise
          { echo "## sw_vers"; sw_vers; echo "## spctl --status"; bounded 20 spctl --status; } > "$log" 2>&1
          bounded 60 hdiutil attach -nobrowse -noautoopen "$RUNNER_TEMP/linefm.dmg" >> "$log" 2>&1 || { echo "::error::DMG could not be mounted"; exit 1; }
          bounded 20 open -g "/Volumes/LINEFM Radio" || echo "## open DMG window: timed out or failed" >> "$log"
          sleep 6
          bounded 20 osascript -e 'with timeout of 15 seconds' -e 'tell application "Finder" to activate' -e 'end timeout' >> "$log" 2>&1
          sleep 2
          dismiss_noise
          shoot_window Finder "$out/macos-dmg-window.png"
          bounded 120 ditto "/Volumes/LINEFM Radio/LINEFM Radio.app" "$app" || { echo "::error::Copy from the DMG failed"; exit 1; }
          {
            echo "## xattr after copy"; bounded 20 xattr -l "$app"
            echo "## spctl --assess --type execute"; bounded 60 spctl --assess --type execute -vv "$app"; echo "exit=$?"
          } >> "$log" 2>&1
          # ditto from a mounted image does not always carry the flag over;
          # set it on the bundle so Gatekeeper really assesses the launch.
          if ! xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then
            xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "$app"
            echo "## quarantine flag set on the copied app" >> "$log"
          fi
          { echo "## xattr before launch"; bounded 20 xattr -l "$app"; } >> "$log" 2>&1
          dismiss_noise
          # The Gatekeeper dialog may or may not appear on a runner; record
          # what happened instead of failing.
          bounded 20 open "$app" >> "$log" 2>&1 || echo "## open app: timed out or refused" >> "$log"
          sleep 8
          pkill -x UserNotificationCenter || true
          shoot_window CoreServicesUIAgent "$out/macos-gatekeeper-open.png"
          {
            echo "## foreground processes"
            bounded 30 osascript -e 'with timeout of 20 seconds' -e 'tell application "System Events" to get name of every process whose background only is false' -e 'end timeout' || echo "(osascript timed out or was not allowed)"
          } >> "$log" 2>&1
          # Dismisses the dialogs, closes the DMG window, brings System
          # Settings to the front and scrolls to "Open Anyway".
          dismiss_noise
          bash .github/scripts/macos-privacy-security.sh "$out/macos-privacy-security.png" "$log"
          bounded 60 hdiutil detach -quiet "/Volumes/LINEFM Radio" || bounded 60 hdiutil detach -force -quiet "/Volumes/LINEFM Radio" || true
          test -s "$log"

      - name: Title bar light and dark, icon in Dock and Finder
        shell: bash
        timeout-minutes: 8
        run: |
          # Bounded GUI calls may time out; the screenshots below decide.
          set +e -uo pipefail
          out="$RUNNER_TEMP/desktop-evidence"
          app="/Applications/LINEFM Radio.app"
          bounded() { local secs=$1; shift; perl -e 'alarm shift; exec @ARGV' "$secs" "$@"; }
          # Harden-Runner installs a macOS system extension; macOS answers with
          # a "System Extension Blocked" alert (UserNotificationCenter) and a
          # Notification Center banner that would cover the evidence.
          dismiss_noise() {
            pkill -x UserNotificationCenter || true
            bounded 20 osascript -e 'with timeout of 15 seconds' -e 'tell application "System Events" to tell process "NotificationCenter" to repeat with w in windows' -e 'try' -e 'perform (first action of w whose name contains "Close")' -e 'end try' -e 'end repeat' -e 'end timeout' >/dev/null 2>&1 || true
            sleep 1
          }
          # Capture only the front window of a process; full screen as fallback.
          shoot_window() {
            local proc=$1 file=$2 b
            b=$(bounded 20 osascript -e 'with timeout of 15 seconds' -e "tell application \"System Events\" to tell process \"$proc\"" -e 'set {x, y} to position of window 1' -e 'set {w, h} to size of window 1' -e 'return (x as text) & "," & (y as text) & "," & (w as text) & "," & (h as text)' -e 'end tell' -e 'end timeout' 2>/dev/null)
            if [[ "$b" =~ ^-?[0-9]+,-?[0-9]+,[0-9]+,[0-9]+$ ]]; then
              echo "## $file bounds of $proc: $b" >> "$RUNNER_TEMP/desktop-evidence/gatekeeper.txt"
              bounded 20 screencapture -x -R "$b" "$file"
            else
              echo "## $file: no window bounds for $proc, full screen" >> "$RUNNER_TEMP/desktop-evidence/gatekeeper.txt"
              bounded 20 screencapture -x "$file"
            fi
          }
          appearance() {
            bounded 30 osascript -e 'with timeout of 20 seconds' -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $1" -e 'end timeout'
          }
          # The window evidence must not depend on the Gatekeeper outcome.
          xattr -dr com.apple.quarantine "$app"
          for name in light dark; do
            dark=false
            if [ "$name" = dark ]; then dark=true; fi
            appearance "$dark"
            bounded 20 open "$app"
            sleep 10
            dismiss_noise
            shoot_window "LINEFM Radio" "$out/macos-titlebar-$name.png"
            pkill -x "LINEFM Radio" || true
            sleep 2
          done
          appearance false
          bounded 20 open "$app"
          sleep 8
          bounded 20 open -R "$app"
          sleep 4
          dismiss_noise
          bounded 20 screencapture -x "$out/macos-icon-dock-finder.png"
          pkill -x "LINEFM Radio" || true
          missing=0
          for f in dmg-window gatekeeper-open privacy-security titlebar-light titlebar-dark icon-dock-finder; do
            test -s "$out/macos-$f.png" || { echo "::error::Missing screenshot macos-$f.png"; missing=1; }
          done
          exit "$missing"

      # The same Gatekeeper flow again in dark mode, so the guide can show both
      # appearances. The title bar step removed the quarantine flag; set it
      # again so the launch is assessed.
      - name: Gatekeeper dialog in dark mode
        shell: bash
        timeout-minutes: 8
        run: |
          set +e -uo pipefail
          out="$RUNNER_TEMP/desktop-evidence"
          log="$out/gatekeeper.txt"
          app="/Applications/LINEFM Radio.app"
          bounded() { local secs=$1; shift; perl -e 'alarm shift; exec @ARGV' "$secs" "$@"; }
          dismiss_noise() {
            pkill -x UserNotificationCenter || true
            bounded 20 osascript -e 'with timeout of 15 seconds' -e 'tell application "System Events" to tell process "NotificationCenter" to repeat with w in windows' -e 'try' -e 'perform (first action of w whose name contains "Close")' -e 'end try' -e 'end repeat' -e 'end timeout' >/dev/null 2>&1 || true
            sleep 1
          }
          shoot_window() {
            local proc=$1 file=$2 b
            b=$(bounded 20 osascript -e 'with timeout of 15 seconds' -e "tell application \"System Events\" to tell process \"$proc\"" -e 'set {x, y} to position of window 1' -e 'set {w, h} to size of window 1' -e 'return (x as text) & "," & (y as text) & "," & (w as text) & "," & (h as text)' -e 'end tell' -e 'end timeout' 2>/dev/null)
            if [[ "$b" =~ ^-?[0-9]+,-?[0-9]+,[0-9]+,[0-9]+$ ]]; then
              echo "## $file bounds of $proc: $b" >> "$log"
              bounded 20 screencapture -x -R "$b" "$file"
            else
              echo "## $file: no window bounds for $proc, full screen" >> "$log"
              bounded 20 screencapture -x "$file"
            fi
          }
          appearance() {
            bounded 30 osascript -e 'with timeout of 20 seconds' -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $1" -e 'end timeout'
          }
          appearance true
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "$app"
          dismiss_noise
          bounded 20 open "$app" >> "$log" 2>&1 || echo "## dark: open app timed out or refused" >> "$log"
          sleep 8
          pkill -x UserNotificationCenter || true
          shoot_window CoreServicesUIAgent "$out/macos-gatekeeper-open-dark.png"
          dismiss_noise
          bash .github/scripts/macos-privacy-security.sh "$out/macos-privacy-security-dark.png" "$log"
          appearance false
          for f in gatekeeper-open-dark privacy-security-dark; do
            test -s "$out/macos-$f.png" || { echo "::error::Missing screenshot macos-$f.png"; exit 1; }
          done

      # Ready-to-commit copies with the file names the guide embeds. Fetch with
      # gh run download -n gatekeeper-screenshots -D docs/assets/macos
      - name: Stage Gatekeeper screenshots for the guide
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop-evidence"
          dest="$RUNNER_TEMP/gatekeeper-screenshots"
          mkdir -p "$dest"
          cp "$out/macos-gatekeeper-open.png" "$dest/gatekeeper-dialog-light.png"
          cp "$out/macos-gatekeeper-open-dark.png" "$dest/gatekeeper-dialog-dark.png"
          cp "$out/macos-privacy-security.png" "$dest/privacy-security-light.png"
          cp "$out/macos-privacy-security-dark.png" "$dest/privacy-security-dark.png"
          mkdir -p "$RUNNER_TEMP/dmg-window"
          cp "$out/macos-dmg-window.png" "$RUNNER_TEMP/dmg-window/dmg-window.png"

      - name: Upload Gatekeeper screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gatekeeper-screenshots
          path: ${{ runner.temp }}/gatekeeper-screenshots
          if-no-files-found: error
          retention-days: 30

      # The mounted DMG window on its own, to review the background image.
      - name: Upload DMG window screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-window
          path: ${{ runner.temp }}/dmg-window
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-evidence-macos
          path: ${{ runner.temp }}/desktop-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Result
        run: |
          echo "- macOS: DMG, Gatekeeper, Privacy & Security, title bar light/dark, Dock/Finder icon in artifact desktop-evidence-macos (details in gatekeeper.txt)" >> "$GITHUB_STEP_SUMMARY"

  linux-desktop:
    name: Linux title bar light and dark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: System packages
        uses: ./.github/actions/linux-deps

      - name: Screen capture packages
        run: sudo apt-get install -y -q --no-install-recommends xvfb openbox imagemagick gnome-themes-extra

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write configuration
        uses: ./.github/actions/write-config
        with:
          app-env: dev

      - name: Build Linux
        run: flutter build linux --release --dart-define-from-file=config/app.json

      - name: Screenshots under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/desktop-evidence"
          mkdir -p "$out"
          bin="$PWD/build/linux/x64/release/bundle/linefm_radio"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          # A window manager draws server-side decorations, as on a desktop.
          openbox &
          sleep 2
          for name in light dark; do
            theme=Adwaita
            if [ "$name" = dark ]; then theme=Adwaita:dark; fi
            GTK_THEME="$theme" "$bin" &
            pid=$!
            sleep 12
            import -window root "$out/linux-titlebar-$name.png"
            kill "$pid" || true
            wait "$pid" || true
          done
          test -s "$out/linux-titlebar-light.png"
          test -s "$out/linux-titlebar-dark.png"

      - name: Upload Linux evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-evidence-linux
          path: ${{ runner.temp }}/desktop-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Result
        run: |
          echo "- Linux: title bar light/dark under Xvfb in artifact desktop-evidence-linux" >> "$GITHUB_STEP_SUMMARY"

  # Zero-warning rule, same as the other workflows.
  log-gate:
    name: Widget evidence log gate
    needs: [ios-widget, macos-desktop, linux-desktop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan job logs and annotations
        uses: ./.github/actions/log-gate
        with:
          job-name: Widget evidence log gate
          token: ${{ github.token }}
