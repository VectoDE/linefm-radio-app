# Configuration for zizmor (supply-chain.yml, workflow check job).
# Every exception needs a justification and a review point for when it expires.
rules:
  # self-repository (since zizmor 1.30) recommends "uses: $/.github/actions/..."
  # instead of "./.github/actions/..." (GitHub, since 2026-07-30). Not a security
  # finding in the strict sense: our local actions always run after actions/checkout
  # with persist-credentials: false, from our own commit. Switch postponed because
  # actionlint 1.7.12 (current version) still reports the syntax as an error
  # (known open parser bugs in actionlint). Switch once actionlint supports it.
  self-repository:
    disable: true
  # dangerous-triggers: security-alerts.yml uses workflow_run to sync the alerts
  # after the scanners on main. The job checks nothing out, reads no artifacts and
  # uses no data from the triggering run (only alert APIs and tickets). Expires
  # when GitHub offers a trigger "after Code Scanning upload".
  dangerous-triggers:
    ignore:
      - security-alerts.yml
