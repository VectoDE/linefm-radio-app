# Konfiguration fuer zizmor (supply-chain.yml, Job "Workflow-Pruefung").
# Jede Ausnahme braucht eine Begruendung und einen Pruefpunkt, wann sie faellt.
rules:
  # self-repository (ab zizmor 1.30) empfiehlt "uses: $/.github/actions/..." statt
  # "./.github/actions/..." (GitHub, seit 30.07.2026). Kein Sicherheitsbefund im
  # engeren Sinn: Unsere lokalen Actions laufen immer nach actions/checkout mit
  # persist-credentials: false aus dem eigenen Commit. Umstellung zurueckgestellt,
  # weil actionlint 1.7.12 (aktuelle Version) die Syntax noch als Fehler meldet
  # (known open parser bugs in actionlint). Umstellen, sobald actionlint sie kennt.
  self-repository:
    disable: true
  # dangerous-triggers: security-alerts.yml nutzt workflow_run, um nach den
  # Scannern auf main die Alerts abzugleichen. Der Job checkt nichts aus, liest
  # keine Artefakte und verwendet keine Daten aus dem ausloesenden Lauf (nur
  # Alert-APIs und Tickets). Faellt, wenn GitHub einen Ausloeser "nach Code-Scanning-
  # Upload" anbietet.
  dangerous-triggers:
    ignore:
      - security-alerts.yml
