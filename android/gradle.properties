org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Zero-warning rule: Gradle deprecation warnings fail the build instead of
# scrolling by (Flutter hides most Gradle output, so they would go unseen).
# Show every Gradle deprecation in the log; the build log gate turns each one red.
org.gradle.warning.mode=all
