# Grundeinstellungen der App beim Bauen.
# Nutzen: Datei kopieren, als app.yaml speichern, Werte eintragen.
# Fehlt app.yaml, gelten die Werte hier (alles aus bzw. leer).
# Anleitung: docs/KONFIGURATION.md, Herkunft der Werte: docs/EINRICHTUNG.md
# Alle Werte stehen in der fertigen App und sind lesbar: nur öffentliche
# Kennungen eintragen, keine Passwörter oder geheimen Schlüssel.

# Umgebung.
# Pflicht. Werte: dev oder prod. Standard: dev. Beispiel: prod
APP_ENV: dev

# Adresse der Web-App (Deep Links, Sitemap, Canonical).
# Pflicht. Format: https-URL ohne Schrägstrich am Ende.
# Standard: https://app.linefm.de. Beispiel: https://app.linefm.de
WEB_BASE_URL: https://app.linefm.de

# Umami-Server für anonyme Nutzungsstatistik (nur nach Einwilligung).
# Optional. Format: https-URL. Standard: leer (aus).
# Beispiel: https://stats.linefm.de
UMAMI_URL: ""

# Website-ID in Umami.
# Optional, nur zusammen mit UMAMI_URL. Format: UUID. Standard: leer.
# Beispiel: 1b2c3d4e-0000-0000-0000-000000000000
UMAMI_WEBSITE_ID: ""

# DSN für Absturzberichte (GlitchTip/Sentry, nur nach Einwilligung).
# Optional. Format: https-URL. Standard: leer (aus).
# Beispiel: https://abc123@errors.linefm.de/1
SENTRY_DSN: ""

# Umgebungsname in den Absturzberichten.
# Optional. Text. Standard: leer (dann APP_ENV). Beispiel: production
SENTRY_ENVIRONMENT: ""

# Firebase (Push, Crashlytics) einschalten.
# Optional. Werte: true oder false. Standard: false.
# Beispiel: true (dann alle FIREBASE_*-Werte setzen)
FIREBASE_ENABLED: false

# Firebase-Kennungen aus der Firebase-Konsole.
# Optional, nur mit FIREBASE_ENABLED: true. Text. Standard: leer.
# Beispiel: FIREBASE_PROJECT_ID: linefm-radio
FIREBASE_API_KEY: ""
FIREBASE_PROJECT_ID: ""
FIREBASE_MESSAGING_SENDER_ID: ""
FIREBASE_APP_ID_ANDROID: ""
FIREBASE_APP_ID_IOS: ""
FIREBASE_APP_ID_MACOS: ""
FIREBASE_APP_ID_WEB: ""

# laut.fm-WebSocket statt Abfrage im Takt (ADR 0002).
# Optional. Werte: true oder false. Standard: false. Beispiel: false
WS_ENABLED: false

# Bestätigungscode der Google Search Console (Meta-Tag der Web-App).
# Optional. Text. Standard: leer (kein Meta-Tag). Beispiel: abcDEF123
GSC_VERIFICATION: ""

# Google Tag Manager (nur nach Einwilligung).
# Optional. Format: GTM-XXXXXXX. Standard: leer (aus). Beispiel: GTM-AB12CD3
GTM_ID: ""

# Google Analytics 4 (nur nach Einwilligung).
# Optional. Format: G-XXXXXXXXXX. Standard: leer (aus).
# Beispiel: G-AB12CD34EF
GA4_MEASUREMENT_ID: ""

# Profil-Link für das Gridinsoft-Siegel (nur bei echtem Eintrag).
# Optional. Format: https-URL. Standard: leer (kein Siegel).
# Beispiel: https://gridinsoft.com/online-virus-scanner/url/app-linefm-de
TRUST_GRIDINSOFT_URL: ""

# Profil-Link für das Trustpilot-Siegel (nur bei echtem Eintrag).
# Optional. Format: https-URL. Standard: leer (kein Siegel).
# Beispiel: https://www.trustpilot.com/review/linefm.de
TRUST_TRUSTPILOT_URL: ""

# Feste Adresse, von der die App beim Start die Senderliste nachlädt.
# Optional. Format: https-URL ohne Port, Zugangsdaten und #.
# Standard: leer (nur die mitgelieferte config/stations.yaml).
# Beispiel: https://app.linefm.de/stations.yaml
STATIONS_URL: ""
