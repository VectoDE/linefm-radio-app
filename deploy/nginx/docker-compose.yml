# nginx-Variante als Container ohne Traefik: derselbe Container wie unter deploy/traefik,
# der Port 8080 wird nur lokal veroeffentlicht. TLS terminiert ein vorgeschalteter Proxy
# (nativer nginx/Caddy/Load-Balancer); der Container spricht nur HTTP.
# Start: docker compose up -d --build   (im Ordner deploy/nginx)
# Voraussetzung: build/web und build/hosting liegen im Repo-Wurzelordner (Postbuild gelaufen).
name: linefm-app-nginx

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/traefik/Dockerfile
    image: ${WEB_IMAGE:-linefm-app-web:local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
