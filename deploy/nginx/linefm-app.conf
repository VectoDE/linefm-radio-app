# nginx fuer app.linefm.de auf Ubuntu/Debian (nativ). Installation: docs/hosting-nginx.md
#   /etc/nginx/sites-available/linefm-app.conf  (Symlink nach sites-enabled)
#   /etc/nginx/snippets/linefm-headers.conf
#   /etc/nginx/snippets/linefm-locations.conf
# Die Snippets muessen vorher durch tool/web_postbuild.dart gerendert sein
# (build/hosting/nginx/snippets/), sonst stehen __CSP_CONNECT_EXTRA__, __CSP_SCRIPT_EXTRA__ und __CSP_IMG_EXTRA__ noch darin.

server {
    listen 80;
    listen [::]:80;
    server_name app.linefm.de;

    # Zertifikatsausstellung (certbot --webroot -w /var/www/certbot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        # $server_name statt $host: Ziel haengt nicht vom Host-Header ab.
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.linefm.de;

    ssl_certificate     /etc/letsencrypt/live/app.linefm.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.linefm.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:linefm_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP-Stapling bewusst aus: Let's Encrypt hat die OCSP-Dienste 2025 eingestellt (nur noch CRLs),
    # Zertifikate ohne OCSP-URL machen "ssl_stapling on" wirkungslos und erzeugen nginx-Warnungen.
    # Nur einschalten, wenn die CA des eigenen Zertifikats noch OCSP anbietet:
    #   ssl_stapling on;  ssl_stapling_verify on;  resolver 1.1.1.1 9.9.9.9 valid=300s;
    ssl_stapling off;

    # Versionierte Ordner, Symlink "current" wird atomar umgestellt (Rollback: Symlink zurueck).
    root /var/www/linefm-app/current;
    index index.html;

    access_log /var/log/nginx/linefm-app.access.log;
    error_log  /var/log/nginx/linefm-app.error.log warn;

    include snippets/linefm-locations.conf;
}
