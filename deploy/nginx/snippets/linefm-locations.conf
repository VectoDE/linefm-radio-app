# Auslieferung der Flutter-Web-App (Spec 6.2). Wird in einen server-Block eingebunden,
# der root und index selbst setzt. Cache-Strategie:
#   no-cache + ETag            Einstieg, Bootstrap, sw.js, Manifest, version.json, Rechtstexte
#   immutable (1 Jahr)         main.<hash>.dart.*, canvaskit/<revision>/, assets/fonts/fallback/ (versionierte Pfade)
#   no-cache + ETag            AssetManifest.*, FontManifest.json, NOTICES (feste Namen, Inhalt aendert sich pro Build)
#   1 Tag + SWR 7 Tage + ETag  uebrige Dateien in assets/, icons/, Logos
#   1 Stunde                   robots.txt, sitemap.xml, llms.txt

etag on;
charset utf-8;
absolute_redirect off;
server_tokens off;

# Komprimierung. Brotli nur mit Modul ngx_brotli (siehe docs/hosting-nginx.md); dann zusaetzlich:
#   brotli on;  brotli_comp_level 5;  brotli_static on;
#   brotli_types <dieselbe Liste wie gzip_types unten>;
# Wichtig: NOTICES (ohne Endung), AssetManifest.bin und .otf-Schriften liefert nginx als
# application/octet-stream bzw. font/otf. Ohne diese Typen in gzip_types gehen sie unkomprimiert raus.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/xml application/json application/javascript
           text/javascript application/manifest+json application/wasm image/svg+xml
           application/octet-stream font/otf font/ttf application/vnd.ms-fontobject;

# MIME: mime.types kennt weder .mjs noch .webmanifest. Ein types-Block ersetzt die ganze Tabelle,
# deshalb steht er nur in den beiden betroffenen locations (application/wasm ist in mime.types enthalten).

# Hosting-Dateien und versteckte Dateien nie ausliefern (.well-known bleibt erlaubt).
# Achtung: ^~ beendet die Regex-Suche. Der allgemeine Punktdatei-Block unten greift in
# ^~-Locations deshalb nicht; jede davon traegt dasselbe Verbot als verschachtelte location.
location ~ ^/(_headers|_redirects)$ {
    return 404;
}
location ~ /\.(?!well-known) {
    return 404;
}
location ^~ /.well-known/ {
    location ~ /\.(?!well-known/) { return 404; }
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}
# App-Links: Apple verlangt application/json fuer die Datei ohne Endung.
location = /.well-known/apple-app-site-association {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    types { }
    default_type application/json;
    try_files $uri =404;
}
location = /.well-known/assetlinks.json {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    types { }
    default_type application/json;
    try_files $uri =404;
}

# Inhaltsgehashte Dateien: ein Jahr, unveraenderlich.
location ~ "^/main\.[0-9a-f]{8}\.dart\.(js|mjs|wasm)$" {
    types {
        application/javascript js;
        text/javascript mjs;
        application/wasm wasm;
    }
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
location ^~ /canvaskit/ {
    location ~ /\.(?!well-known/) { return 404; }
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Nicht gehashte Dateien mit festem Namen, deren Inhalt sich pro Build aendert: immer revalidieren.
# (Praefix-Regeln mit ^~ schlagen die Regex-locations; die laengere Regel gewinnt gegen /assets/.)
location ^~ /assets/AssetManifest {
    location ~ /\.(?!well-known/) { return 404; }
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location = /assets/FontManifest.json {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location = /assets/NOTICES {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Ersatzschriften: versionierte Pfade (notosans/v39/<hash>.woff2), unveraenderlich.
# Laengeres Praefix, gewinnt gegen /assets/.
location ^~ /assets/fonts/fallback/ {
    location ~ /\.(?!well-known/) { return 404; }
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Nicht gehashte, selten geaenderte Dateien.
location ^~ /assets/ {
    location ~ /\.(?!well-known/) { return 404; }
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
}
location ^~ /icons/ {
    location ~ /\.(?!well-known/) { return 404; }
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
}
location ~ ^/favicon\.png$ {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
}

# Suchmaschinen und KI-Crawler.
location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# Immer revalidieren (304 ist billig).
location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location ~ ^/(index\.html|flutter_bootstrap\.js|analytics\.js|cast\.js|sw\.js|version\.json|asset-manifest\.txt)$ {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location ~ ^/(impressum|datenschutz)(/|$) {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}

# Sonstige Dateien mit Endung: kein SPA-Fallback, sondern ehrliches 404.
location ~* "\.[a-z0-9]{2,6}$" {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Einstieg und SPA-Routing (Pfad-Strategie): alles ohne Dateiendung liefert index.html.
location / {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
