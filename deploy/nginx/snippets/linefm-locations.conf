# Auslieferung der Flutter-Web-App (Spec 6.2). Wird in einen server-Block eingebunden,
# der root und index selbst setzt. Cache-Strategie:
#   no-cache + ETag            Einstieg, Bootstrap, sw.js, Manifest, version.json, Rechtstexte
#   immutable (1 Jahr)         main.<hash>.dart.*, canvaskit/<revision>/
#   1 Tag + SWR 7 Tage + ETag  assets/, icons/, Logos
#   1 Stunde                   robots.txt, sitemap.xml, llms.txt

etag on;
charset utf-8;
absolute_redirect off;
server_tokens off;

# Komprimierung. Brotli nur mit Modul ngx_brotli (siehe docs/hosting-nginx.md).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/xml application/json application/javascript
           text/javascript application/manifest+json application/wasm image/svg+xml;

# Kein Standard-Mime fuer .mjs und .webmanifest; application/wasm ist in mime.types enthalten.
types {
    include mime.types;
    text/javascript mjs;
    application/manifest+json webmanifest;
}

# Hosting-Dateien und versteckte Dateien nie ausliefern (.well-known bleibt erlaubt).
location ~ ^/(_headers|_redirects)$ {
    return 404;
}
location ~ /\.(?!well-known) {
    return 404;
}
location ^~ /.well-known/ {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# Inhaltsgehashte Dateien: ein Jahr, unveraenderlich.
location ~ "^/main\.[0-9a-f]{8}\.dart\.(js|mjs|wasm)$" {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
location ^~ /canvaskit/ {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Nicht gehashte, selten geaenderte Dateien.
location ^~ /assets/ {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
}
location ^~ /icons/ {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
}
location ~ ^/(favicon\.png|og\.png)$ {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    try_files $uri =404;
}

# Suchmaschinen und KI-Crawler.
location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# Immer revalidieren (304 ist billig).
location ~ ^/(index\.html|flutter_bootstrap\.js|sw\.js|manifest\.webmanifest|version\.json|asset-manifest\.txt)$ {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location ~ ^/(impressum|datenschutz)(/|$) {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}

# Sonstige Dateien mit Endung: kein SPA-Fallback, sondern ehrliches 404.
location ~* "\.[a-z0-9]{2,6}$" {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Einstieg und SPA-Routing (Pfad-Strategie): alles ohne Dateiendung liefert index.html.
location / {
    include snippets/linefm-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
