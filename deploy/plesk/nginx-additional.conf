# Plesk: "Zusaetzliche nginx-Anweisungen" der Domain (Apache- und nginx-Einstellungen).
# Plesk setzt diese Zeilen in den server-Block. Anleitung: docs/hosting-plesk.md
# Voraussetzung: "Intelligente Verarbeitung statischer Dateien" deaktivieren, sonst liefert
# Plesk-nginx statische Dateien ohne diese Header. Keine eigene add_header-Zeile in locations
# ergaenzen, sonst wird die Vererbung der Header unterbrochen.
# Nicht zusammen mit den Headern aus .htaccess verwenden (doppelte Header).
# __CSP_CONNECT_EXTRA__ ersetzt tool/web_postbuild.dart.

etag on;
charset utf-8;
server_tokens off;

# Brotli nur mit Modul ngx_brotli (Plesk liefert es nicht mit); siehe docs/hosting-plesk.md.
# NOTICES (ohne Endung), AssetManifest.bin und .otf kommen als octet-stream bzw. font/otf.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/xml application/json application/javascript
           text/javascript application/manifest+json application/wasm image/svg+xml
           application/octet-stream font/otf font/ttf application/vnd.ms-fontobject;

# Cache-Strategie (Spec 6.2) ueber eine Variable, damit alle Header auf Server-Ebene stehen koennen.
set $linefm_cache "no-cache";
if ($uri ~ "^/main\.[0-9a-f]{8}\.dart\.(js|mjs|wasm)$") {
    set $linefm_cache "public, max-age=31536000, immutable";
}
if ($uri ~ "^/canvaskit/") {
    set $linefm_cache "public, max-age=31536000, immutable";
}
if ($uri ~ "^/(assets|icons)/|^/favicon\.png$") {
    set $linefm_cache "public, max-age=86400, stale-while-revalidate=604800";
}
# Feste Namen, Inhalt aendert sich pro Build: immer revalidieren.
if ($uri ~ "^/assets/(AssetManifest[^/]*|FontManifest\.json|NOTICES)$") {
    set $linefm_cache "no-cache";
}
# Ersatzschriften (L14): versionierte Pfade, unveraenderlich.
if ($uri ~ "^/assets/fonts/fallback/") {
    set $linefm_cache "public, max-age=31536000, immutable";
}
if ($uri ~ "^/(robots\.txt|sitemap\.xml|llms\.txt)$") {
    set $linefm_cache "public, max-age=3600";
}
add_header Cache-Control $linefm_cache always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.linefm.de https://*.mzstatic.com https://assets.laut.fm https://radiogruppe.de; connect-src 'self' https://api.laut.fm wss://api.laut.fm https://itunes.apple.com https://*.mzstatic.com https://cdn.linefm.de https://assets.laut.fm https://radiogruppe.de __CSP_CONNECT_EXTRA__; media-src https://*.laut.fm blob:; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;

# MIME: ein types-Block ersetzt die ganze Tabelle, daher nur in diesen locations.
location ~ ^/main\.[0-9a-f]{8}\.dart\.(js|mjs|wasm)$ {
    types {
        application/javascript js;
        text/javascript mjs;
        application/wasm wasm;
    }
    try_files $uri =404;
}
location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    try_files $uri =404;
}

location ~ ^/(_headers|_redirects)$ {
    return 404;
}

# Versteckte Dateien (.htaccess, .git ...) nie ausliefern, .well-known bleibt erlaubt (S7).
location ~ /\.(?!well-known) {
    return 404;
}

# Rechtstexte: eigene statische Seiten (web/impressum, web/datenschutz), kein SPA-Fallback.
location ~ ^/(impressum|datenschutz)(/|$) {
    try_files $uri $uri/ =404;
}

# Fehlende Dateien mit Endung: 404 statt SPA-Fallback.
location ~* "\.[a-z0-9]{2,6}$" {
    try_files $uri =404;
}

# SPA-Routing (Pfad-Strategie).
location / {
    try_files $uri $uri/ /index.html;
}
