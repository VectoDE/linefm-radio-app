# nginx im Container (nginx-unprivileged, Port 8080). TLS endet bei Traefik.
# Header und Cache-Regeln kommen aus denselben Snippets wie beim nativen nginx,
# damit es genau eine Quelle der Wahrheit gibt.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30;

    # Temp-Pfade im tmpfs, damit das Dateisystem read-only bleiben kann.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        include snippets/linefm-locations.conf;
    }
}
