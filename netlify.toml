# Netlify. Same header set as deploy/cloudflare/_headers, deploy/nginx and deploy/plesk;
# the workflow hosting-headers.yml fails when one of them drifts.
# Netlify sets no CORS header by default and compresses (Brotli/gzip) and adds ETags itself.
# Placeholders (__CSP_*__) stay in this file; tool/web_postbuild.dart writes the rendered copy to build/hosting/.
# Netlify merges every matching rule, so Cache-Control stays in the path rules only and the
# security headers in "/*" only (same layout as _headers).

[build]
  publish = "build/web"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' __CSP_SCRIPT_EXTRA__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.linefm.de https://*.mzstatic.com https://assets.laut.fm __CSP_IMG_EXTRA__; connect-src 'self' https://api.laut.fm wss://api.laut.fm https://itunes.apple.com https://*.mzstatic.com https://cdn.linefm.de https://assets.laut.fm __CSP_CONNECT_EXTRA__; media-src https://*.laut.fm blob:; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/analytics.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/cast.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/asset-manifest.txt"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/impressum/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/datenschutz/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/main.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/AssetManifest.bin"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/AssetManifest.bin.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/AssetManifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/FontManifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/NOTICES"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/fonts/MaterialIcons-Regular.otf"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/fonts/fallback/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/packages/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/shaders/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# SPA fallback (path strategy). Existing files win; unlike nginx, a missing file with an
# extension also gets index.html because Netlify rules cannot exclude extensions.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
