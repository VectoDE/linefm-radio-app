name: linefm_firebase
description: "Optionale Firebase-Anbindung (Analytics + Crashlytics) fuer LINEFM Radio. Nicht Teil des Hauptprojekts, wird nur per tool/enable_firebase.dart aktiviert."
version: 0.0.0-dev
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.2.0
  firebase_analytics: ^13.1.0
  firebase_crashlytics: ^6.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
