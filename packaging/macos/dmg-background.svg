<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <!-- Source of dmg-background.png (660x420) and dmg-background@2x.png.
       Regenerate with a browser renderer (ImageMagick's own SVG renderer drops
       the gradient), e.g. Edge or Chrome headless with window size 660x420 and the
       screenshot switch, and with device scale factor 2 for
       dmg-background@2x.png. No double hyphen may appear inside an XML
       comment, or the renderer shows a parse error page instead.
       Icon positions come from create_dmg.sh: app 170,170, Applications 490,170,
       guide file 590,350. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#595990"/>
      <stop offset="1" stop-color="#2F2F53"/>
    </linearGradient>
  </defs>
  <rect width="660" height="420" fill="url(#bg)"/>
  <g font-family="Arial" fill="#FFFFFF">
    <text x="330" y="38" font-size="17" font-weight="bold" text-anchor="middle">Drag LINEFM Radio into Applications</text>
    <text x="330" y="58" font-size="12" text-anchor="middle" fill-opacity="0.8">Ziehe LINEFM Radio in den Ordner Programme</text>
  </g>
  <g stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 170 H385"/>
    <path d="M365 148 L392 170 L365 192"/>
  </g>
  <g font-family="Arial" fill="#FFFFFF">
    <rect x="16" y="282" width="520" height="124" rx="10" fill="#000000" fill-opacity="0.22"/>
    <text x="32" y="304" font-size="12" font-weight="bold">First launch (app is not notarized) · Erster Start</text>
    <g font-size="11">
      <circle cx="40" cy="331" r="10" fill="#FFFFFF"/>
      <text x="40" y="335" text-anchor="middle" fill="#2F2F53" font-weight="bold">1</text>
      <text x="58" y="328">Open the app from Applications, close the warning with “Done”.</text>
      <text x="58" y="342" fill-opacity="0.75">App aus „Programme“ starten, Warnung mit „Fertig“ schließen.</text>
      <circle cx="40" cy="362" r="10" fill="#FFFFFF"/>
      <text x="40" y="366" text-anchor="middle" fill="#2F2F53" font-weight="bold">2</text>
      <text x="58" y="359">System Settings › Privacy &amp; Security › “Open Anyway”.</text>
      <text x="58" y="373" fill-opacity="0.75">Systemeinstellungen › Datenschutz &amp; Sicherheit › „Dennoch öffnen“.</text>
      <circle cx="40" cy="393" r="10" fill="#FFFFFF"/>
      <text x="40" y="397" text-anchor="middle" fill="#2F2F53" font-weight="bold">3</text>
      <text x="58" y="397">Confirm with password or Touch ID. Details: LIES-MICH-ZUERST.txt</text>
    </g>
  </g>
</svg>
