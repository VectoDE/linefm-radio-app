# Snapcraft-Definition fuer LINEFM Radio (strict, core24).
#
# snapcraft erwartet die Datei unter snap/snapcraft.yaml im Projektstamm.
# Die CI (store-snap.yml) kopiert sie dorthin:
#   mkdir -p snap && cp packaging/snap/snapcraft.yaml snap/snapcraft.yaml
#   snapcraft pack
# Ungetestet: snapcraft laeuft nur unter Linux (LXD/Multipass).
name: linefm-radio
title: LINEFM Radio
base: core24
adopt-info: linefm-radio
summary: Live radio of the LINEFM stations
description: |
  Listen to the LINEFM stations live: LineFM +MAIN, +RAP, +GAMING, +LOFI,
  Radio3FM and FobFM. Shows the current song with cover and keeps your
  favorites. Media keys control playback.

  LINEFM is an offering of RadioGruppe Deutschland on behalf of the LINEFM
  Group. LineFM Studios is owned by Julian Gebauer. Developed by Tim Hauke
  (VectoDE).
license: Proprietary
website: https://app.linefm.de
contact: https://app.linefm.de
icon: linux/assets/icons/hicolor/512x512/apps/de.linefm.app.png
grade: stable
confinement: strict

apps:
  linefm-radio:
    command: linefm_radio
    extensions: [gnome]
    desktop: meta/gui/de.linefm.app.desktop
    common-id: de.linefm.app
    # Die gnome-Erweiterung bringt desktop, wayland, x11, opengl mit.
    # Tray (StatusNotifierItem) braucht unter strict je nach Desktop eine
    # Freigabe; ohne sie laeuft die App ohne Tray-Symbol weiter (TODO: pruefen).
    plugs:
      - audio-playback
      - network
    slots:
      - mpris

slots:
  # MPRIS: Medientasten und Sperrbildschirm-Steuerung. audio_service_mpris
  # meldet org.mpris.MediaPlayer2.linefm_radio.instance<PID> (Kanal-ID unter
  # Linux, lib/services/audio/audio_backend.dart); der mpris-Slot erlaubt den
  # Namen samt ".*"-Endung.
  mpris:
    interface: mpris
    name: linefm_radio

parts:
  # libmpv and FFmpeg are built here as LGPL, like in the Flatpak manifest
  # (packaging/flathub/de.linefm.app.yml): the Ubuntu packages libmpv2 and
  # libavcodec are GPL builds and must not ship with the proprietary app.
  # store-snap.yml checks the packed snap with tool/check_native_lgpl.py.
  # Same versions and checksums as the Flatpak manifest.
  ffmpeg:
    plugin: autotools
    source: https://ffmpeg.org/releases/ffmpeg-8.0.tar.xz
    source-checksum: sha256/b2751fccb6cc4c77708113cd78b561059b6fa904b24162fa0be2d60273d27b8e
    autotools-configure-parameters:
      - --prefix=/usr
      - --libdir=/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}
      - --disable-gpl
      - --disable-nonfree
      - --enable-version3
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-programs
      - --disable-debug
      - --enable-gnutls
      - --enable-pic
      # Upstream code, not ours: compiler warnings would only fill the CI log.
      - --extra-cflags=-w
    # FFmpeg writes absolute paths (prefix=/usr, includedir=/usr/include) into
    # its .pc files. pkg-config then drops -I/usr/include as a system folder,
    # and mpv found neither the staged headers nor the staged libraries. Point
    # the staged .pc files at the stage instead (they are not shipped).
    override-build: |
      craftctl default
      sed -i -E "s#^(prefix|exec_prefix|libdir|includedir)=/usr#\1=${CRAFT_STAGE}/usr#" "$CRAFT_PART_INSTALL"/usr/lib/*/pkgconfig/libav*.pc "$CRAFT_PART_INSTALL"/usr/lib/*/pkgconfig/libsw*.pc
    build-packages:
      - nasm
      - pkg-config
      - libgnutls28-dev
      - zlib1g-dev
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig
      - -usr/share/ffmpeg

  libplacebo:
    plugin: meson
    # Git instead of a tarball so the submodules (glad etc.) come along.
    source: https://code.videolan.org/videolan/libplacebo.git
    source-type: git
    source-commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65 # v7.387.0 (mpv 0.42 needs >= 7.387.0)
    meson-parameters:
      - --buildtype=release
      - -Dvulkan=disabled
      - -Dd3d11=disabled
      - -Dshaderc=disabled
      - -Dlcms=disabled
      - -Ddemos=false
      - -Dtests=false
      - -Dc_args=-w
      - -Dcpp_args=-w
    build-packages:
      - meson
      - ninja-build
      - python3-jinja2
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig

  mpv:
    plugin: meson
    after: [ffmpeg, libplacebo]
    source: https://github.com/mpv-player/mpv/archive/refs/tags/v0.42.0.tar.gz
    source-checksum: sha256/bcfebbfa2b65a6d88dc97ea18117831072373e38b5785a2afb874ed4df5070dd
    meson-parameters:
      - --buildtype=release
      # LGPL only: libmpv ships with a proprietary app (docs/LIZENZEN-DRITTE.md).
      - -Dgpl=false
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dvulkan=disabled
      - -Dtests=false
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dc_args=-w
    # Without this the FFmpeg 6.1 pkg-config files of the GNOME SDK won over
    # the staged FFmpeg 8.0 (mpv found libavfilter 11 next to libavcodec 60
    # and failed). Staged libraries come first.
    build-environment:
      - PKG_CONFIG_PATH: $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig:${PKG_CONFIG_PATH:-}
    build-packages:
      - meson
      - ninja-build
      - pkg-config
      - libass-dev
      - libpulse-dev
      - libasound2-dev
    stage-packages:
      # libass is ISC licensed.
      - libass9
    # Headers and pkg-config stay in the stage for the Flutter build
    # (media_kit_libs_linux), but are not shipped.
    prime:
      - -usr/include
      - -usr/lib/*/pkgconfig

  # No "plugin: flutter": it always builds with the newest stable Flutter and
  # without config/app.json. Instead the part clones the version pinned in
  # .fvmrc and passes config/app.json (written by store-snap.yml) to the
  # build, like the other release builds.
  linefm-radio:
    plugin: nil
    source: .
    # Builds against the LGPL libmpv from the mpv part (stage), not libmpv-dev.
    after: [mpv]
    build-environment:
      - PKG_CONFIG_PATH: $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig:${PKG_CONFIG_PATH:-}
    build-packages:
      - libayatana-appindicator3-dev
      - clang
      - cmake
      - curl
      - git
      - libgtk-3-dev
      - liblzma-dev
      - ninja-build
      - pkg-config
      - unzip
      - xz-utils
    override-build: |
      set -eu
      FLUTTER_VERSION="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc | head -n1)"
      [ -n "$FLUTTER_VERSION" ] || { echo "no Flutter version in .fvmrc" >&2; exit 1; }
      FLUTTER_SDK="$CRAFT_PART_BUILD/.flutter-sdk"
      if [ ! -x "$FLUTTER_SDK/bin/flutter" ]; then
        git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_SDK"
      fi
      export PATH="$FLUTTER_SDK/bin:$PATH"
      flutter config --no-analytics >/dev/null
      flutter --version
      flutter pub get --enforce-lockfile
      if [ -f config/app.json ]; then
        flutter build linux --release --dart-define-from-file=config/app.json
      else
        echo "config/app.json missing, building with default values" >&2
        flutter build linux --release
      fi
      cp -a build/linux/*/release/bundle/. "$CRAFT_PART_INSTALL/"
    stage-packages:
      - libayatana-appindicator3-1
    override-pull: |
      craftctl default
      # Version aus pubspec.yaml (ohne +Build-Nummer).
      craftctl set version="$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"

  desktop-integration:
    plugin: nil
    source: linux/
    override-build: |
      install -Dm644 de.linefm.app.desktop "$CRAFT_PART_INSTALL/meta/gui/de.linefm.app.desktop"
      install -Dm644 assets/icons/hicolor/512x512/apps/de.linefm.app.png "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      # Snapcraft ersetzt Exec; das Symbol kommt aus meta/gui.
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|' "$CRAFT_PART_INSTALL/meta/gui/de.linefm.app.desktop"
