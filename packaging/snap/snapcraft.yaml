# Snapcraft-Definition fuer LINEFM Radio (strict, core24).
#
# snapcraft erwartet die Datei unter snap/snapcraft.yaml im Projektstamm.
# Die CI (store-snap.yml) kopiert sie dorthin:
#   mkdir -p snap && cp packaging/snap/snapcraft.yaml snap/snapcraft.yaml
#   snapcraft pack
# Ungetestet: snapcraft laeuft nur unter Linux (LXD/Multipass).
name: linefm-radio
title: LINEFM Radio
base: core24
adopt-info: linefm-radio
summary: Live radio of the LINEFM stations
description: |
  Listen to the LINEFM stations live: LineFM +MAIN, +RAP, +GAMING, +LOFI,
  Radio3FM and FobFM. Shows the current song with cover and keeps your
  favorites. Media keys control playback.

  LineFM is an offering of RadioGruppe Deutschland on behalf of the LINEFM
  Group. LineFM Studios is owned by Julian Gebauer. Developed by Tim Hauke
  (VectoDE).
license: Proprietary
website: https://app.linefm.de
contact: https://app.linefm.de
icon: linux/assets/icons/hicolor/512x512/apps/de.linefm.app.png
grade: stable
confinement: strict

apps:
  linefm-radio:
    command: linefm_radio
    extensions: [gnome]
    desktop: meta/gui/de.linefm.app.desktop
    common-id: de.linefm.app
    # Die gnome-Erweiterung bringt desktop, wayland, x11, opengl mit.
    # Tray (StatusNotifierItem) braucht unter strict je nach Desktop eine
    # Freigabe; ohne sie laeuft die App ohne Tray-Symbol weiter (TODO: pruefen).
    plugs:
      - audio-playback
      - network
    slots:
      - mpris

slots:
  # MPRIS: Medientasten und Sperrbildschirm-Steuerung. audio_service_mpris
  # meldet org.mpris.MediaPlayer2.linefm_radio.instance<PID> (Kanal-ID unter
  # Linux, lib/services/audio/audio_backend.dart); der mpris-Slot erlaubt den
  # Namen samt ".*"-Endung.
  mpris:
    interface: mpris
    name: linefm_radio

parts:
  # No "plugin: flutter": it always builds with the newest stable Flutter and
  # without config/app.json. Instead the part clones the version pinned in
  # .fvmrc and passes config/app.json (written by store-snap.yml) to the
  # build, like the other release builds.
  linefm-radio:
    plugin: nil
    source: .
    build-packages:
      - libmpv-dev
      - libayatana-appindicator3-dev
      - clang
      - cmake
      - curl
      - git
      - libgtk-3-dev
      - liblzma-dev
      - ninja-build
      - pkg-config
      - unzip
      - xz-utils
    override-build: |
      set -eu
      FLUTTER_VERSION="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc | head -n1)"
      [ -n "$FLUTTER_VERSION" ] || { echo "no Flutter version in .fvmrc" >&2; exit 1; }
      FLUTTER_SDK="$CRAFT_PART_BUILD/.flutter-sdk"
      if [ ! -x "$FLUTTER_SDK/bin/flutter" ]; then
        git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$FLUTTER_SDK"
      fi
      export PATH="$FLUTTER_SDK/bin:$PATH"
      flutter config --no-analytics >/dev/null
      flutter --version
      flutter pub get --enforce-lockfile
      if [ -f config/app.json ]; then
        flutter build linux --release --dart-define-from-file=config/app.json
      else
        echo "config/app.json missing, building with default values" >&2
        flutter build linux --release
      fi
      cp -a build/linux/*/release/bundle/. "$CRAFT_PART_INSTALL/"
    stage-packages:
      - libmpv2
      - libayatana-appindicator3-1
    override-pull: |
      craftctl default
      # Version aus pubspec.yaml (ohne +Build-Nummer).
      craftctl set version="$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"

  desktop-integration:
    plugin: nil
    source: linux/
    override-build: |
      install -Dm644 de.linefm.app.desktop "$CRAFT_PART_INSTALL/meta/gui/de.linefm.app.desktop"
      install -Dm644 assets/icons/hicolor/512x512/apps/de.linefm.app.png "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      # Snapcraft ersetzt Exec; das Symbol kommt aus meta/gui.
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|' "$CRAFT_PART_INSTALL/meta/gui/de.linefm.app.desktop"
