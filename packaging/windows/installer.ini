; Produktdaten fuer den Windows-Installer (installer/windows).
; Der Packer (lfpack) bettet diese Datei in setup.exe ein und haengt die
; Version aus der CI an. Felder und Bedeutung: packaging/windows/README.md.

name=LINEFM Radio
publisher=LineFM Studios
manufacturer=Tim Hauke
exe_name=linefm_radio.exe
url=https://app.linefm.de
; Feste GUID, darf sich nie aendern (identifiziert die Installation fuer
; Updates). Dieselbe GUID wie im frueheren Inno-Setup-Skript.
app_id={6F3B1E52-8C4A-4D7E-9A21-5B0C7D3E91F4}
scheme=linefm
dir_name=LINEFM Radio
; Ersatzwerte fuer den Ordner der Nutzerdaten, falls die EXE keine
; Versionsangaben traegt (sonst CompanyName\ProductName aus der EXE, wie
; path_provider_windows).
data_company=de.linefm
data_product=LINEFM Radio
default_scope=user
default_desktop_shortcut=1
default_start_menu=1
default_autostart=0
