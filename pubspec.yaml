name: linefm_radio
description: "LINEFM Radio - Live-Radio der LINEFM-Sender (LineFM +MAIN, +RAP, +GAMING, +LOFI, Radio3FM, FobFM)."
publish_to: 'none'
# Platzhalter fuer lokale Entwicklung. Die echte Version kommt aus dem Release
# (release.yml, #104) per --build-name/--build-number; CI prueft den Platzhalter.
version: 0.0.0-dev+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  audio_service: ^0.18.19
  # ValueStream fuer AudioHandler.subscribeToChildren (Android Auto, P16).
  rxdart: ^0.28.0
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  flutter_chrome_cast: ^2.0.0
  home_widget: ^0.10.0
  alarm: ^5.15.0
  tray_manager: ^0.9.0
  window_manager: ^0.7.0
  hotkey_manager: ^0.4.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  font_awesome_flutter: ^11.0.0
  sentry_flutter: ^10.5.0
  web: ^1.1.2
  flutter_localizations:
    sdk: flutter
  audio_service_mpris: ^0.2.1
  smtc_windows: ^1.1.0
  # Favoriten-Import (Issue #9): Datei-Dialog auf allen Plattformen, im Web
  # <input type=file> (file_selector_web). Offizielles Paket von flutter.dev.
  file_selector: ^1.1.0
# override-reason(flutter_rust_bridge): smtc_windows 1.1.0 (latest) is generated
# against flutter_rust_bridge 2.11.1 and pins the Rust crate to =2.11.1; newer
# Dart versions fail the bridge's runtime content-hash check. Remove once
# smtc_windows ships FRB 2.13 (upstream KRTirtho/frb_plugins#16). See #129.
dependency_overrides:
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Integrationstest auf Windows (integration_test/, Workflow
  # itest-windows.yml). SDK-Paket, keine zusaetzliche Fremdabhaengigkeit.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.18.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/stations/
    - assets/images/brand/
    - assets/audio/
    - assets/legal/de/
    - assets/legal/en/
    # Lizenztexte der Schriften fuer die Lizenzseite (registerFontLicenses).
    # Die Schriftdateien selbst kommen ueber "fonts:".
    - assets/fonts/OFL.txt
    - assets/fonts/LICENSE-Syncopate-Apache2.txt
    # assets/branding/ wird zur Laufzeit nicht gebraucht (Icons entstehen beim
    # Build, das RadioGruppe-Logo laedt von radiogruppe.de, Entscheidung 47).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Syncopate
      fonts:
        - asset: assets/fonts/Syncopate-Bold.ttf
          weight: 700

# Windows-Paket (MSIX). Publisher wird spaeter aus dem Partner Center uebernommen.
msix_config:
  display_name: LINEFM Radio
  publisher_display_name: LineFM Studios
  identity_name: de.linefm.app
  # msix_version kommt aus dem Release (build.yml: msix:create --version), #104.
  logo_path: assets/branding/icon_1024.png
  capabilities: internetClient
  # Deep Links linefm://play?station=... (P21); Startargument -> main(args).
  protocol_activation: linefm
