# SonarCloud analysis, run by .github/workflows/sonar.yml (CI-based analysis;
# "Automatic Analysis" must be switched off in the SonarCloud project).
# Organization and project key follow the SonarCloud default for GitHub
# imports (owner and owner_repository). Correct both here if the project
# was created with other keys.
sonar.organization=vectode
sonar.projectKey=VectoDE_linefm-radio-app
sonar.projectName=linefm-radio-app

# SonarCloud analyzes Kotlin, Swift, JavaScript, Python, shell, Docker and
# YAML. It has no Dart analyzer: Dart is covered by flutter analyze in ci.yml.
sonar.sources=android,ios,macos,web,tool,deploy,packaging,.github
sonar.exclusions=**/build/**,**/node_modules/**,**/Pods/**,**/*.g.dart,**/generated/**,**/*.min.js
sonar.sourceEncoding=UTF-8
