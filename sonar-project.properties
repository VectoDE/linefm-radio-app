# SonarQube Cloud (CI-Analyse ueber .github/workflows/sonar.yml).
# Schluessel nach dem Standard des GitHub-Imports von SonarQube Cloud. Zeigt das
# Sonar-Projekt nach dem Import andere Werte, hier anpassen (docs/EINRICHTUNG.md 12.4).
sonar.organization=vectode
sonar.projectKey=VectoDE_linefm-radio-app
sonar.projectName=LINEFM Radio

# Dart (lib/), Kotlin (Android), Swift (iOS/macOS), JavaScript (web/, tool/a11y),
# Python und Bash (tool/), Dockerfile (deploy/). C++-Huellen der Desktop-Runner
# (windows/, linux/) sind Flutter-Vorlagen und brauchen fuer Sonar einen Build,
# deshalb nicht im Umfang.
sonar.sources=lib,android/app/src/main,ios/Runner,ios/LinefmWidget,macos/Runner,web,tool,deploy
sonar.tests=test
sonar.exclusions=lib/l10n/gen/**,**/*.g.dart,**/*.freezed.dart,web/icons/**,tool/templates/**
sonar.test.inclusions=test/**/*_test.dart
sonar.sourceEncoding=UTF-8

# Coverage aus "flutter test --coverage" (Job in sonar.yml).
sonar.dart.lcov.reportPaths=coverage/lcov.info
